###TETH E.G.O 무기
items.weapon.melee.ego.redeyes.name=적안
items.weapon.melee.ego.redeyes.stats_desc=적에게 입힌 피해의 _10%%_(올림)만큼 _출혈_을 일으킵니다.
items.weapon.melee.ego.redeyes.ability_name=강타
items.weapon.melee.ego.redeyes.typical_ability_desc=적안을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.redeyes.ability_desc=적안을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.redeyes.desc=그 집념은 E.G.O에까지 이어져 탁월한 대상 추적 능력이 발휘되었다.

items.weapon.melee.ego.beak.name=부리
items.weapon.melee.ego.beak.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n재장전에는 _1턴_이 소요됩니다.
items.weapon.melee.ego.beak.desc=탄환의 표면이 수십 개의 작은 이빨처럼 뾰족한 탓에 그대로 꿰뚫린다면 적에게 꽤 강한 고통을 줄 수 있다.

items.weapon.melee.ego.fragmentsfromsomewhere.name=어딘가의 조각
items.weapon.melee.ego.fragmentsfromsomewhere.stats_desc=이 무기는 떨어진 적을 공격할 수 있습니다.
items.weapon.melee.ego.fragmentsfromsomewhere.ability_name=찌르기
items.weapon.melee.ego.fragmentsfromsomewhere.typical_ability_desc=결투자는 어딘가의 조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.fragmentsfromsomewhere.ability_desc=결투자는 어딘가의 조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.fragmentsfromsomewhere.desc=회사 어딘가에서 이계 너머의 메아리가 들리는 날엔 창에서부터 알 수 없는 빛이 파생된다는 소문이 있다.

items.weapon.melee.ego.regret.name=후회
items.weapon.melee.ego.regret.stats_desc=이 무기는 다른 무기들보다 느립니다.\n대상 주변 적에게 약한 _스플래시 피해_를 입힙니다.
items.weapon.melee.ego.regret.ability_name=강타
items.weapon.melee.ego.regret.typical_ability_desc=후회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.regret.ability_desc=후회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.regret.desc=이 후회에 짓뭉개진 적은 다시는 제대로 된 삶으로 돌아갈 수 없다.

###HE E.G.O 무기
items.weapon.melee.ego.frostsplinter.name=서리조각
items.weapon.melee.ego.frostsplinter.stats_desc=이 무기는 떨어진 적을 공격할 수 있습니다.
items.weapon.melee.ego.frostsplinter.ability_name=찌르기
items.weapon.melee.ego.frostsplinter.typical_ability_desc=결투자는 서리조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.frostsplinter.ability_desc=결투자는 서리조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.frostsplinter.desc=창 끝은 올곧은 동시에 싸늘하다. 무기에 공격당한 대상은 잠깐 동안 스스로를 잃어버린다.

items.weapon.melee.ego.logging.name=벌목
items.weapon.melee.ego.logging.stats_desc=이 무기는 다른 무기보다 정확합니다.
items.weapon.melee.ego.logging.ability_name=강타
items.weapon.melee.ego.logging.typical_ability_desc=벌목을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.logging.ability_desc=벌목을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.logging.desc=나무던 사람이던 다채롭게 대상을 베기에 적합하게 만들어진 도끼.\n\n날만큼은 가는 것을 게을리 하지 않았는지 언제나 반질하다.

items.weapon.melee.ego.laetitia.name=Laetitia
items.weapon.melee.ego.laetitia.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n재장전에는 _2턴_이 소요됩니다.
items.weapon.melee.ego.laetitia.desc=많은 시간이 필요하지만 그만큼의 위력 또한 무시 못 한다.\n투박한 디자인은 오래전 제작된 듯 보인다.

items.weapon.melee.ego.solemnlament.name=엄숙한 애도
items.weapon.melee.ego.solemnlament.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_와 _%1$d-%2$d의 %4$s 피해_를 각각 따로 줍니다.\n\n재장전에는 _2턴_이 소요되며, 이 무기를 든 채 _적을 처치하면 탄환 1발_을 되찾습니다.
items.weapon.melee.ego.solemnlament.desc=애도하는 마음에는 한 가닥의 경박스러움조차도 허용되지 않는다는 듯 엄숙하다.\n\n한 자루는 죽은 자를 위한 비통을, 한 자루는 산 자에 대한 앞선 애도를 상징한다.

###WAW E.G.O 무기
items.weapon.melee.ego.hornet.name=호넷
items.weapon.melee.ego.hornet.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n탄환이 명중하면 피해의 _33%%_(올림)만큼 _출혈_을 일으킵니다. 대상이 이미 출혈 중이면 _3턴_의 _화상_도 입히고, 이미 화상 중이면 _50%%_ 더 큰 피해를 줍니다.\n\n재장전에는 _2턴_이 소요됩니다.
items.weapon.melee.ego.hornet.desc=왕국은 계속해서 부흥해야 했고 그러려면 더 많은 벌들이 필요했다.\n왕국은 역사에 이름이 남겠지만 그를 위해 죽어간 벌들은 누가 기억해줄까.

items.weapon.melee.ego.echo.name=잔향
items.weapon.melee.ego.echo.stats_desc=화살은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n화살을 다시 장전하는 데에는 _1턴_이 소요됩니다.
items.weapon.melee.ego.echo.need_equip=석궁을 장착해야 쏘거나 장전할 수 있습니다.
items.weapon.melee.ego.echo.already_loaded=이미 화살이 장전되어 있습니다.
items.weapon.melee.ego.echo.reloaded=화살을 장전했습니다.
items.weapon.melee.ego.echo.ac_reload=장전
items.weapon.melee.ego.echo.ability_desc=잔향을 가진 결투자는 _즉시 장전_을 사용할 수 있습니다. 턴을 소모하지 않고 화살을 _%d발_ 장전합니다.
items.weapon.melee.ego.echo.desc=모두의 마음 속 욕망이 꽃으로 대체될 때가 온다면, 이 무기는 더 이상 필요가 없을 것이다.

items.weapon.melee.ego.swordsharpenedwithtears.name=눈물로 벼려낸 검
items.weapon.melee.ego.swordsharpenedwithtears.stats_desc=이 무기는 0-3의 피해를 막을 수 있습니다.\n\n공격할 때마다 _눈물_을 1 얻습니다. 눈물이 _3_일 때 공격하면 _앞쪽 3x3 범위_의 적들도 함께 공격하고 눈물이 0이 됩니다.
items.weapon.melee.ego.swordsharpenedwithtears.ability_name=돌진
items.weapon.melee.ego.swordsharpenedwithtears.typical_ability_desc=눈물로 벼려낸 검을 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 일반적으로 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.ego.swordsharpenedwithtears.ability_desc=눈물로 벼려낸 검을 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.ego.swordsharpenedwithtears.desc=날렵하게 찌르기에 적합하게 만들어진 검이다.\n\n검에 재능이 없는 이라도 이 E.G.O만 잡으면 경이로울 정도로 순식간에 적을 벌집처럼 만들어준다.\n\n기사도가 그렇듯, 전투 중엔 어떠한 반칙도 없지만 자비 또한 없다.

items.weapon.melee.ego.inthenameofloveandhate.name=사랑과 증오의 이름으로
items.weapon.melee.ego.inthenameofloveandhate.random_type=무작위
items.weapon.melee.ego.inthenameofloveandhate.ac_shoot=마법탄
items.weapon.melee.ego.inthenameofloveandhate.ac_arcana=아르카나 슬레이브
items.weapon.melee.ego.inthenameofloveandhate.prompt=마법탄을 쏠 곳을 선택하세요
items.weapon.melee.ego.inthenameofloveandhate.arcana_prompt=레이저를 발사할 방향을 선택하세요
items.weapon.melee.ego.inthenameofloveandhate.need_equip=사랑과 증오의 이름으로를 장착해야 사용할 수 있습니다.
items.weapon.melee.ego.inthenameofloveandhate.not_charged=충전량이 부족합니다. (%1$d/%2$d)
items.weapon.melee.ego.inthenameofloveandhate.stats_desc=모든 공격은 _무작위 속성_의 피해를 줍니다.\n\n마법탄은 _%1$d-%2$d의 피해_를 주며 _반드시 명중_합니다. 마법탄은 아군을 꿰뚫고 지나가며 그 아군의 체력을 _%3$d_ 회복시킵니다.\n\n장착 중 서서히 충전되며, 충전이 _%4$d_이 되면 _아르카나 슬레이브_를 발사해 경로 위의 적들에게 _%5$d-%6$d의 피해_를 줄 수 있습니다. 사용하고 나면 _%7$d턴_ 동안 약화됩니다.
items.weapon.melee.ego.inthenameofloveandhate.ability_name=충전
items.weapon.melee.ego.inthenameofloveandhate.ability_desc=사랑과 증오의 이름으로를 가진 결투자는 _충전_을 사용할 수 있습니다. 턴을 소모하지 않고 아르카나 충전량을 _%d_ 얻습니다.
items.weapon.melee.ego.inthenameofloveandhate.desc=모두를 지키고 싶었던 사랑의 형태는 집착의 형태로 마음을 좀먹기 시작했다.\n바로잡으려 하기 시작했을 땐 모든 것이 끝나있었다.

items.weapon.melee.ego.diffraction.name=회절
items.weapon.melee.ego.diffraction.stats_desc=이 무기는 무방비 상태의 적에게 더 강합니다.
items.weapon.melee.ego.diffraction.ability_name=조용한 발걸음
items.weapon.melee.ego.diffraction.typical_ability_desc=회절을 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 3타일까지 즉시 점멸이 가능하며 일반적으로 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.ego.diffraction.ability_desc=회절을 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 3타일까지 즉시 점멸이 가능하며 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.ego.diffraction.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.ego.diffraction.desc=이 E.G.O를 보기 위해서는 강한 집중력이 요구된다.

items.weapon.melee.ego.lamp.name=램프
items.weapon.melee.ego.lamp.ac_charm=매혹
items.weapon.melee.ego.lamp.charm_prompt=매혹할 적을 선택하세요
items.weapon.melee.ego.lamp.no_target=시야 안의 적을 선택해야 합니다.
items.weapon.melee.ego.lamp.cooldown=아직 매혹을 사용할 수 없습니다. (%d턴 남음)
items.weapon.melee.ego.lamp.need_equip=램프를 장착해야 매혹할 수 있습니다.
items.weapon.melee.ego.lamp.stats_desc=이 무기로는 기습 공격을 할 수 없습니다.\n\n_매혹_으로 시야 안의 적 하나를 _10턴_ 동안 매혹할 수 있습니다. 매혹에는 1턴이 걸리며, 다시 쓰려면 _10턴_을 기다려야 합니다.\n당신에게 매혹된 적에게는 _25%_ 더 큰 피해를 줍니다.
items.weapon.melee.ego.lamp.ability_name=강타
items.weapon.melee.ego.lamp.typical_ability_desc=램프를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.lamp.ability_desc=램프를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.lamp$charmcooldown.name=매혹 재사용 대기
items.weapon.melee.ego.lamp$charmcooldown.desc=램프의 매혹을 다시 사용하려면 기다려야 합니다.\n\n남은 턴: %d
items.weapon.melee.ego.lamp.desc=숲 속 생물들을 구할수록 큰 새의 눈도 하나씩 늘어갔다.\n\n무기에는 그 눈부신 자부심들이 묻어나있다.

items.weapon.melee.ego.justitia.name=유스티티아
items.weapon.melee.ego.justitia.stats_desc=이 무기는 _3회_ 타격하며, 대상의 _방어력을 무시_합니다.
items.weapon.melee.ego.justitia.ability_name=심판
items.weapon.melee.ego.justitia.typical_ability_desc=유스티티아를 가진 결투자는 _심판_을 사용할 수 있습니다. 공격 범위 내의 적에게 반드시 명중하는 _3회_ 타격을 가하며, 각 타격은 일반적으로 _%1$d-%2$d_의 피해를 줍니다.
items.weapon.melee.ego.justitia.ability_desc=유스티티아를 가진 결투자는 _심판_을 사용할 수 있습니다. 공격 범위 내의 적에게 반드시 명중하는 _3회_ 타격을 가하며, 각 타격은 _%1$d-%2$d_의 피해를 줍니다.
items.weapon.melee.ego.justitia.desc=어떤 죄의 무게도 소홀히 여기지 않으려 했던 긴 새의 천칭을 기억한다.\n적을 베어내면 그 죄의 흔적까지도 베어낼 수 있을지도 모른다.

items.weapon.melee.ego.goldrush.name=골드러시
items.weapon.melee.ego.goldrush.stats_desc=이 무기는 매우 빠르게 공격할 수 있습니다.\n\n적중하면 _%1$d턴_ 동안 _황금의 길_을 얻습니다(최대 _%2$d중첩_). 중첩마다 근접 공격력이 _%3$d_ 오르고 방어력이 _%4$d_ 내려갑니다.
items.weapon.melee.ego.goldrush.ability_name=연속 타격
items.weapon.melee.ego.goldrush.typical_ability_desc=골드러시를 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수당 일반적으로 _+%d_의 추가 피해를 줍니다. 5턴(적 처치 시 15턴) 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.ego.goldrush.ability_desc=골드러시를 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수당 _+%d_의 추가 피해를 줍니다. 5턴(적 처치 시 15턴) 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.ego.goldrush.desc=탐욕이 굳어 지금의 모습이 되기 전, 가장 빛났을 시기에 휘두르던 주먹이다.
items.weapon.melee.ego.goldrush$goldenroad.name=황금의 길
items.weapon.melee.ego.goldrush$goldenroad.desc=주먹을 휘두를수록 황금빛 길이 앞으로 뻗어 나갑니다.\n\n중첩: %1$d\n근접 공격력: +%2$d\n방어력: -%3$d\n\n남은 턴: %4$d

items.weapon.melee.ego.mimicry.name=미미크리
items.weapon.melee.ego.mimicry.stats_desc=적에게 가한 피해의 _25%_만큼 체력을 회복합니다.
items.weapon.melee.ego.mimicry.ability_name=가르기
items.weapon.melee.ego.mimicry.typical_ability_desc=미미크리를 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.mimicry.ability_desc=미미크리를 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.mimicry.desc=인간의 외형을 모방하고자 했던 마음은 욕심으로만 그치라는 듯 어설프게나마 남아있다.\n종종 이 세계가 아닌 것 같은 낯선 눈동자가 당신을 바라볼 때 전율을 느낀다.

items.weapon.melee.ego.dacapo.name=다카포
items.weapon.melee.ego.dacapo.stats_desc=이 무기는 다른 무기보다 정확하며, 공격 속도가 _1.2배_ 빠릅니다.
items.weapon.melee.ego.dacapo.ability_name=강타
items.weapon.melee.ego.dacapo.typical_ability_desc=다카포를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.dacapo.ability_desc=다카포를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.dacapo.desc=낫이 휘둘리는 모습은 지휘자의 손동작처럼 고요하면서 절제있다.\n이 노래에 악보가 있다면 종말을 연주하는 음악일 것이다.

items.weapon.melee.ego.laughter.name=웃음
items.weapon.melee.ego.laughter.stats_desc=이 무기는 다른 무기들보다 느립니다.\n이 무기는 떨어진 적을 공격할 수 있습니다.\n\n적을 처치하면 체력과 허기를 조금 회복합니다.
items.weapon.melee.ego.laughter.ability_name=찌르기
items.weapon.melee.ego.laughter.typical_ability_desc=결투자는 웃음의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.laughter.ability_desc=결투자는 웃음의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.laughter.desc=이름 모를 직원들의 창백한 얼굴과 거대한 입이 달려 있다.\n\n내려치면 대상을 향해 아귀 같은 입을 벌려 먹어치운다. 그리고 만족은 없다.

###테스트용 영웅
actors.hero.heroclass.malkuth=말쿠트
actors.hero.heroclass.malkuth_desc_short=지휘팀의 세피라. _말쿠트의 수첩_으로 _신속_과 _축복_을 얻어 효율적으로 전투를 수행합니다.
actors.hero.heroclass.malkuth_desc=말쿠트는 사용하면 _3턴의 신속_과 _15턴의 축복_을 얻는 _말쿠트의 수첩_을 가지고 시작합니다. 수첩은 최대 _2회_까지 충전되며, 1회 충전에 _50턴_이 걸립니다.\n\n말쿠트는 또한 _제압봉_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n말쿠트는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 신속의 물약\n_-_ 액체 화염의 물약
actors.hero.heroclass.malkuth_unlock=말쿠트는 자동으로 해금됩니다.

actors.hero.herosubclass.control_sephirah=지휘팀 세피라
actors.hero.herosubclass.control_sephirah_short_desc=_지휘팀 세피라_는 _L사 직원_을 호출해 함께 싸우며, 말쿠트의 수첩의 효과를 직원과 나눕니다.
actors.hero.herosubclass.control_sephirah_desc=지휘팀 세피라는 _직원 호출_ 버튼으로 _L사 직원_ 한 명을 곁에 부를 수 있습니다. 직원은 쓰러질 때까지 함께 다니며 싸우고, 쓰러지면 _50턴_ 뒤에 다시 부를 수 있습니다.\n\n직원의 체력은 말쿠트의 최대 체력의 _절반_이며, 부를 때의 레벨에 비례해 강해집니다.\n\n말쿠트가 수첩을 사용하면 직원도 같은 _신속_과 _축복_을 얻습니다.
actors.hero.herosubclass.history_librarian=역사의 층 지정사서
actors.hero.herosubclass.history_librarian_short_desc=_역사의 층 지정사서_는 시야 안의 불길에서 _열기_를 모아 _아드레날린_으로 바꿉니다.
actors.hero.herosubclass.history_librarian_desc=역사의 층 지정사서는 매 턴 _시야 안에서 불타는 대상_ 하나마다 _열기_를 1 얻습니다(최대 _10_). 자신과 아군이 불타고 있어도 열기를 얻습니다. 주변에 불이 없으면 3턴마다 열기가 1씩 줄어듭니다.\n\n열기가 2 이상이면 _열기 방출_ 버튼으로 열기를 모두 소모해, 열기 2당 1턴의 _아드레날린_을 얻습니다. 아드레날린은 이동을 2배, 공격을 1.5배 빠르게 합니다.

actors.hero.talent.thorough_records.title=철저한 기록
actors.hero.talent.thorough_records.desc=_+1:_ 장착한 무기와 방어구를 _1.75배_ 빠르게 감정합니다.\n\n_+2:_ 장착한 무기와 방어구를 _2.5배_ 빠르게 감정합니다.
actors.hero.talent.swift_response.title=신속한 대응
actors.hero.talent.swift_response.desc=_+1:_ 축복 상태일 때 근접 공격이 _1-2_의 추가 피해를 줍니다.\n\n_+2:_ 축복 상태일 때 근접 공격이 _2-3_의 추가 피해를 줍니다.
actors.hero.talent.overtime.title=업무 연장
actors.hero.talent.overtime.desc=_+1:_ 말쿠트의 수첩으로 얻는 축복의 지속 시간이 _3턴_ 늘어납니다.\n\n_+2:_ 말쿠트의 수첩으로 얻는 축복의 지속 시간이 _5턴_ 늘어납니다.
actors.hero.talent.safety_protocol.title=안전 수칙
actors.hero.talent.safety_protocol.desc=_+1:_ 신속을 얻을 때마다 _3_의 보호막을 얻습니다.\n\n_+2:_ 신속을 얻을 때마다 _5_의 보호막을 얻습니다.
actors.hero.talent.work_snack.title=근무 중 간식
actors.hero.talent.work_snack.desc=_+1:_ 음식을 _1턴_ 만에 먹으며, 먹은 뒤 _5턴_ 동안 축복을 얻습니다.\n\n_+2:_ 음식을 _1턴_ 만에 먹으며, 먹은 뒤 _8턴_ 동안 축복을 얻습니다.
actors.hero.talent.emergency_manual.title=비상 매뉴얼
actors.hero.talent.emergency_manual.desc=_+1:_ 체력이 _30%_ 아래로 떨어지면 말쿠트의 수첩의 효과가 즉시 발동합니다. 재사용 대기 시간은 _150턴_입니다.\n\n_+2:_ 체력이 _30%_ 아래로 떨어지면 말쿠트의 수첩의 효과가 즉시 발동합니다. 재사용 대기 시간은 _100턴_입니다.
actors.hero.talent.joint_command.title=합동 지휘
actors.hero.talent.joint_command.desc=_+1:_ 말쿠트의 수첩의 효과가 _2칸_ 이내의 아군에게도 적용됩니다.\n\n_+2:_ 말쿠트의 수첩의 효과가 _3칸_ 이내의 아군에게도 적용됩니다.
actors.hero.talent.speed_war.title=속도전
actors.hero.talent.speed_war.desc=_+1:_ 신속 상태에서 적을 처치하면 신속이 _1턴_ 늘어납니다.\n\n_+2:_ 신속 상태에서 적을 처치하면 신속이 _2턴_ 늘어납니다.
actors.hero.talent.scroll_filing.title=주문서 정리
actors.hero.talent.scroll_filing.desc=_+1:_ 주문서를 읽으면 _5턴_ 동안 축복을 얻습니다.\n\n_+2:_ 주문서를 읽으면 _8턴_ 동안 축복을 얻습니다.
actors.hero.talent.efficient_work.title=업무 효율화
actors.hero.talent.efficient_work.desc=_+1:_ 말쿠트의 수첩의 1회 충전에 걸리는 시간이 _45턴_으로 줄어듭니다.\n\n_+2:_ 말쿠트의 수첩의 1회 충전에 걸리는 시간이 _40턴_으로 줄어듭니다.\n\n_+3:_ 말쿠트의 수첩의 1회 충전에 걸리는 시간이 _35턴_으로 줄어듭니다.
actors.hero.talent.extra_approval.title=추가 결재
actors.hero.talent.extra_approval.desc=_+1:_ 말쿠트의 수첩으로 얻는 신속의 지속 시간이 _1턴_ 늘어납니다.\n\n_+2:_ 말쿠트의 수첩으로 얻는 신속의 지속 시간이 _2턴_ 늘어납니다.\n\n_+3:_ 말쿠트의 수첩으로 얻는 신속의 지속 시간이 _3턴_ 늘어나고, 수첩이 최대 _3회_까지 충전됩니다.
actors.hero.talent.mobile_command.title=기동 지휘
actors.hero.talent.mobile_command.desc=_+1:_ 신속 상태일 때 회피가 _10%_ 증가합니다.\n\n_+2:_ 신속 상태일 때 회피가 _20%_ 증가합니다.\n\n_+3:_ 신속 상태일 때 회피가 _30%_ 증가합니다.
actors.hero.talent.spearhead_charge.title=선두 돌격
actors.hero.talent.spearhead_charge.desc=_+1:_ 3칸 이상 이동한 뒤의 첫 근접 공격이 _20%_ 더 큰 피해를 줍니다.\n\n_+2:_ 3칸 이상 이동한 뒤의 첫 근접 공격이 _40%_ 더 큰 피해를 줍니다.\n\n_+3:_ 3칸 이상 이동한 뒤의 첫 근접 공격이 _60%_ 더 큰 피해를 줍니다.
actors.hero.talent.tt2_protocol.title=TT2 프로토콜
actors.hero.talent.tt2_protocol.desc=_+1:_ 말쿠트의 수첩을 사용해도 _턴을 소모하지 않습니다_.\n\n_+2:_ 말쿠트의 수첩을 사용해도 턴을 소모하지 않으며, _둔화_와 _불구_를 해제합니다.\n\n_+3:_ 말쿠트의 수첩을 사용해도 턴을 소모하지 않으며, _둔화_, _불구_, _속박_을 해제합니다.
actors.hero.talent.match_flame.title=성냥불
actors.hero.talent.match_flame.desc=_+1:_ 축복을 얻으면 그 지속 시간의 _33%_만큼 _화염과 동화됨_ 상태가 됩니다.\n\n_+2:_ 축복을 얻으면 그 지속 시간의 _66%_만큼 _화염과 동화됨_ 상태가 됩니다.\n\n_+3:_ 축복을 얻으면 그 지속 시간의 _100%_만큼 _화염과 동화됨_ 상태가 됩니다.
actors.hero.talent.spore.title=포자
actors.hero.talent.spore.desc=_+1:_ 불타는 적을 공격하면 준 피해의 _10%_만큼 _출혈_을 추가로 부여합니다.\n\n_+2:_ 불타는 적을 공격하면 준 피해의 _20%_만큼 _출혈_을 추가로 부여합니다.\n\n_+3:_ 불타는 적을 공격하면 준 피해의 _30%_만큼 _출혈_을 추가로 부여합니다.
actors.hero.talent.worker_bee.title=일벌
actors.hero.talent.worker_bee.desc=_+1:_ 불타는 적을 처치하면 말쿠트의 수첩이 _0.1회_ 충전됩니다.\n\n_+2:_ 불타는 적을 처치하면 말쿠트의 수첩이 _0.2회_ 충전됩니다.\n\n_+3:_ 불타는 적을 처치하면 말쿠트의 수첩이 _0.3회_ 충전됩니다.

actors.hero.malkuth.employeecall.name=직원 호출 대기
actors.hero.malkuth.employeecall.desc=L사 직원이 쓰러졌습니다. 새 직원을 부르려면 기다려야 합니다.\n\n남은 턴: %d
actors.hero.malkuth.employeecall.action_name=직원 호출
actors.hero.malkuth.employeecall.no_space=직원을 부를 빈 자리가 없습니다.
actors.hero.malkuth.heat.name=열기
actors.hero.malkuth.heat.desc=시야 안의 불길에서 모은 열기입니다. 열기 방출 버튼으로 열기를 모두 소모해 아드레날린을 얻을 수 있습니다.\n\n열기: %1$d/%2$d\n방출 시 아드레날린: %3$d턴
actors.hero.malkuth.heat.action_name=열기 방출
actors.hero.malkuth.lcorpemployee.name=L사 직원
actors.hero.malkuth.lcorpemployee.desc=지휘팀 세피라의 호출을 받고 달려온 L사 직원이다. 정장 차림이지만 몸놀림은 제법 날래다.

actors.hero.talent$emergencymanualcooldown.name=비상 매뉴얼 재사용 대기
actors.hero.talent$emergencymanualcooldown.desc=비상 매뉴얼을 다시 사용할 수 있을 때까지 기다려야 합니다.\n\n남은 턴: %s

items.artifacts.malkuthnotebook.name=말쿠트의 수첩
items.artifacts.malkuthnotebook.ac_use=사용
items.artifacts.malkuthnotebook.desc=지휘팀 세피라 말쿠트가 업무 지시와 일정을 빼곡히 적어 둔 수첩이다. 펼쳐 보는 것만으로도 다음에 할 일이 명확해진다.
items.artifacts.malkuthnotebook.effect=사용하면 _%1$d턴_ 동안 신속을, _%2$d턴_ 동안 축복을 얻습니다. 최대 _%3$d회_까지 충전되며, 1회 충전에 _%4$d턴_이 걸립니다.
items.artifacts.malkuthnotebook.no_charge=수첩을 다시 쓰려면 충전을 기다려야 합니다.
items.artifacts.malkuthnotebook.cursed=저주받은 수첩은 읽을 수 없습니다.

actors.hero.heroclass.tester=테스터
actors.hero.heroclass.tester_desc_short=테스트용 영웅입니다. _E.G.O 추출 장치_로 원하는 E.G.O 장비를 만들 수 있습니다.
actors.hero.heroclass.tester_desc=테스트용 영웅입니다. 전사의 외형, 재능, 전직을 그대로 사용합니다.\n\n테스터는 정장, 제압봉과 함께 _모든 종류의 가방_, _힘 물약 10개_, _강화 주문서 10개_, 원하는 E.G.O 장비를 만들 수 있는 _E.G.O 추출 장치_, 내성 시험용 과녁을 부르는 _과녁 소환기_를 가지고 시작합니다.
actors.hero.heroclass.tester_unlock=테스터는 자동으로 해금됩니다.

lobotomy.egoextractor.name=E.G.O 추출 장치
lobotomy.egoextractor.ac_extract=추출
lobotomy.egoextractor.choose_risk=추출할 E.G.O의 위험 등급을 선택하세요.
lobotomy.egoextractor.choose=추출할 E.G.O를 선택하세요. 감정된 상태, 저주와 인챈트 없이 +0으로 만들어집니다.
lobotomy.egoextractor.back=뒤로
lobotomy.egoextractor.extracted=%s을(를) 추출했습니다.
lobotomy.egoextractor.desc=테스트용 장치. 원하는 E.G.O 장비를 몇 번이든 만들어 낼 수 있다.

lobotomy.dummysummoner.name=과녁 소환기
lobotomy.dummysummoner.ac_summon=소환
lobotomy.dummysummoner.choose=소환할 과녁을 선택하세요. 과녁은 최대 체력이 100이고 아무 행동도 하지 않습니다. 아군 과녁은 체력 50으로 소환됩니다.
lobotomy.dummysummoner.no_space=주변에 과녁을 놓을 공간이 없습니다.
lobotomy.dummysummoner.desc=테스트용 장치. 피해 배율을 시험할 과녁을 몇 번이든 불러낼 수 있다.

lobotomy.trainingdummy.desc=피해 배율 시험용 과녁. 아무 행동도 하지 않는다.
lobotomy.trainingdummy$resistant.name=내성 과녁 (전 속성 0.5)
lobotomy.trainingdummy$weak.name=취약 과녁 (전 속성 1.5)
lobotomy.trainingdummy$paleweak.name=PALE 과녁 (PALE 2.0)
lobotomy.trainingdummy$ally.name=아군 과녁 (체력 절반)
