###E.G.O 공통 (티어 대신 위험 등급과 피해 유형을 표시한다)
items.weapon.melee.ego.egoweapon.stats_known=이 _%1$s_ 근접 무기는 _%2$d-%3$d의 %4$s 피해_를 입히며 _힘이 %5$d 이상_이어야 제대로 다룰 수 있습니다.
items.weapon.melee.ego.egoweapon.stats_unknown=보통 이 _%1$s_ 근접 무기는 _%2$d-%3$d의 %4$s 피해_를 입히며 _힘이 %5$d 이상_이어야 제대로 다룰 수 있습니다.
items.armor.ego.egoarmor.curr_absorb=이 _%1$s_ 갑옷은 _피해를 %2$d-%3$d까지 흡수_할 수 있으며 제대로 다루기 위해 _%4$d 이상의 힘_이 필요합니다.
items.armor.ego.egoarmor.avg_absorb=보통 이 _%1$s_ 갑옷은 _피해를 %2$d-%3$d까지 흡수_할 수 있으며 제대로 다루기 위해 _%4$d 이상의 힘_이 필요합니다.

###기본 장비
items.armor.ego.suit.name=정장
items.armor.ego.suit.desc=L사 직원에게 지급되는 표준 정장. 환상체 앞에서는 종잇장이나 다름없지만, 없는 것보다는 낫다.
items.armor.ego.suit.discover_hint=모든 영웅이 이 아이템을 가지고 시작합니다.

items.weapon.melee.ego.baton.name=제압봉
items.weapon.melee.ego.baton.ability_name=내려치기
items.weapon.melee.ego.baton.typical_ability_desc=제압봉을 가진 결투자는 _내려치기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 내려치기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 내려치기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.baton.ability_desc=제압봉을 가진 결투자는 _내려치기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 내려치기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 내려치기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.baton.desc=L사 직원에게 지급되는 표준 제압봉. 환상체를 제압하기 위해 만들어졌지만, 그 용도로 쓰기에는 한참 모자라다.
items.weapon.melee.ego.baton.discover_hint=모든 영웅이 이 아이템을 가지고 시작합니다.

###E.G.O 무기
items.weapon.melee.ego.penitence.name=참회
items.weapon.melee.ego.penitence.stats_desc=적에게 _5번_ 명중할 때마다 _10의 보호막_을 얻습니다. 이 보호막은 중첩되지 않습니다.
items.weapon.melee.ego.penitence.ability_name=강타
items.weapon.melee.ego.penitence.typical_ability_desc=참회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.penitence.ability_desc=참회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.penitence.desc='단 한번의 악과 수백 가지의 선행'에게서 추출한 E.G.O. 십자가 모양의 머리 한가운데에서 해골이 조용히 내려다본다. 휘두를 때마다 지은 죄가 조금씩 덜어지는 듯하다.

items.weapon.melee.ego.lifeforadaredevil.name=필사즉생
items.weapon.melee.ego.lifeforadaredevil.ability_name=가르기
items.weapon.melee.ego.lifeforadaredevil.typical_ability_desc=필사즉생을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.lifeforadaredevil.ability_desc=필사즉생을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.lifeforadaredevil.desc='부서져 가는 갑옷'에게서 추출한 E.G.O.\n\n오랜 시간이 흐른 듯한 칼.\n\n그 원형이 바랬듯이, 겁 많은 자들의 손에서는 별 위력을 기대하기 힘들지도 모른다.

items.weapon.melee.ego.magicbullet.name=마탄
items.weapon.melee.ego.magicbullet.ac_shoot=사격
items.weapon.melee.ego.magicbullet.ac_reload=재장전
items.weapon.melee.ego.magicbullet.prompt=사격할 방향을 선택하세요
items.weapon.melee.ego.magicbullet.stats_desc=탄환은 _%1$d-%2$d의 BLACK 피해_를 주며, _반드시 명중_하고 경로 위의 _모든 대상_을 꿰뚫고 지나갑니다.\n\n재장전에는 _3턴_이 소요됩니다.\n\n_마지막 탄환_은 당신의 손을 벗어나 _무작위 대상_을 꿰뚫고 지나갈 것입니다.
items.weapon.melee.ego.magicbullet.need_equip=마탄을 장착해야 사격하거나 재장전할 수 있습니다.
items.weapon.melee.ego.magicbullet.already_loaded=이미 탄환이 가득 장전되어 있습니다.
items.weapon.melee.ego.magicbullet.reloaded=마탄에 탄환을 장전했습니다.
items.weapon.melee.ego.magicbullet.final_shot=일곱 번째 탄환은 악마가 원하는 곳으로 날아간다...
items.weapon.melee.ego.magicbullet.ondeath=마지막 탄환은 당신을 겨누고 있었다.
items.weapon.melee.ego.magicbullet.ability_name=즉시 장전
items.weapon.melee.ego.magicbullet.ability_desc=마탄을 가진 결투자는 _즉시 장전_을 사용할 수 있습니다. 턴을 소모하지 않고 탄환을 _7발_까지 채웁니다.
items.weapon.melee.ego.magicbullet.desc='마탄의 사수'에게서 추출한 E.G.O.\n\n총알은 수평선을 따라 복도를 가로지른다.
items.weapon.melee.ego.magicbullet.quote="역시 네 말대로 어떤 사람이라도 맞출 수 있는 마법의 탄환이로구나."

###테스트용 영웅
actors.hero.heroclass.tester=테스터
actors.hero.heroclass.tester_desc_short=테스트용 영웅입니다. _E.G.O 추출 장치_로 원하는 E.G.O 장비를 만들 수 있습니다.
actors.hero.heroclass.tester_desc=테스트용 영웅입니다. 전사의 외형, 재능, 전직을 그대로 사용합니다.\n\n테스터는 정장, 제압봉과 함께 _모든 종류의 가방_, _힘 물약 10개_, _강화 주문서 10개_, 원하는 E.G.O 장비를 만들 수 있는 _E.G.O 추출 장치_, 내성 시험용 과녁을 부르는 _과녁 소환기_를 가지고 시작합니다.
actors.hero.heroclass.tester_unlock=테스터는 자동으로 해금됩니다.

lobotomy.egoextractor.name=E.G.O 추출 장치
lobotomy.egoextractor.ac_extract=추출
lobotomy.egoextractor.choose=추출할 E.G.O를 선택하세요. 감정된 상태, 저주와 인챈트 없이 +0으로 만들어집니다.
lobotomy.egoextractor.extracted=%s을(를) 추출했습니다.
lobotomy.egoextractor.desc=테스트용 장치. 원하는 E.G.O 장비를 몇 번이든 만들어 낼 수 있다.

lobotomy.dummysummoner.name=과녁 소환기
lobotomy.dummysummoner.ac_summon=소환
lobotomy.dummysummoner.choose=소환할 과녁을 선택하세요. 과녁은 체력이 100이고 아무 행동도 하지 않습니다.
lobotomy.dummysummoner.no_space=주변에 과녁을 놓을 공간이 없습니다.
lobotomy.dummysummoner.desc=테스트용 장치. 피해 배율을 시험할 과녁을 몇 번이든 불러낼 수 있다.

lobotomy.trainingdummy.desc=피해 배율 시험용 과녁. 아무 행동도 하지 않는다.
lobotomy.trainingdummy$resistant.name=내성 과녁 (전 속성 0.5)
lobotomy.trainingdummy$weak.name=취약 과녁 (전 속성 1.5)
lobotomy.trainingdummy$paleweak.name=PALE 과녁 (PALE 2.0)
