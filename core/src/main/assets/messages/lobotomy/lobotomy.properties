items.weapon.melee.ego.egogun.ac_reload=재장전
items.weapon.melee.ego.egogun.prompt=사격할 곳을 선택하세요
items.weapon.melee.ego.egogun.need_equip=총을 장착해야 사격하거나 재장전할 수 있습니다.
items.weapon.melee.ego.egogun.already_loaded=이미 탄환이 가득 장전되어 있습니다.
