scenes.titlescene.warehouse=창고
actors.mobs.ordeal.ordealmob.risk=위험 등급: %s
actors.mobs.ordeal.doubt.name=의문
actors.mobs.ordeal.doubt.desc=녹빛 여명의 시련. 톱니바퀴가 맞물린 검은 기계 몸에 해진 갈색 천을 걸쳤다. 붉은 눈은 자신이 어디서 왔는지 묻는 듯 끊임없이 깜빡인다.\n\n살아 있는 존재가 아니다.
actors.mobs.ordeal.cheersforthebeginning.name=시작의 환호성
actors.mobs.ordeal.cheersforthebeginning.desc=핏빛 여명의 시련. 붉은 고깔모자를 쓴 작은 광대가 쉴 새 없이 박수를 치며 환호한다. 스스로는 움직이지도, 공격하지도 않는다.\n\n하지만 당신을 발견하면 _5턴_ 동안 환호성을 올린 뒤, 이 층에 사는 괴물 하나를 곁으로 불러내고 다른 곳으로 _순간이동_한다.
actors.mobs.ordeal.cheersforthebeginning.spotted=시작의 환호성이 당신을 발견하고 환호하기 시작했다!
actors.mobs.ordeal.cheersforthebeginning.called=환호성에 이끌려 %s이(가) 나타났다!
actors.mobs.ordeal.fruitofunderstanding.name=이해의 과실
actors.mobs.ordeal.fruitofunderstanding.desc=자색 여명의 시련. 가시 돋친 보랏빛 살덩이가 바닥을 느릿느릿 기어 다닌다. 평소의 접촉은 약하지만, 때때로 몸을 부풀려 _2턴 동안 힘을 모은 뒤_ 주변 _5x5 범위_의 모든 대상을 강력한 피해를 입힌다. 힘을 모으는 동안 공격할 범위가 보랏빛으로 물든다.
actors.mobs.ordeal.fruitofunderstanding.!!!=!!!
actors.mobs.ordeal.fruitofunderstanding.charge=이해의 과실이 몸을 부풀리며 힘을 모은다!
actors.mobs.ordeal.perfectfood.name=완전 식품
actors.mobs.ordeal.perfectfood.desc=호박색 여명의 시련. 주황빛 고름이 점점이 맺힌 검붉은 등껍질의 유충. 어둡고 좁은 _복도_에 무리 지어 살며, 그 밖으로는 결코 나오지 않는다.
actors.mobs.ordeal.processofunderstanding.name=이해의 과정
actors.mobs.ordeal.processofunderstanding.desc=녹빛 정오의 시련. 붉은 눈이 박힌 상자 머리의 기계. 한 팔에는 톱날이 돌아가고, 다른 팔에는 천으로 동여맨 총이 달려 있다. 가까이 있는 적은 톱날로 베고, 멀리 있는 적에게는 _총을 쏜다._\n\n_5턴_ 동안 싸우고 나면 몸이 과열되어 _2턴_ 동안 스파크를 일으키며 아무것도 하지 못한다.\n\n살아 있는 존재가 아니다.
actors.mobs.ordeal.processofunderstanding.overheat=과열!
actors.mobs.ordeal.grantuslove.name=사랑을 주소서
actors.mobs.ordeal.grantuslove.desc=자색 정오의 시련. 보랏빛 문자가 빛나는 검은 비석이 돌무더기 위에 박혀 있고, 그 뒤로 검은 촉수가 꿈틀거린다. 하늘에서 떨어져 내려 _방 전체_를 짓누른 뒤로는 그 자리에서 _움직이지 않는다._\n\n촉수는 _2칸_ 떨어진 곳까지 닿는다.
actors.mobs.ordeal.grantuslove.warn=하늘에서 무언가가 떨어지려 한다! 5턴 안에 방을 벗어나세요!
actors.mobs.ordeal.grantuslove.landed=사랑을 주소서가 떨어져 내렸다!
actors.mobs.ordeal.grantuslove.crushed=당신은 사랑을 주소서에 짓눌렸다...
actors.mobs.ordeal.grantuslove.fall_desc=무언가가 곧 이곳으로 떨어진다.
actors.mobs.ordeal.sweeper.name=청소부
actors.mobs.ordeal.sweeper.desc=쪽빛 정오의 시련. 짙은 남색 옷에 방독면을 쓰고, 손 대신 붉은 갈고리를 단 채 몸을 웅크린 형체. 밤이 내린 뒷골목을 _무리 지어_ 돌아다니며, 하나가 먹잇감을 찾으면 모두가 몰려든다.\n\n주변 _3칸_ 안에서 누군가 죽으면 그 잔해를 먹어 치우고 체력을 _30%_ 회복한다.
actors.mobs.ordeal.harmonyofskin.name=살갗의 화음
actors.mobs.ordeal.harmonyofskin.desc=핏빛 정오의 시련. 붉은 살덩이가 뭉쳐 이룬 몸 위로 검은 머리칼이 달린 하얀 가면들이 이를 드러내고 웃는다. 겉모습과 달리 _빠르게_ 움직인다.\n\n쓰러지면 _시작의 환호성_ 둘로 갈라져 층 곳곳으로 흩어진다. 시련을 끝내려면 그것들까지 모두 처치해야 한다.
actors.mobs.ordeal.harmonyofskin.split=살갗의 화음이 둘로 갈라져 흩어졌다!
actors.mobs.ordeal.wherewemustreach.name=닿아야 하는 곳
actors.mobs.ordeal.wherewemustreach.desc=녹빛 어스름의 시련. 굴뚝과 배관이 솟은 검은 기계가 탑처럼 버티고 서 있다. 철창 너머로 붉은 불빛이 일렁이고, 옆구리의 초록 계기판이 쉴 새 없이 차오른다. 스스로는 _움직이지도, 공격하지도 않으며_ 마비되지 않는다.\n\n나타나자마자 _의문_ 셋과 _이해의 과정_ 하나를 만들어 내고, 그 뒤로 _10턴_마다 의문을 하나씩 만든다. _4번째_마다 의문 대신 이해의 과정을 만든다. 공격을 받으면 _5턴_ 동안 생산 속도가 _두 배_가 된다. 시련을 끝내려면 만들어 낸 기계들까지 모두 처치해야 한다.
actors.mobs.ordeal.wherewemustreach.rush=가속!
actors.mobs.ordeal.climaxthroes.name=절정의 몸부림
actors.mobs.ordeal.climaxthroes.desc=핏빛 어스름의 시련. 기워 붙인 붉은 살덩이가 커다란 입을 벌리고, 식칼과 도끼를 휘두르며 굴러온다. 누구보다 _두 배_ 빠르게 움직이지만, 덩치 탓에 _문을 지날 때는 2턴_이 걸린다.\n\n쓰러지면 _살갗의 화음_ 둘로 갈라지고, 그것들은 다시 _시작의 환호성_으로 갈라진다. 시련을 끝내려면 그것들까지 모두 처치해야 한다.
actors.mobs.ordeal.climaxthroes.split=절정의 몸부림이 둘로 찢어졌다!
actors.mobs.ordeal.foodchain.name=먹이 사슬
actors.mobs.ordeal.foodchain.desc=호박색 어스름의 시련. 검은 바위 같은 판이 겹겹이 덮인 거대한 몸에 호박색 혹이 솟아 있다. 복도 하나를 가득 메울 만큼 커서 _2x2칸_을 차지하며, 밀쳐지거나 순간이동되지 않는다.\n\n복도의 한쪽 끝에서 반대쪽 끝까지 _느리게_ 기어가며 _정면_에 있는 것만 공격한다. 공격받은 대상은 _1칸 밀려난다_. 길을 막는 같은 편과는 자리를 바꾸고, 끝에 닿으면 땅속으로 파고들어 다른 복도의 끝에서 나타난다. 기어가는 동안 뒤쪽 복도에 빈자리가 생기면 그 자리에 _완전 식품_을 남긴다. 복도마다 넷까지 남긴다. 시련을 끝내려면 그것들까지 모두 처치해야 한다.
actors.mobs.ordeal.foodchain.food=알을 깠다!
actors.mobs.npcs.vaultmirror.take_hod=교육을 받는다
actors.mobs.npcs.vaultmirror.scene_take_hod=당신은 매뉴얼을 펼쳐 마지막 장까지 읽어 내려갔습니다. 손에 쥔 것은 아무것도 없지만, 배운 것들이 머릿속에 또렷이 남았습니다.\n\n이 금고 안에 있는 동안 교육 매뉴얼 보급의 스택이 _%d_ 늘어납니다.

actors.hero.abilities.hod.managercall.name=관리직 호출
actors.hero.abilities.hod.managercall.no_space=관리직을 부를 빈 자리가 없습니다.
actors.hero.abilities.hod.managercall.desperate=상황이 나빠졌지만 나도 최선을 다했어… 너희들은 왜 나의 노력을… 다정함을… 몰라주는 거야? 너희들은 내가 아니었으면 진작에 벌레만도 못하게 죽어버렸어!
actors.hero.abilities.hod.managercall.rooted=움직일 수 없는 상태에서는 자리를 바꿀 수 없습니다.
actors.hero.abilities.hod.managercall.short_desc=호드는 _L사 관리직_을 호출해 함께 싸울 수 있습니다.
actors.hero.abilities.hod.managercall.desc=호드가 곁에 _L사 관리직_을 호출합니다. L사 관리직은 수많은 작업을 거치며 실력을 증명한 직원으로, 일반 사무직 직원보다 훨씬 튼튼하고 강력하며 몸을 지키는 장비까지 갖추고 있습니다. 적에게 RED 피해를 입힙니다.\n\n관리직이 살아 있을 때 다시 쓰면 기존 관리직이 사라지고 새 관리직이 호출됩니다. 호출에는 _1턴_이 걸립니다.
actors.hero.hod.lcorpmanager.name=L사 관리직
actors.hero.hod.lcorpmanager.desc=교육팀 세피라의 호출을 받고 달려온 L사 관리직이다. 일반 직원보다 훨씬 단단하고, 실전 경험도 풍부하다.\n\n적에게 _{c:CA2844}RED{/c} 피해_를 입힌다.
actors.hero.abilities.hod.bloodydesire.name=핏빛 욕망
actors.hero.abilities.hod.bloodydesire.prompt=공격할 대상을 선택하세요
actors.hero.abilities.hod.bloodydesire.no_target=공격할 적이 없습니다.
actors.hero.abilities.hod.bloodydesire.too_far=공격이 닿지 않는 대상입니다.
actors.hero.abilities.hod.bloodydesire.short_desc=호드는 _핏빛 욕망_으로 적을 베어, 준 피해를 출혈로 바꾸고 출혈이 줄어들지 않게 만들 수 있습니다.
actors.hero.abilities.hod.bloodydesire.desc=호드가 공격이 닿는 적을 공격하고, 준 피해의 _50%_만큼 _출혈_을 부여합니다. 그 뒤 대상에게 _1턴_ 동안 _깊은 상처_를 남깁니다. 깊은 상처가 있는 동안에는 출혈 수치가 줄어들지 않습니다.
actors.hero.abilities.hod.bloodydesire$deepwound.name=깊은 상처
actors.hero.abilities.hod.bloodydesire$deepwound.desc=상처가 깊게 벌어져 있습니다. 이 상처가 있는 동안에는 출혈 수치가 줄어들지 않습니다.\n\n남은 턴: %s.
actors.hero.abilities.hod.redeye.name=적안
actors.hero.abilities.hod.redeye.prompt=끌어올 대상을 선택하세요
actors.hero.abilities.hod.redeye.no_target=끌어올 적이 없습니다.
actors.hero.abilities.hod.redeye.too_far=대상이 너무 멀리 있습니다.
actors.hero.abilities.hod.redeye.blocked=대상에게 뛰어들 공간이 없습니다.
actors.hero.abilities.hod.redeye.short_desc=호드는 _적안_으로 멀리 있는 적을 눈앞으로 끌고 와 공격하고, 속박과 약화, 취약을 걸 수 있습니다.
actors.hero.abilities.hod.redeye.desc=호드가 _4칸_ 이내의 적을 자신의 앞으로 끌고 와 공격하고, _3턴_ 동안 _속박_, _약화_, _취약_을 겁니다. 대상을 끌고 올 수 없다면 호드가 대상에게 도약해 공격합니다.

actors.hero.talent.hiring_procedure.title=고용 절차 강화
actors.hero.talent.hiring_procedure.desc=_+1:_ L사 관리직의 체력, 피해, 방어력이 _25%_ 증가합니다.\n\n_+2:_ L사 관리직의 체력, 피해, 방어력이 _50%_ 증가합니다.\n\n_+3:_ L사 관리직의 체력, 피해, 방어력이 _75%_ 증가합니다.\n\n_+4:_ L사 관리직의 체력, 피해, 방어력이 _100%_ 증가합니다.
actors.hero.talent.field_guidance.title=현장 지도
actors.hero.talent.field_guidance.desc=_+1:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _5%_ 감소합니다.\n\n_+2:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _10%_ 감소합니다.\n\n_+3:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _15%_ 감소합니다.\n\n_+4:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _20%_ 감소합니다.
actors.hero.talent.emergency_relocation.title=긴급 재배치
actors.hero.talent.emergency_relocation.desc=_+1:_ 긴급 재배치에 충전을 _20_ 소모합니다.\n\n_+2:_ 긴급 재배치에 충전을 _17_ 소모합니다.\n\n_+3:_ 긴급 재배치에 충전을 _14_ 소모합니다.\n\n_+4:_ 긴급 재배치에 충전을 _10_ 소모합니다.\n\n관리직이 살아 있을 때 강요된 무게를 사용하면 _관리직 호출_과 _긴급 재배치_ 중에서 고를 수 있습니다. 긴급 재배치는 턴을 소모하지 않고 관리직과 자리를 바꿉니다.
actors.hero.talent.slash.title=난도질
actors.hero.talent.slash.desc=_+1:_ 깊은 상처가 _2턴_ 동안 지속됩니다.\n\n_+2:_ 깊은 상처가 _3턴_ 동안 지속됩니다.\n\n_+3:_ 깊은 상처가 _4턴_ 동안 지속됩니다.\n\n_+4:_ 깊은 상처가 _5턴_ 동안 지속됩니다.
actors.hero.talent.axe.title=도끼
actors.hero.talent.axe.desc=_+1:_ 핏빛 욕망이 준 피해의 _60%_만큼 출혈을 부여합니다.\n\n_+2:_ 핏빛 욕망이 준 피해의 _70%_만큼 출혈을 부여합니다.\n\n_+3:_ 핏빛 욕망이 준 피해의 _80%_만큼 출혈을 부여합니다.\n\n_+4:_ 핏빛 욕망이 준 피해의 _90%_만큼 출혈을 부여합니다.
actors.hero.talent.sparkle.title=반짝임
actors.hero.talent.sparkle.desc=_+1:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _25%_가 주변 8칸의 적에게 퍼집니다.\n\n_+2:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _50%_가 주변 8칸의 적에게 퍼집니다.\n\n_+3:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _75%_가 주변 8칸의 적에게 퍼집니다.\n\n_+4:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _100%_가 주변 8칸의 적에게 퍼집니다.
actors.hero.talent.long_gaze.title=긴 시선
actors.hero.talent.long_gaze.desc=_+1:_ 적안의 사거리가 _5칸_으로 늘어납니다.\n\n_+2:_ 적안의 사거리가 _6칸_으로 늘어납니다.\n\n_+3:_ 적안의 사거리가 _7칸_으로 늘어납니다.\n\n_+4:_ 적안의 사거리가 _8칸_으로 늘어납니다.
actors.hero.talent.vigilance.title=경계
actors.hero.talent.vigilance.desc=_+1:_ 적안의 속박, 약화, 취약이 _4턴_ 동안 지속됩니다.\n\n_+2:_ 적안의 속박, 약화, 취약이 _5턴_ 동안 지속됩니다.\n\n_+3:_ 적안의 속박, 약화, 취약이 _6턴_ 동안 지속됩니다.\n\n_+4:_ 적안의 속박, 약화, 취약이 _7턴_ 동안 지속됩니다.
actors.hero.talent.feast.title=식사
actors.hero.talent.feast.desc=_+1:_ 적안이 준 피해의 _7.5%_만큼 체력을 회복합니다.\n\n_+2:_ 적안이 준 피해의 _15%_만큼 체력을 회복합니다.\n\n_+3:_ 적안이 준 피해의 _22.5%_만큼 체력을 회복합니다.\n\n_+4:_ 적안이 준 피해의 _30%_만큼 체력을 회복합니다.
journal.document.alchemy_guide.weapons.body=일부 투척 무기와 마법 무기를 연금술에 활용할 수 있습니다!\n\n각 투척 무기 세트는 동일한 강화 수치를 가진 같은 티어의 투척 무기 세트를 완전히 수리할 양의 액체 금속을 생성합니다. 세트를 액체 금속으로 만들 경우 세트 전체를 완전히 파괴하며, 심지어 세트 중 일부가 비어 있어도 결과는 동일하다는 것을 기억하세요!\n\n마법 막대는 같은 강화 수치를 가진 마법 막대 두 개를 강화할 양의 신비한 송진을 만들어냅니다. 마법 막대는 신비한 송진으로 최대 +3까지 강화할 수 있습니다.\n\n일부 E.G.O는 연금술로 합쳐 _조합 E.G.O_로 만들 수 있습니다. 조합 E.G.O는 던전에서 발견되지 않고 앤젤라에게 추출을 부탁할 수도 없으며, 재료 중 더 높은 강화 수치를 이어받습니다. 재료는 _감정_되어 있고 _저주가 없어야_ 하며, 착용 중인 E.G.O는 넣을 수 없습니다.\n\n_적안_(무기)과 _참회_를 합치면 _적안 · 참회_가 됩니다.\n_잔향_과 _외로움_을 합치면 _잔향 · 외로움_이 됩니다.\n_램프_(무기)와 _회절_을 합치면 _변조 E.G.O 램프_가 됩니다.

actors.mobs.boss.bluestar.name=푸른 별
actors.mobs.boss.bluestar.desc=회색 다리가 수레바퀴처럼 사방으로 뻗어 나간 덩어리 한가운데에서 푸른 심장이 타오르고 있다. 심장이 고동칠 때마다 푸른 충격파가 본사 전체를 휩쓸고 지나간다.\n\n푸른 별은 움직이지 않는다. 대신 매 턴 맵 전체에 _반드시 명중하는_ 푸른 충격파를 일으켜 모두에게 _WHITE 피해_를 준다.
actors.mobs.boss.bluestar.suppressed=푸른 별의 빛이 꺼졌다. 지휘팀 로비의 계단으로 돌아갈 수 있다.
