actors.mobs.npcs.angela.start_1=어느날 의문이 생겼다. 우리는 어디서 왔는가. 누군가에게 생명을 받고 무책임하게 놓여졌다.
actors.mobs.npcs.angela.end_1=살아간다는 것은 고통이었다.
actors.mobs.npcs.angela.start_2=이해를 벗어난 것을 이해하기 위해 바라보며 꿈꾼다.
actors.mobs.npcs.angela.end_2=이해하기 위해 기울이지 않는다. 그저 행할 뿐이다.
actors.mobs.npcs.angela.start_3=완전한 음식, 완벽한 대체제
actors.mobs.npcs.angela.end_3=우리는 살기 위해 끝없이 먹었다. 필연적인 고갈, 쓰레기들...
actors.mobs.npcs.angela.ordeal_4=핏빛 여명의 시련
actors.mobs.npcs.angela.start_4=언젠가 끝날 촛불과 같은 삶에 더욱 강한 불을 지피자.
actors.mobs.npcs.angela.end_4=살아간다는 것은 욕망을 쟁취하기 위한 것.
actors.mobs.npcs.angela.menu_ordeal_locked=%s (여명의 시련을 먼저 극복해야 합니다)
actors.mobs.npcs.angela.noon_1=녹빛 정오의 시련
actors.mobs.npcs.angela.noon_start_1=그들도 결국 삶에 묶여있는 존재들이었다. 우리는 절망과 분노를 쏟아낼 뿐이었다.
actors.mobs.npcs.angela.noon_end_1=우리의 손을 통해 생명과 영혼을 이해해 나갈 것이다.
actors.mobs.npcs.angela.noon_2=자색 정오의 시련
actors.mobs.npcs.angela.noon_start_2=하릴없이 미약한 행동만이 우리에게 들렸으며, 그들에게 자비와 사랑을 구했다.
actors.mobs.npcs.angela.noon_end_2=이해하지 못함과 더불어 그들 또한 우리를 이해하지 못하리라.
actors.mobs.npcs.angela.noon_3=쪽빛 정오의 시련
actors.mobs.npcs.angela.noon_start_3=뒷골목에 밤이 내리면 그들이 찾아온다.
actors.mobs.npcs.angela.noon_end_3=해가 오르면 그 어떠한 흔적도 남아있지 않으리라.
actors.mobs.npcs.angela.noon_4=핏빛 정오의 시련
actors.mobs.npcs.angela.noon_start_4=우리는 때마다 행진했으며, 즐거움을 나눈다.
actors.mobs.npcs.angela.noon_end_4=생명과 생명의 부딪힘, 살갗의 화음. 더욱 아름다운 모습을 그린다.
actors.mobs.npcs.angela.offer_hq=곧 _L사 본사_에 _%1$s_이 등장할 예정입니다. 시련을 극복하시면 엔케팔린 박스 _%2$d개_를 드리겠습니다.\n\n시련을 맞이하면 곧바로 본사로 이동하며, 시련을 극복할 때까지 본사를 떠날 수 없습니다.\n\n시련을 맞이하시겠습니까?
actors.mobs.npcs.angela.menu_ordeal_locked_dusk=%s (정오의 시련을 먼저 극복해야 합니다)
actors.mobs.npcs.angela.dusk_1=녹빛 어스름의 시련
actors.mobs.npcs.angela.dusk_start_1=우리가 온 곳으로부터 가기 위해 까마득한 탑을 세웠다.
actors.mobs.npcs.angela.dusk_end_1=답은 없었다. 무엇 하나 원하던 것을 얻지 못했다. 생명의 죽음만을 보았다.
actors.mobs.npcs.angela.dusk_2=핏빛 어스름의 시련
actors.mobs.npcs.angela.dusk_start_2=낡은 몸을 버리고 모두 하나가 되어 끊임없이 붉은 행진을 계속한다.
actors.mobs.npcs.angela.dusk_end_2=언젠가 알게 될 것이며, 내일 우리는 함께일 것이다.
actors.mobs.npcs.angela.dusk_3=호박색 어스름의 시련
actors.mobs.npcs.angela.dusk_start_3=그 맛을 알게 되는 것은 피할 수 없는 과정이었다.
actors.mobs.npcs.angela.dusk_end_3=우리는 살아갈 수 있었다. 계속 먹을 수 있었다.
