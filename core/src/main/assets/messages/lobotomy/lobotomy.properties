###기본 장비
items.armor.ego.suit.name=정장
items.armor.ego.suit.desc=L사 직원에게 지급되는 표준 정장. 환상체 앞에서는 종잇장이나 다름없지만, 없는 것보다는 낫다.
items.armor.ego.suit.discover_hint=모든 영웅이 이 아이템을 가지고 시작합니다.

items.armor.ego.redeyesarmor.name=적안
items.armor.ego.redeyesarmor.desc=어두운 공간에서도 눈동자는 대상을 응시한다.

items.armor.ego.lifeforadaredevilarmor.name=필사즉생
items.armor.ego.lifeforadaredevilarmor.desc=죽음을 각오한 직원들이 착용한다면, 어떤 공격도 막을 수 있을 것이다.\n하지만 이곳에서 진실로 목숨을 잃는 것을 두려워하지 않는 이는 찾기 어려울 것이다.

items.armor.ego.beakarmor.name=부리
items.armor.ego.beakarmor.desc=묻는 피가 많아질수록 흉부 부분은 마치 살아있는 것처럼 비밀스레 꿈틀거린다.

items.armor.ego.magicbulletarmor.name=마탄
items.armor.ego.magicbulletarmor.desc=원형의 위력까지 온전하게 추출할 수는 없었지만 마력은 여전히 강력했다.\n\n총알은 수평선을 따라 복도를 가로지른다.

items.armor.ego.sanguinedesirearmor.name=핏빛 욕망
items.armor.ego.sanguinedesirearmor.desc=다리가 잘려나가도 멸할 수 없었던 집념은 혼자 숲길을 헤쳐나가 우리에게 다시 돌아왔다.

items.armor.ego.solemnlamentarmor.name=엄숙한 애도
items.armor.ego.solemnlamentarmor.desc=장의사복은 죽은 이를 가리고자 하는 이의 것이다.\n그 애도에는 오직 엄숙한 마음만 있어야 하기에 화려한 장식구는 일절 필요치 않다.

items.armor.ego.tearsarmor.name=눈물로 벼려낸 검
items.armor.ego.tearsarmor.desc=재처럼 떨어진 눈물은 별자리마냥 수놓아졌다.\n\n착용한 직원은 슬픔에 대해 생각하게 된다. 때로 아무것도 아닐 일에도 이따금 눈물이 나곤 하는 그런 날이 있는 것처럼.\n\n모든 슬픔이 그렇듯 나눠가지는 이들이 많아질수록 무뎌지지 않을까.

items.armor.ego.hornetarmor.name=호넷
items.armor.ego.hornetarmor.desc=왕국의 역사는 이름을 남기겠지만, 그것을 위해 죽어간 벌들은 누가 기억해줄까.\n한때의 영광은 낙인처럼 남아있다.

items.armor.ego.lamparmor.name=램프
items.armor.ego.lamparmor.desc=타오르는 수십 개의 눈동자는 언제나 한 곳만을 향하고 있다.

items.armor.ego.justitiaarmor.name=유스티티아
items.armor.ego.justitiaarmor.desc=누구나 그랬듯이 최초의 소망은 소박하기 그지없었다.\n평화에 대한 바람은 옛 동화 속으로 전해져 내려올 뿐.

items.armor.ego.dacapoarmor.name=다카포
items.armor.ego.dacapoarmor.stats_desc=_다카포_ 무기와 함께 착용하면 WHITE 내성이 _%s_이 되어, 받는 WHITE 피해만큼 체력을 _회복_합니다.
items.armor.ego.dacapoarmor.desc=교향곡을 연주할 때 어울릴 법한 지휘관복.\n최고의 앙상블을 이끌어내기 위해서는 탁월한 통솔력이 필요하다.\n하지만 모든 게 끝났을 때 박수칠 관객 정도는 남겨놓는 게 어떨까.

items.armor.ego.mimicryarmor.name=미미크리
items.armor.ego.mimicryarmor.desc=사람을 지키기 위해서는 사람의 가죽이 필요하다.\n비록 사람의 살갗은 아니지만 그것을 닮은 살갗은 우리를 지켜준다.

items.armor.ego.laughterarmor.name=웃음
items.armor.ego.laughterarmor.stats_desc=착용한 채로 바로 옆이나 발밑에 있는 _유골 더미를 조사_하면 유골을 잡아먹고 체력을 _%d_ 회복합니다. 유골을 먹는 데에는 _1턴_이 소요되며, 유골 더미 속의 물건은 그대로 남습니다.
items.armor.ego.laughterarmor.eat=웃음이 유골을 집어삼켰다.
items.armor.ego.laughterarmor.too_far=유골을 먹으려면 바로 옆까지 다가가야 합니다.
items.armor.ego.laughterarmor.desc=낯익은 얼굴이 박혀 있다. 착용자는 불현듯 죽음의 무게를 느낀다.

items.weapon.melee.ego.baton.name=제압봉
items.weapon.melee.ego.baton.ability_name=내려치기
items.weapon.melee.ego.baton.typical_ability_desc=제압봉을 가진 결투자는 _내려치기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 내려치기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 내려치기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.baton.ability_desc=제압봉을 가진 결투자는 _내려치기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 내려치기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 내려치기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.baton.desc=L사 직원에게 지급되는 표준 제압봉. 환상체를 제압하기 위해 만들어졌지만, 그 용도로 쓰기에는 한참 모자라다.
items.weapon.melee.ego.baton.discover_hint=모든 영웅이 이 아이템을 가지고 시작합니다.

###E.G.O 무기
items.weapon.melee.ego.penitence.name=참회
items.weapon.melee.ego.penitence.stats_desc=적에게 _5번_ 명중할 때마다 _10의 보호막_을 얻습니다. 이 보호막은 중첩되지 않습니다.
items.weapon.melee.ego.penitence.ability_name=강타
items.weapon.melee.ego.penitence.typical_ability_desc=참회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.penitence.ability_desc=참회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.penitence.desc=십자가 모양의 머리 한가운데에서 해골이 조용히 내려다본다. 휘두를 때마다 지은 죄가 조금씩 덜어지는 듯하다.

items.weapon.melee.ego.lifeforadaredevil.name=필사즉생
items.weapon.melee.ego.lifeforadaredevil.ability_name=가르기
items.weapon.melee.ego.lifeforadaredevil.typical_ability_desc=필사즉생을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.lifeforadaredevil.ability_desc=필사즉생을 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.lifeforadaredevil.desc=오랜 시간이 흐른 듯한 칼.\n\n그 원형이 바랬듯이, 겁 많은 자들의 손에서는 별 위력을 기대하기 힘들지도 모른다.

items.weapon.melee.ego.magicbullet.name=마탄
items.weapon.melee.ego.magicbullet.ac_shoot=사격
items.weapon.melee.ego.magicbullet.ac_reload=재장전
items.weapon.melee.ego.magicbullet.prompt=사격할 방향을 선택하세요
items.weapon.melee.ego.magicbullet.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 주며, _반드시 명중_하고 경로 위의 _모든 대상_을 꿰뚫고 지나갑니다.\n\n재장전에는 _3턴_이 소요됩니다.\n\n_마지막 탄환_은 당신의 손을 벗어나 _무작위 대상_을 꿰뚫고 지나갈 것입니다.
items.weapon.melee.ego.magicbullet.need_equip=마탄을 장착해야 사격하거나 재장전할 수 있습니다.
items.weapon.melee.ego.magicbullet.already_loaded=이미 탄환이 가득 장전되어 있습니다.
items.weapon.melee.ego.magicbullet.reloaded=마탄에 탄환을 장전했습니다.
items.weapon.melee.ego.magicbullet.final_shot=일곱 번째 탄환은 악마가 원하는 곳으로 날아간다...
items.weapon.melee.ego.magicbullet.ondeath=마지막 탄환은 당신을 겨누고 있었다.
items.weapon.melee.ego.magicbullet.ability_name=즉시 장전
items.weapon.melee.ego.magicbullet.ability_desc=마탄을 가진 결투자는 _즉시 장전_을 사용할 수 있습니다. 턴을 소모하지 않고 탄환을 _7발_까지 채웁니다.
items.weapon.melee.ego.magicbullet.desc=총알은 수평선을 따라 복도를 가로지른다.
items.weapon.melee.ego.magicbullet.quote="역시 네 말대로 어떤 사람이라도 맞출 수 있는 마법의 탄환이로구나."

###총기 공통 (부리 등)
items.weapon.melee.ego.egogun.ac_shoot=사격
items.weapon.melee.ego.egogun.ac_reload=재장전
items.weapon.melee.ego.egogun.prompt=사격할 곳을 선택하세요
items.weapon.melee.ego.egogun.need_equip=총을 장착해야 사격하거나 재장전할 수 있습니다.
items.weapon.melee.ego.egogun.already_loaded=이미 탄환이 가득 장전되어 있습니다.
items.weapon.melee.ego.egogun.reloaded=탄환을 장전했습니다.
items.weapon.melee.ego.egogun.no_ammo=탄환이 없습니다. 충전될 때까지 기다려야 합니다.
items.weapon.melee.ego.egogun.ability_name=즉시 장전
items.weapon.melee.ego.egogun.ability_desc=총을 가진 결투자는 _즉시 장전_을 사용할 수 있습니다. 턴을 소모하지 않고 탄환을 _%d발_까지 채웁니다.

###TETH E.G.O 무기
items.weapon.melee.ego.redeyes.name=적안
items.weapon.melee.ego.redeyes.stats_desc=적에게 입힌 피해의 _10%_(올림)만큼 _출혈_을 일으킵니다.
items.weapon.melee.ego.redeyes.ability_name=강타
items.weapon.melee.ego.redeyes.typical_ability_desc=적안을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.redeyes.ability_desc=적안을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.redeyes.desc=그 집념은 E.G.O에까지 이어져 탁월한 대상 추적 능력이 발휘되었다.

items.weapon.melee.ego.beak.name=부리
items.weapon.melee.ego.beak.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n재장전에는 _1턴_이 소요됩니다.
items.weapon.melee.ego.beak.desc=탄환의 표면이 수십 개의 작은 이빨처럼 뾰족한 탓에 그대로 꿰뚫린다면 적에게 꽤 강한 고통을 줄 수 있다.
items.weapon.melee.ego.loneliness.name=외로움
items.weapon.melee.ego.loneliness.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 줍니다. 탄환이 적중하면 _1/6_ 확률로 대상을 _3턴_ 동안 _약화_시킵니다.\n\n재장전에는 _2턴_이 소요됩니다.
items.weapon.melee.ego.loneliness.desc=E.G.O의 형태가 되어도 뿌리 깊은 고독은 원형 그대로 달라붙었다.\n탄환은 적의 뼈를 관통하는 대신 그 마음에 영원히 채워지지 않는 공허를 남긴다.

items.weapon.melee.ego.fragmentsfromsomewhere.name=어딘가의 조각
items.weapon.melee.ego.fragmentsfromsomewhere.stats_desc=이 무기는 떨어진 적을 공격할 수 있습니다.
items.weapon.melee.ego.fragmentsfromsomewhere.ability_name=찌르기
items.weapon.melee.ego.fragmentsfromsomewhere.typical_ability_desc=결투자는 어딘가의 조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.fragmentsfromsomewhere.ability_desc=결투자는 어딘가의 조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.fragmentsfromsomewhere.desc=회사 어딘가에서 이계 너머의 메아리가 들리는 날엔 창에서부터 알 수 없는 빛이 파생된다는 소문이 있다.

items.weapon.melee.ego.regret.name=후회
items.weapon.melee.ego.regret.stats_desc=이 무기는 다른 무기들보다 느립니다.\n대상 주변 적에게 약한 _스플래시 피해_를 입힙니다.
items.weapon.melee.ego.regret.ability_name=강타
items.weapon.melee.ego.regret.typical_ability_desc=후회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.regret.ability_desc=후회를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.regret.desc=이 후회에 짓뭉개진 적은 다시는 제대로 된 삶으로 돌아갈 수 없다.

###HE E.G.O 무기
items.weapon.melee.ego.frostsplinter.name=서리조각
items.weapon.melee.ego.frostsplinter.stats_desc=이 무기는 떨어진 적을 공격할 수 있습니다.
items.weapon.melee.ego.frostsplinter.ability_name=찌르기
items.weapon.melee.ego.frostsplinter.typical_ability_desc=결투자는 서리조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.frostsplinter.ability_desc=결투자는 서리조각의 끝을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.frostsplinter.desc=창 끝은 올곧은 동시에 싸늘하다. 무기에 공격당한 대상은 잠깐 동안 스스로를 잃어버린다.

items.weapon.melee.ego.logging.name=벌목
items.weapon.melee.ego.logging.stats_desc=이 무기는 다른 무기보다 정확합니다.
items.weapon.melee.ego.logging.ability_name=강타
items.weapon.melee.ego.logging.typical_ability_desc=벌목을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.logging.ability_desc=벌목을 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.logging.desc=나무던 사람이던 다채롭게 대상을 베기에 적합하게 만들어진 도끼.\n\n날만큼은 가는 것을 게을리 하지 않았는지 언제나 반질하다.

items.weapon.melee.ego.laetitia.name=Laetitia
items.weapon.melee.ego.laetitia.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n재장전에는 _2턴_이 소요됩니다.
items.weapon.melee.ego.laetitia.desc=많은 시간이 필요하지만 그만큼의 위력 또한 무시 못 한다.\n투박한 디자인은 오래전 제작된 듯 보인다.

items.weapon.melee.ego.solemnlament.name=엄숙한 애도
items.weapon.melee.ego.solemnlament.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_와 _%1$d-%2$d의 %4$s 피해_를 각각 따로 줍니다.\n\n재장전에는 _2턴_이 소요되며, 이 무기를 든 채 _적을 처치하면 탄환 1발_을 되찾습니다.
items.weapon.melee.ego.solemnlament.desc=애도하는 마음에는 한 가닥의 경박스러움조차도 허용되지 않는다는 듯 엄숙하다.\n\n한 자루는 죽은 자를 위한 비통을, 한 자루는 산 자에 대한 앞선 애도를 상징한다.

###WAW E.G.O 무기
items.weapon.melee.ego.hornet.name=호넷
items.weapon.melee.ego.hornet.stats_desc=탄환은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n탄환이 명중하면 피해의 _33%%_(올림)만큼 _출혈_을 일으킵니다. 대상이 이미 출혈 중이면 _3턴_의 _화상_도 입히고, 이미 화상 중이면 _50%%_ 더 큰 피해를 줍니다.\n\n재장전에는 _2턴_이 소요됩니다.
items.weapon.melee.ego.hornet.desc=왕국은 계속해서 부흥해야 했고 그러려면 더 많은 벌들이 필요했다.\n왕국은 역사에 이름이 남겠지만 그를 위해 죽어간 벌들은 누가 기억해줄까.

items.weapon.melee.ego.echo.name=잔향
items.weapon.melee.ego.echo.stats_desc=화살은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n화살을 다시 장전하는 데에는 _1턴_이 소요됩니다.
items.weapon.melee.ego.echo.need_equip=석궁을 장착해야 쏘거나 장전할 수 있습니다.
items.weapon.melee.ego.echo.already_loaded=이미 화살이 장전되어 있습니다.
items.weapon.melee.ego.echo.reloaded=화살을 장전했습니다.
items.weapon.melee.ego.echo.ac_reload=장전
items.weapon.melee.ego.echo.ability_desc=잔향을 가진 결투자는 _즉시 장전_을 사용할 수 있습니다. 턴을 소모하지 않고 화살을 _%d발_ 장전합니다.
items.weapon.melee.ego.echo.desc=모두의 마음 속 욕망이 꽃으로 대체될 때가 온다면, 이 무기는 더 이상 필요가 없을 것이다.

items.weapon.melee.ego.swordsharpenedwithtears.name=눈물로 벼려낸 검
items.weapon.melee.ego.swordsharpenedwithtears.stats_desc=이 무기는 0-3의 피해를 막을 수 있습니다.\n\n공격할 때마다 _눈물_을 1 얻습니다. 눈물이 _3_일 때 공격하면 _앞쪽 3x3 범위_의 적들도 함께 공격하고 눈물이 0이 됩니다.
items.weapon.melee.ego.swordsharpenedwithtears.ability_name=돌진
items.weapon.melee.ego.swordsharpenedwithtears.typical_ability_desc=눈물로 벼려낸 검을 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 일반적으로 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.ego.swordsharpenedwithtears.ability_desc=눈물로 벼려낸 검을 지닌 결투자는 1칸 거리의 적에게 _돌진_할 수 있습니다. 돌진하면 적에게 이동함과 동시에 _%1$d-%2$d_의 피해를 주며 반드시 명중합니다.
items.weapon.melee.ego.swordsharpenedwithtears.desc=날렵하게 찌르기에 적합하게 만들어진 검이다.\n\n검에 재능이 없는 이라도 이 E.G.O만 잡으면 경이로울 정도로 순식간에 적을 벌집처럼 만들어준다.\n\n기사도가 그렇듯, 전투 중엔 어떠한 반칙도 없지만 자비 또한 없다.

items.weapon.melee.ego.inthenameofloveandhate.name=사랑과 증오의 이름으로
items.weapon.melee.ego.inthenameofloveandhate.random_type=무작위
items.weapon.melee.ego.inthenameofloveandhate.ac_shoot=마법탄
items.weapon.melee.ego.inthenameofloveandhate.ac_arcana=아르카나 슬레이브
items.weapon.melee.ego.inthenameofloveandhate.prompt=마법탄을 쏠 곳을 선택하세요
items.weapon.melee.ego.inthenameofloveandhate.arcana_prompt=레이저를 발사할 방향을 선택하세요
items.weapon.melee.ego.inthenameofloveandhate.need_equip=사랑과 증오의 이름으로를 장착해야 사용할 수 있습니다.
items.weapon.melee.ego.inthenameofloveandhate.not_charged=충전량이 부족합니다. (%1$d/%2$d)
items.weapon.melee.ego.inthenameofloveandhate.stats_desc=모든 공격은 _무작위 속성_의 피해를 줍니다.\n\n마법탄은 _%1$d-%2$d의 피해_를 주며 _반드시 명중_합니다. 마법탄은 아군을 꿰뚫고 지나가며 그 아군의 체력을 _%3$d_ 회복시킵니다.\n\n장착 중 서서히 충전되며, 충전이 _%4$d_이 되면 _아르카나 슬레이브_를 발사해 경로 위의 적들에게 _%5$d-%6$d의 피해_를 줄 수 있습니다. 사용하고 나면 _%7$d턴_ 동안 약화됩니다.
items.weapon.melee.ego.inthenameofloveandhate.ability_name=충전
items.weapon.melee.ego.inthenameofloveandhate.ability_desc=사랑과 증오의 이름으로를 가진 결투자는 _충전_을 사용할 수 있습니다. 턴을 소모하지 않고 아르카나 충전량을 _%d_ 얻습니다.
items.weapon.melee.ego.inthenameofloveandhate.desc=모두를 지키고 싶었던 사랑의 형태는 집착의 형태로 마음을 좀먹기 시작했다.\n바로잡으려 하기 시작했을 땐 모든 것이 끝나있었다.

items.weapon.melee.ego.diffraction.name=회절
items.weapon.melee.ego.diffraction.stats_desc=이 무기는 무방비 상태의 적에게 더 강합니다.
items.weapon.melee.ego.diffraction.ability_name=조용한 발걸음
items.weapon.melee.ego.diffraction.typical_ability_desc=회절을 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 3타일까지 즉시 점멸이 가능하며 일반적으로 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.ego.diffraction.ability_desc=회절을 가진 결투자는 _조용한 발걸음_을 사용할 수 있습니다. 이 능력을 사용하면 주변 3타일까지 즉시 점멸이 가능하며 _%d턴의 투명화_를 얻습니다.
items.weapon.melee.ego.diffraction.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.ego.diffraction.desc=이 E.G.O를 보기 위해서는 강한 집중력이 요구된다.

items.weapon.melee.ego.lamp.name=램프
items.weapon.melee.ego.lamp.ac_charm=매혹
items.weapon.melee.ego.lamp.charm_prompt=매혹할 적을 선택하세요
items.weapon.melee.ego.lamp.no_target=시야 안의 적을 선택해야 합니다.
items.weapon.melee.ego.lamp.cooldown=아직 매혹을 사용할 수 없습니다. (%d턴 남음)
items.weapon.melee.ego.lamp.need_equip=램프를 장착해야 매혹할 수 있습니다.
items.weapon.melee.ego.lamp.stats_desc=이 무기로는 기습 공격을 할 수 없습니다.\n\n_매혹_으로 시야 안의 적 하나를 _10턴_ 동안 매혹할 수 있습니다. _10턴_의 재사용 대기시간이 있습니다.\n당신에게 매혹된 적에게는 _25%_ 더 큰 피해를 줍니다.
items.weapon.melee.ego.lamp.ability_name=강타
items.weapon.melee.ego.lamp.typical_ability_desc=램프를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.lamp.ability_desc=램프를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.lamp$charmcooldown.name=매혹 재사용 대기
items.weapon.melee.ego.lamp$charmcooldown.desc=램프의 매혹을 다시 사용하려면 기다려야 합니다.\n\n남은 턴: %d
items.weapon.melee.ego.lamp.desc=숲 속 생물들을 구할수록 큰 새의 눈도 하나씩 늘어갔다.\n\n무기에는 그 눈부신 자부심들이 묻어나있다.

items.weapon.melee.ego.justitia.name=유스티티아
items.weapon.melee.ego.justitia.stats_desc=이 무기는 _3회_ 타격하며, 대상의 _방어력을 무시_합니다.
items.weapon.melee.ego.justitia.ability_name=심판
items.weapon.melee.ego.justitia.typical_ability_desc=유스티티아를 가진 결투자는 _심판_을 사용할 수 있습니다. 공격 범위 내의 적에게 반드시 명중하는 _3회_ 타격을 가하며, 각 타격은 일반적으로 _%1$d-%2$d_의 피해를 줍니다.
items.weapon.melee.ego.justitia.ability_desc=유스티티아를 가진 결투자는 _심판_을 사용할 수 있습니다. 공격 범위 내의 적에게 반드시 명중하는 _3회_ 타격을 가하며, 각 타격은 _%1$d-%2$d_의 피해를 줍니다.
items.weapon.melee.ego.justitia.desc=어떤 죄의 무게도 소홀히 여기지 않으려 했던 긴 새의 천칭을 기억한다.\n적을 베어내면 그 죄의 흔적까지도 베어낼 수 있을지도 모른다.

items.weapon.melee.ego.goldrush.name=골드러시
items.weapon.melee.ego.goldrush.stats_desc=이 무기는 매우 빠르게 공격할 수 있습니다.\n\n적중하면 _%1$d턴_ 동안 _황금의 길_을 얻습니다(최대 _%2$d중첩_). 중첩마다 근접 공격력이 _%3$d_ 오르고 방어력이 _%4$d_ 내려갑니다.
items.weapon.melee.ego.goldrush.ability_name=연속 타격
items.weapon.melee.ego.goldrush.typical_ability_desc=골드러시를 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수당 일반적으로 _+%d_의 추가 피해를 줍니다. 5턴(적 처치 시 15턴) 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.ego.goldrush.ability_desc=골드러시를 가진 결투자는 _연속 타격_을 사용할 수 있습니다. 이 공격은 반드시 적중하며, 일반적인 투척 공격 혹은 근접 공격이 명중한 횟수당 _+%d_의 추가 피해를 줍니다. 5턴(적 처치 시 15턴) 동안 공격을 하지 않으면 연속 타격이 초기화됩니다.
items.weapon.melee.ego.goldrush.desc=탐욕이 굳어 지금의 모습이 되기 전, 가장 빛났을 시기에 휘두르던 주먹이다.
items.weapon.melee.ego.goldrush$goldenroad.name=황금의 길
items.weapon.melee.ego.goldrush$goldenroad.desc=주먹을 휘두를수록 황금빛 길이 앞으로 뻗어 나갑니다.\n\n중첩: %1$d\n근접 공격력: +%2$d\n방어력: -%3$d\n\n남은 턴: %4$d

items.weapon.melee.ego.mimicry.name=미미크리
items.weapon.melee.ego.mimicry.stats_desc=적에게 가한 피해의 _25%_만큼 체력을 회복합니다.
items.weapon.melee.ego.mimicry.ability_name=가르기
items.weapon.melee.ego.mimicry.typical_ability_desc=미미크리를 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.mimicry.ability_desc=미미크리를 가진 결투자는 _가르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d_의 피해를 입히며 반드시 명중합니다. 가르기로 적을 처치할 경우 턴을 소모하지 않고, 다음 5턴 이내에 충전량 소모 없이 가르기를 한 번 더 사용할 수 있게 됩니다.
items.weapon.melee.ego.mimicry.desc=인간의 외형을 모방하고자 했던 마음은 욕심으로만 그치라는 듯 어설프게나마 남아있다.\n종종 이 세계가 아닌 것 같은 낯선 눈동자가 당신을 바라볼 때 전율을 느낀다.

items.weapon.melee.ego.dacapo.name=다카포
items.weapon.melee.ego.dacapo.stats_desc=이 무기는 다른 무기보다 정확하며, 공격 속도가 _1.2배_ 빠릅니다.
items.weapon.melee.ego.dacapo.ability_name=강타
items.weapon.melee.ego.dacapo.typical_ability_desc=다카포를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 일반적으로 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.dacapo.ability_desc=다카포를 가진 결투자는 _강타_를 사용할 수 있습니다. 이 집중적인 공격으로 적을 기습 공격했다면 _%1$d-%2$d_의 피해를 입히고, 또한 해당 적에게 5턴의 멍해짐 상태를 부여하여 정확성과 회피를 50%% 감소시킵니다. 강타는 항상 명중하지만, 기습 공격이 아닐 경우 일반적인 피해만 입힙니다.
items.weapon.melee.ego.dacapo.desc=낫이 휘둘리는 모습은 지휘자의 손동작처럼 고요하면서 절제있다.\n이 노래에 악보가 있다면 종말을 연주하는 음악일 것이다.

items.weapon.melee.ego.laughter.name=웃음
items.weapon.melee.ego.laughter.stats_desc=이 무기는 다른 무기들보다 느립니다.\n이 무기는 떨어진 적을 공격할 수 있습니다.\n\n적을 처치하면 체력과 허기를 조금 회복합니다.
items.weapon.melee.ego.laughter.ability_name=찌르기
items.weapon.melee.ego.laughter.typical_ability_desc=결투자는 웃음의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 일반적으로 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.laughter.ability_desc=결투자는 웃음의 끝 부분을 사용해 공격 범위 내에 있는 근접해 있지 않은 적에게 _찌르기_를 사용할 수 있습니다. 이 공격은 _%1$d-%2$d 의 피해_를 입히고, 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.ego.laughter.desc=이름 모를 직원들의 창백한 얼굴과 거대한 입이 달려 있다.\n\n내려치면 대상을 향해 아귀 같은 입을 벌려 먹어치운다. 그리고 만족은 없다.
items.weapon.melee.ego.soundofastar.name=별의 소리
items.weapon.melee.ego.soundofastar.stats_desc=광선은 _%1$d-%2$d의 %3$s 피해_를 줍니다.\n\n최대 _3발_까지 충전되며, 장착하고 있는 동안 _3턴_마다 _1발_씩 자동으로 충전됩니다. 직접 재장전할 수는 없습니다.
items.weapon.melee.ego.soundofastar.desc=우리들의 절망이 모여 별은 빛나간다.\n그리움을 자아내는 작은 구체는 따뜻한 광선을 발사한다.\n빛 속에서만큼은 모든 게 평등하다.

###테스트용 영웅
actors.hero.heroclass.malkuth=말쿠트
actors.hero.heroclass.malkuth_desc_short=지휘팀의 세피라. _말쿠트의 수첩_으로 _신속_과 _축복_을 얻어 효율적으로 전투를 수행합니다.
actors.hero.heroclass.malkuth_desc=말쿠트는 사용하면 _3턴의 신속_과 _15턴의 축복_을 얻는 _말쿠트의 수첩_을 가지고 시작합니다. 수첩은 최대 _2회_까지 충전되며, 1회 충전에 _50턴_이 걸립니다.\n\n말쿠트는 또한 _제압봉_, _투척용 돌_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n말쿠트는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 신속의 물약\n_-_ 액체 화염의 물약
actors.hero.heroclass.malkuth_unlock=말쿠트는 자동으로 해금됩니다.

actors.hero.herosubclass.control_sephirah=지휘팀 세피라
actors.hero.herosubclass.control_sephirah_short_desc=_지휘팀 세피라_는 _L사 직원_을 호출해 함께 싸우며, 말쿠트의 수첩의 효과를 직원과 나눕니다.
actors.hero.herosubclass.control_sephirah_desc=지휘팀 세피라는 _직원 호출_ 버튼으로 _L사 직원_ 한 명을 곁에 부를 수 있습니다. 직원은 쓰러질 때까지 함께 다니며 싸우고, 쓰러지면 _50턴_ 뒤에 다시 부를 수 있습니다.\n\n직원의 체력은 말쿠트의 최대 체력의 _절반_이며, 부를 때의 레벨에 비례해 강해집니다.\n\n말쿠트가 수첩을 사용하면 직원도 같은 _신속_과 _축복_을 얻습니다.
actors.hero.herosubclass.history_librarian=역사의 층 지정사서
actors.hero.herosubclass.history_librarian_short_desc=_역사의 층 지정사서_는 시야 안의 불길에서 _열기_를 모아 _아드레날린_으로 바꿉니다.
actors.hero.herosubclass.history_librarian_desc=역사의 층 지정사서는 매 턴 _시야 안에서 불타는 대상_ 하나마다 _열기_를 1 얻습니다(최대 _10_). 자신과 아군이 불타고 있어도 열기를 얻습니다. 주변에 불이 없으면 3턴마다 열기가 1씩 줄어듭니다.\n\n열기가 2 이상이면 _열기 방출_ 버튼으로 열기를 모두 소모해, 열기 2당 1턴의 _아드레날린_을 얻습니다. 아드레날린은 이동을 2배, 공격을 1.5배 빠르게 합니다.

actors.hero.talent.thorough_records.title=철저한 기록
actors.hero.talent.thorough_records.desc=_+1:_ 장착한 무기와 방어구를 _1.75배_ 빠르게 감정합니다.\n\n_+2:_ 장착한 무기와 방어구를 _2.5배_ 빠르게 감정합니다.
actors.hero.talent.swift_response.title=신속한 대응
actors.hero.talent.swift_response.desc=_+1:_ 축복 상태일 때 근접 공격이 _1-2_의 추가 피해를 줍니다.\n\n_+2:_ 축복 상태일 때 근접 공격이 _2-3_의 추가 피해를 줍니다.
actors.hero.talent.overtime.title=업무 연장
actors.hero.talent.overtime.desc=_+1:_ 말쿠트의 수첩으로 얻는 축복의 지속 시간이 _3턴_ 늘어납니다.\n\n_+2:_ 말쿠트의 수첩으로 얻는 축복의 지속 시간이 _5턴_ 늘어납니다.
actors.hero.talent.safety_protocol.title=안전 수칙
actors.hero.talent.safety_protocol.desc=_+1:_ 신속을 얻을 때마다 _3_의 보호막을 얻습니다.\n\n_+2:_ 신속을 얻을 때마다 _5_의 보호막을 얻습니다.
actors.hero.talent.work_snack.title=근무 중 간식
actors.hero.talent.work_snack.desc=_+1:_ 식사에 _1턴_만 소모되며, 식사 시 _5턴_ 동안 축복을 얻습니다.\n\n_+2:_ 식사에 _1턴_만 소모되며, 식사 시 _8턴_ 동안 축복을 얻습니다.
actors.hero.talent.emergency_manual.title=비상 매뉴얼
actors.hero.talent.emergency_manual.desc=_+1:_ 체력이 _30%_ 아래로 떨어지면 말쿠트의 수첩의 효과가 즉시 발동합니다. 재사용 대기 시간은 _150턴_입니다.\n\n_+2:_ 체력이 _30%_ 아래로 떨어지면 말쿠트의 수첩의 효과가 즉시 발동합니다. 재사용 대기 시간은 _100턴_입니다.
actors.hero.talent.joint_command.title=합동 지휘
actors.hero.talent.joint_command.desc=_+1:_ 말쿠트의 수첩의 효과가 _2칸_ 이내의 아군에게도 적용됩니다.\n\n_+2:_ 말쿠트의 수첩의 효과가 _3칸_ 이내의 아군에게도 적용됩니다.
actors.hero.talent.speed_war.title=속도전
actors.hero.talent.speed_war.desc=_+1:_ 신속 상태에서 적을 처치하면 신속이 _1턴_ 연장됩니다.\n\n_+2:_ 신속 상태에서 적을 처치하면 신속이 _2턴_ 연장됩니다.
actors.hero.talent.scroll_filing.title=주문서 정리
actors.hero.talent.scroll_filing.desc=_+1:_ 주문서를 읽으면 _5턴_ 동안 축복을 얻습니다.\n\n_+2:_ 주문서를 읽으면 _8턴_ 동안 축복을 얻습니다.
actors.hero.talent.efficient_work.title=업무 효율화
actors.hero.talent.efficient_work.desc=_+1:_ 말쿠트의 수첩의 1회 충전에 걸리는 시간이 _45턴_으로 줄어듭니다.\n\n_+2:_ 말쿠트의 수첩의 1회 충전에 걸리는 시간이 _40턴_으로 줄어듭니다.\n\n_+3:_ 말쿠트의 수첩의 1회 충전에 걸리는 시간이 _35턴_으로 줄어듭니다.
actors.hero.talent.extra_approval.title=추가 결재
actors.hero.talent.extra_approval.desc=_+1:_ 말쿠트의 수첩으로 얻는 신속의 지속 시간이 _1턴_ 늘어납니다.\n\n_+2:_ 말쿠트의 수첩으로 얻는 신속의 지속 시간이 _2턴_ 늘어납니다.\n\n_+3:_ 말쿠트의 수첩으로 얻는 신속의 지속 시간이 _3턴_ 늘어나고, 수첩이 최대 _3회_까지 충전됩니다.
actors.hero.talent.mobile_command.title=기동 지휘
actors.hero.talent.mobile_command.desc=_+1:_ 신속 상태일 때 회피가 _10%_ 증가합니다.\n\n_+2:_ 신속 상태일 때 회피가 _20%_ 증가합니다.\n\n_+3:_ 신속 상태일 때 회피가 _30%_ 증가합니다.
actors.hero.talent.spearhead_charge.title=진두지휘
actors.hero.talent.spearhead_charge.desc=_+1:_ 말쿠트의 수첩으로 얻는 다음 공격의 추가 피해가 _5_ 증가합니다.\n\n_+2:_ 말쿠트의 수첩으로 얻는 다음 공격의 추가 피해가 _10_ 증가합니다.\n\n_+3:_ 말쿠트의 수첩으로 얻는 다음 공격의 추가 피해가 _15_ 증가합니다.
actors.hero.talent.tt2_protocol.title=TT2 프로토콜
actors.hero.talent.tt2_protocol.desc=_+1:_ 말쿠트의 수첩을 사용해도 _턴을 소모하지 않습니다_.\n\n_+2:_ 말쿠트의 수첩을 사용해도 턴을 소모하지 않으며, _둔화_와 _불구_를 해제합니다.\n\n_+3:_ 말쿠트의 수첩을 사용해도 턴을 소모하지 않으며, _둔화_, _불구_, _속박_을 해제합니다.
actors.hero.talent.match_flame.title=성냥불
actors.hero.talent.match_flame.desc=_+1:_ 축복을 얻으면 그 지속 시간의 _33%_만큼 _화염과 동화됨_ 상태가 됩니다.\n\n_+2:_ 축복을 얻으면 그 지속 시간의 _66%_만큼 _화염과 동화됨_ 상태가 됩니다.\n\n_+3:_ 축복을 얻으면 그 지속 시간의 _100%_만큼 _화염과 동화됨_ 상태가 됩니다.
actors.hero.talent.spore.title=포자
actors.hero.talent.spore.desc=_+1:_ 불타는 적을 공격하면 준 피해의 _10%_만큼 _출혈_을 추가로 부여합니다.\n\n_+2:_ 불타는 적을 공격하면 준 피해의 _20%_만큼 _출혈_을 추가로 부여합니다.\n\n_+3:_ 불타는 적을 공격하면 준 피해의 _30%_만큼 _출혈_을 추가로 부여합니다.
actors.hero.talent.worker_bee.title=일벌
actors.hero.talent.worker_bee.desc=_+1:_ 불타는 적을 처치하면 말쿠트의 수첩이 _0.1회_ 충전됩니다.\n\n_+2:_ 불타는 적을 처치하면 말쿠트의 수첩이 _0.2회_ 충전됩니다.\n\n_+3:_ 불타는 적을 처치하면 말쿠트의 수첩이 _0.3회_ 충전됩니다.

actors.hero.talent.emergency_muster.title=긴급 소집
actors.hero.talent.emergency_muster.desc=_+1:_ 소집 호출로 주는 신속이 _6턴_, 축복이 _13턴_으로 늘어납니다.\n\n_+2:_ 소집 호출로 주는 신속이 _7턴_, 축복이 _16턴_으로 늘어납니다.\n\n_+3:_ 소집 호출로 주는 신속이 _8턴_, 축복이 _19턴_으로 늘어납니다.\n\n_+4:_ 소집 호출로 주는 신속이 _9턴_, 축복이 _22턴_으로 늘어납니다.
actors.hero.talent.morale_boost.title=사기 진작
actors.hero.talent.morale_boost.desc=_+1:_ 소집 호출의 효과를 받은 대상이 최대 체력의 _7.5%_를 회복합니다.\n\n_+2:_ 소집 호출의 효과를 받은 대상이 최대 체력의 _15%_를 회복합니다.\n\n_+3:_ 소집 호출의 효과를 받은 대상이 최대 체력의 _22.5%_를 회복합니다.\n\n_+4:_ 소집 호출의 효과를 받은 대상이 최대 체력의 _30%_를 회복합니다.
actors.hero.talent.all_hands_move.title=전원 이동
actors.hero.talent.all_hands_move.desc=소집 호출의 효과를 받은 아군이 _자신 근처로 순간이동_합니다. 시야 밖의 아군도 일정 거리 안에 있으면 호출에 응합니다.\n\n_+1:_ 시야 밖 _4칸_ 안의 아군도 호출합니다.\n\n_+2:_ 시야 밖 _8칸_ 안의 아군도 호출합니다.\n\n_+3:_ 시야 밖 _12칸_ 안의 아군도 호출합니다.\n\n_+4:_ 층 전체의 아군을 호출합니다.
actors.hero.talent.venom_sting.title=독침
actors.hero.talent.venom_sting.desc=_+1:_ 호넷에 맞은 적이 _2턴_ 동안 _취약_해집니다.\n\n_+2:_ 호넷에 맞은 적이 _4턴_ 동안 _취약_해집니다.\n\n_+3:_ 호넷에 맞은 적이 _6턴_ 동안 _취약_해집니다.\n\n_+4:_ 호넷에 맞은 적이 _8턴_ 동안 _취약_해집니다.
actors.hero.talent.wingbeat.title=날갯짓
actors.hero.talent.wingbeat.desc=_+1:_ 호넷의 돌진 거리가 _5칸_으로 늘어납니다.\n\n_+2:_ 호넷의 돌진 거리가 _6칸_으로 늘어납니다.\n\n_+3:_ 호넷의 돌진 거리가 _7칸_으로 늘어납니다.\n\n_+4:_ 호넷의 돌진 거리가 _8칸_으로 늘어납니다.
actors.hero.talent.queen_bee.title=여왕벌
actors.hero.talent.queen_bee.desc=호넷에 맞은 적이 출혈 중에 죽으면, 일정 확률로 _20턴_ 동안 함께 싸우는 _아군 일벌_로 되살아납니다.\n\n_+1:_ _25%_ 확률로 일벌이 됩니다.\n\n_+2:_ _50%_ 확률로 일벌이 됩니다.\n\n_+3:_ _75%_ 확률로 일벌이 됩니다.\n\n_+4:_ _100%_ 확률로 일벌이 됩니다.
actors.hero.talent.spreading_flames.title=번지는 불길
actors.hero.talent.spreading_flames.desc=_+1:_ 4번째 성냥불의 범위가 _5칸, 75도_로 넓어집니다.\n\n_+2:_ 4번째 성냥불의 범위가 _6칸, 90도_로 넓어집니다.\n\n_+3:_ 4번째 성냥불의 범위가 _7칸, 105도_로 넓어집니다.\n\n_+4:_ 4번째 성냥불의 범위가 _8칸, 120도_로 넓어집니다.
actors.hero.talent.undying_embers.title=꺼지지 않는 불씨
actors.hero.talent.undying_embers.desc=_+1:_ 4번째 성냥불이 붙인 불이 _10턴_ 동안 탑니다.\n\n_+2:_ 4번째 성냥불이 붙인 불이 _12턴_ 동안 탑니다.\n\n_+3:_ 4번째 성냥불이 붙인 불이 _14턴_ 동안 탑니다.\n\n_+4:_ 4번째 성냥불이 붙인 불이 _16턴_ 동안 탑니다.
actors.hero.talent.fading_flame.title=꺼져가는 불꽃
actors.hero.talent.fading_flame.desc=_+1:_ 4번째 성냥불에 맞은 적이 _2턴_ 동안 _둔화_됩니다.\n\n_+2:_ 4번째 성냥불에 맞은 적이 _4턴_ 동안 _둔화_됩니다.\n\n_+3:_ 4번째 성냥불에 맞은 적이 _6턴_ 동안 _둔화_됩니다.\n\n_+4:_ 4번째 성냥불에 맞은 적이 _8턴_ 동안 _둔화_됩니다.

actors.hero.abilities.malkuth.mustercall.name=소집 호출
actors.hero.abilities.malkuth.mustercall.short_desc=말쿠트는 _소집 호출_로 자신과 시야 안의 아군 모두에게 신속과 축복을 줄 수 있습니다.
actors.hero.abilities.malkuth.mustercall.desc=말쿠트가 소집 명령을 내려, 자신과 시야 안의 모든 아군에게 _5턴_ 동안 _신속_을, _10턴_ 동안 _축복_을 줍니다.
actors.hero.abilities.malkuth.hornet.name=호넷
actors.hero.abilities.malkuth.hornet.prompt=돌진할 방향을 선택하세요
actors.hero.abilities.malkuth.hornet.self_target=자기 자신에게는 돌진할 수 없습니다.
actors.hero.abilities.malkuth.hornet.blocked=그 방향으로는 돌진할 공간이 없습니다.
actors.hero.abilities.malkuth.hornet.short_desc=말쿠트는 _호넷_으로 일직선으로 돌진하며 경로 위의 적을 찌르고 출혈을 일으킬 수 있습니다.
actors.hero.abilities.malkuth.hornet.desc=말쿠트가 지정한 방향으로 최대 _4칸_ 돌진합니다. 적은 뚫고 지나가지만, 벽에 막히면 그 앞에서 멈춥니다.\n\n경로 위와 멈춘 자리 바로 앞의 모든 적은 _반드시 명중하는 무기 공격_을 받고, 무기 피해의 _33%_만큼 _출혈_에 걸립니다.
actors.hero.abilities.malkuth.fourthmatch.name=4번째 성냥불
actors.hero.abilities.malkuth.fourthmatch.prompt=불길을 뿜을 방향을 선택하세요
actors.hero.abilities.malkuth.fourthmatch.self_target=자기 자신에게는 쓸 수 없습니다.
actors.hero.abilities.malkuth.fourthmatch.short_desc=말쿠트는 _4번째 성냥불_로 앞쪽 부채꼴 범위의 적을 불태울 수 있습니다.
actors.hero.abilities.malkuth.fourthmatch.desc=말쿠트가 성냥을 그어, 반지름 _4칸_의 _60도_ 부채꼴 범위에 불길을 뿜습니다.\n\n불길에 휩쓸린 적은 _12-40_의 피해를 받고 _8턴_ 동안 _불탑니다_.

actors.hero.malkuth.workerbee.name=일벌
actors.hero.malkuth.workerbee.desc=호넷의 독침에 쓰러진 적이 일벌로 되살아났다. 잠시 동안 말쿠트를 위해 싸운다.\n\n적에게 _{c:CA2844}RED{/c} 피해_를 입힌다.
actors.hero.malkuth.workerbee.desc_honey=호넷의 독침에 쓰러진 적이 일벌로 되살아났다. 잠시 동안 말쿠트를 위해 싸운다.\n\n적에게 _{c:CA2844}RED{/c} 피해_를 입힌다.

items.armor.malkutharmor.name=세피라의 정장
items.armor.malkutharmor.desc=말쿠트가 이 정장을 입으면 특별한 능력을 사용할 수 있습니다.

actors.hero.malkuth.employeecall.name=직원 호출 대기
actors.hero.malkuth.employeecall.desc=L사 직원이 쓰러졌습니다. 새 직원을 부르려면 기다려야 합니다.\n\n남은 턴: %d
actors.hero.malkuth.employeecall.action_name=직원 호출
actors.hero.malkuth.employeecall.no_space=직원을 부를 빈 자리가 없습니다.
actors.hero.malkuth.heat.name=열기
actors.hero.malkuth.heat.desc=시야 안의 불길에서 모은 열기입니다. 열기 방출 버튼으로 열기를 모두 소모해 아드레날린을 얻을 수 있습니다.\n\n열기: %1$d/%2$d\n방출 시 아드레날린: %3$d턴
actors.hero.malkuth.heat.action_name=열기 방출
actors.hero.malkuth.lcorpemployee.name=L사 직원
actors.hero.malkuth.lcorpemployee.desc=지휘팀 세피라의 호출을 받고 달려온 L사 직원이다. {s}소모품{/s}\n\n적에게 _{c:CA2844}RED{/c} 피해_를 입힌다.

actors.hero.talent$emergencymanualcooldown.name=비상 매뉴얼 재사용 대기
actors.hero.talent$emergencymanualcooldown.desc=비상 매뉴얼을 다시 사용할 수 있을 때까지 기다려야 합니다.\n\n남은 턴: %s

items.artifacts.malkuthnotebook.name=말쿠트의 수첩
items.artifacts.malkuthnotebook.ac_use=사용
items.artifacts.malkuthnotebook.desc=지휘팀 세피라 말쿠트가 업무 지시와 일정을 빼곡히 적어 둔 수첩이다. 펼쳐 보는 것만으로도 다음에 할 일이 명확해진다.
items.artifacts.malkuthnotebook.effect=사용하면 _%1$d턴_ 동안 신속을, _%2$d턴_ 동안 축복을 얻으며, 다음 공격의 피해가 증가합니다. 최대 _%3$d회_까지 충전되며, 1회 충전에 _%4$d턴_이 걸립니다.
items.artifacts.malkuthnotebook.no_charge=수첩을 다시 쓰려면 충전을 기다려야 합니다.

actors.hero.heroclass.tester=테스터
actors.hero.heroclass.tester_desc_short=테스트용 영웅입니다. _E.G.O 추출 장치_로 원하는 E.G.O 장비를 만들 수 있습니다.
actors.hero.heroclass.tester_desc=테스트용 영웅입니다. 전사의 외형, 재능, 전직을 그대로 사용합니다.\n\n테스터는 정장, 제압봉과 함께 _모든 종류의 가방_, _힘 물약 10개_, _강화 주문서 10개_, 원하는 E.G.O 장비를 만들 수 있는 _E.G.O 추출 장치_, 내성 시험용 과녁을 부르는 _과녁 소환기_를 가지고 시작합니다.
actors.hero.heroclass.tester_unlock=테스터는 자동으로 해금됩니다.

lobotomy.egoextractor.name=E.G.O 추출 장치
lobotomy.egoextractor.ac_extract=추출
lobotomy.egoextractor.choose_risk=추출할 E.G.O의 위험 등급을 선택하세요.
lobotomy.egoextractor.choose=추출할 E.G.O를 선택하세요. 감정된 상태, 저주와 인챈트 없이 +0으로 만들어집니다.
lobotomy.egoextractor.back=뒤로
lobotomy.egoextractor.extracted=%s을(를) 추출했습니다.
lobotomy.egoextractor.desc=테스트용 장치. 원하는 E.G.O 장비를 몇 번이든 만들어 낼 수 있다.

lobotomy.dummysummoner.name=과녁 소환기
lobotomy.dummysummoner.ac_summon=소환
lobotomy.dummysummoner.choose=소환할 과녁을 선택하세요. 과녁은 최대 체력이 100이고 아무 행동도 하지 않습니다. 아군 과녁은 체력 50으로 소환됩니다.
lobotomy.dummysummoner.no_space=주변에 과녁을 놓을 공간이 없습니다.
lobotomy.dummysummoner.desc=테스트용 장치. 피해 배율을 시험할 과녁을 몇 번이든 불러낼 수 있다.
lobotomy.lcorphqgate.name=L사 본사 출입증
lobotomy.lcorphqgate.ac_enter=진입
lobotomy.lcorphqgate.already_here=이미 L사 본사에 있습니다.
lobotomy.lcorphqgate.locked=지금은 이 층을 떠날 수 없습니다.
lobotomy.lcorphqgate.desc=테스트용 장치. 클리포트의 나무를 본뜬 보스전 맵인 L사 본사로 이동한다. 지휘팀 로비에 있는 계단으로 원래 층에 돌아올 수 있다.

levels.lcorphqlevel.room_0=설계팀 로비
levels.lcorphqlevel.room_1=기록팀 로비
levels.lcorphqlevel.room_2=추출팀 로비
levels.lcorphqlevel.room_3=복지팀 로비
levels.lcorphqlevel.room_4=징계팀 로비
levels.lcorphqlevel.room_5=중앙본부 로비
levels.lcorphqlevel.room_6=안전팀 로비
levels.lcorphqlevel.room_7=교육팀 로비
levels.lcorphqlevel.room_8=정보팀 로비
levels.lcorphqlevel.room_9=지휘팀 로비

lobotomy.trainingdummy.desc=피해 배율 시험용 과녁. 아무 행동도 하지 않는다.
lobotomy.trainingdummy$resistant.name=내성 과녁 (전 속성 0.5)
lobotomy.trainingdummy$weak.name=취약 과녁 (전 속성 1.5)
lobotomy.trainingdummy$paleweak.name=PALE 과녁 (PALE 2.0)
lobotomy.trainingdummy$ally.name=아군 과녁 (체력 절반)

###갑옷 능력: 왕관은 갑옷을 바꾸지 않고 능력만 준다
items.kingscrown.desc=마지막 드워프 제왕의 왕관으로, 엄청난 마법 에너지로 빛나고 있습니다.\n\n이 왕관을 착용하면 _고유한 갑옷 능력_을 하나 얻습니다. 입고 있는 방어구는 그대로 남습니다.
items.kingscrown.upgraded=왕관이 밝게 빛나다가 무거운 기운만 남기고 사라졌다!
items.kingscrown.ratgraded=쥐 대왕의 앞발이 밝게 빛나며 왕관의 힘이 당신에게 스며들었다!
windows.wndchooseability.message=이 왕관을 머리 위에 올리자, 왕관이 뜨겁게 달아오릅니다. 왕관의 마법이 당신에게 스며드는 것이 느껴지지만, 당신의 지시가 필요한 상황입니다. 어떤 갑옷 능력을 선택하시겠습니까?
items.abilitycrown.name=강요된 무게
items.abilitycrown.desc=왕관이 사라진 뒤에도 어깨를 짓누르는 무게. 시간이 지나면 다시 힘이 차오르며, 그 힘으로 갑옷 능력을 쓸 수 있다.\n\n가방에 들고만 있어도 충전되며, 500턴에 걸쳐 가득 찹니다.
items.abilitycrown.ac_ability=능력 사용
items.abilitycrown.low_charge=갑옷 능력을 쓸 충전량이 부족하다!
items.abilitycrown.charge_use=지금 능력을 사용하면 _%s_ 만큼의 충전량을 사용합니다.
items.abilitycrown.no_ability=아직 갑옷 능력을 고르지 않았습니다.
items.abilitycrown.ac_relocate=긴급 재배치 (%d)

###옌더의 부적 → 빛의 씨앗, 부적의 저주 → 클리포트 폭주 (효과는 그대로, 원본 문구를 덮어쓴다)
actors.buffs.ascensionchallenge.name=클리포트 폭주
actors.buffs.ascensionchallenge.desc=어느 이유에선지 요그제바는 빛의 씨앗을 통해 이 세상에 대한 영향력을 유지하고 있고, 당신의 탈출을 방해하려 합니다!\n\n요그제바의 힘이 던전을 더 위험하게 만들었으며, 적의 수를 증가시키고 더욱 강력하게 만들었습니다! 요그제바의 힘은 시간이 지날수록 강해지며, 요그제바의 힘에 영향을 받은 적을 처치하면 약화될 수 있습니다.
actors.buffs.ascensionchallenge.desc_clear=빛의 씨앗이 발하는 암흑 에너지를 어떻게든 최대한 억제했습니다.
actors.buffs.ascensionchallenge.desc_beckon=빛의 씨앗은 _멀리 떨어진 적들을 호출하며,_ 당신의 위치를 노출시킵니다.
actors.buffs.ascensionchallenge.desc_haste=빛의 씨앗은 _멀리 떨어진 적들을 빨리 이동하게 하며,_ 당신을 빨리 추적하게 만듭니다!
actors.buffs.ascensionchallenge.desc_slow=빛의 씨앗은 _당신을 느리게 만들어,_ 가속 효과도 무효화합니다!
actors.buffs.ascensionchallenge.desc_damage=빛의 씨앗이 발하는 에너지가 너무 강력하여 _당신에게 직접 피해를 입힙니다!_
actors.buffs.ascensionchallenge.beckon=빛의 씨앗이 멀리 떨어진 적들을 부른다.
actors.buffs.ascensionchallenge.haste=빛의 씨앗이 멀리 떨어진 적들을 신속화한다!
actors.buffs.ascensionchallenge.slow=갑자기 빛의 씨앗이 너무나 무겁게 느껴진다!
actors.buffs.ascensionchallenge.damage=빛의 씨앗이 암흑 에너지를 발한다. 너무나 고통스럽다!
actors.buffs.ascensionchallenge.weaken_info=클리포트 폭주는 더 많은 적을 쓰러뜨려 약화시킬 수 있습니다.
actors.buffs.ascensionchallenge.weaken_info_no_kills=적을 쓰러뜨리면 클리포트 폭주가 약해집니다!
actors.buffs.ascensionchallenge.weaken=당신은 클리포트 폭주가 약해짐을 느낀다.
actors.buffs.ascensionchallenge.almost=빛의 씨앗에 대한 요그제바의 집착이 약해짐을 느낀다. 거의 다 왔다!
actors.mobs.npcs.shopkeeper.talk_ascent=그 빛의 씨앗으로 뭘 할 건지는 모르겠지만 난 엮이고 싶지 않아. 빨리 튀어야 하니까 얼른 물건부터 사고 나가라고!
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=그 빛의 씨앗으로 뭘 할 속셈인지 너도 알고 있는 거지?
items.food.pasty.amulet_name=빛의 씨앗
items.food.pasty.amulet_desc=드디어 빛의 씨앗을 찾았 - 잠깐만요, 이건 그 빛의 씨앗처럼 생긴 은박지포장 초콜릿이었네요! 그 빛의 씨앗처럼 무한한 힘을 얻지는 못할 테지만, 적어도 배를 채우고 약간의 유물 충전은 해줄 겁니다.\n\n만우절!
items.amulet.name=빛의 씨앗
items.amulet.desc=영겁의 시간 속에서 찾아 헤매왔던 답을 모두에게 전해주자.
items.amulet.desc_origins=빛의 씨앗의 기원은 알 수가 없습니다. 역사서에 따르면 드워프의 왕국에서 모든 연락이 끊기기 직전 그들의 제왕이 빛의 씨앗을 찾아 온 세상에 자랑했던 것으로 알려져 있습니다. 제왕은 어떻게 이 빛의 씨앗을 찾았을까요? 요그제바는 어떻게 이 빛의 씨앗을 빼앗았을까요? 정답은 나중에 찾아도 괜찮습니다. 어쨌든 빛의 씨앗은 당신이 가지고 있으니까요!
items.amulet.desc_ascent=빛의 씨앗의 기원은 알 수가 없습니다만, 확실히 요그제바의 힘과 연관이 있어 보입니다. 던전이 요그제바의 의지에 따라 뒤틀리고 있으며, 적들이 더욱 많이 나타나며 강력해집니다! 또한 빛의 씨앗이 저주라도 걸린 것 처럼 버리거나 발동할 수 없습니다.
items.amulet.ascent_desc=당신은 요그제바의 끔찍하리만치 강력한 힘이 빛의 씨앗을 통해 표출됨을 느낍니다. 필멸자인 채로 던전을 역행하는 것은 쉽지만은 않을 겁니다!\n\n빛의 씨앗을 가진 채로 던전을 역행할수록 클리포트 폭주 또한 강력해집니다. 층을 뛰어넘는 효과는 차단되며, 게임에서 승리하려면 던전을 직접 역행하여 탈출해야만 합니다!\n\n지금 빛의 씨앗을 버려 역행 저주 효과를 방지하거나, 빛의 씨앗을 발동하여 게임을 바로 끝낼 수 있습니다.
journal.document.intros.dungeon.body=수많은 영웅들이 당신보다 먼저 도시 아래의 던전을 탐험하였지만, 대부분은 그 후로 영영 소식이 끊겨 버렸습니다.\n\n전해지는 바로는 어떤 사악한 고대의 존재가 빛의 씨앗을 지키고 있다고 합니다. 지금에 이르러서는 그 사악한 기운이 올라오기 시작해, 도시 가까운 곳까지 영향을 끼치고 있습니다.\n\n당신은 던전을 정복하고 빛의 씨앗을 쟁취할 수 있을까요? 이제 당신만의 모험기를 만들어갈 차례입니다!
journal.document.halls_king.amulet.title=빛의 씨앗
journal.document.halls_king.amulet.body=내가 해냈다!\n\n정확히 무엇을 찾았는지는 알 수 없었지만, 나의 예상을 한참 벗어난 물건이었다. 엄청난 힘이, 주인을 기다리고 있는 듯했다. 물론 그 주인은 이 몸이지!\n\n이것으로 궁정의 바보들 중 그 누구도 감히 나를 반대하지 않을 것이다. 그들을 모욕할 수 있는 수십 개의 방법을 생각하느라 정신이 하나도 없군. 젠장, 그 뿐이겠나? 난 내가 원한다면 그들 모두를 파괴해 버릴 수 있는 힘을 가지고 있다고! 물론 그건 좀 지나칠 수도 있지만, 그들이 의심하기 전에 빨리 결정하는 게 좋겠군.\n\n이 위대한 힘을 빛의 씨앗이라고 불러야겠어!\n- R.
journal.document.halls_king.thing.body=문제가 생겼다. 티모르는 힘들이지 않고 제압했지만, 내가 외부 차원에 벌인 짓이 새어나간 듯 했다.\n\n어떤... '무언가'... 가 내 세계의 이끌려서 전당 하층부 바닥을 억지로 통과하기 시작했다. 공교롭게도, 그 곳은 내가 빛의 씨앗을 보관한 장소가 아니던가! 이 독살스러운 생명체 같으니, 아직 빼앗아야 할 것이 산더미같은데 왜 벌써부터 나를 거역하려 드는 것이지?\n\n내 힘에도 불구하고, 저것을 정면 돌파할 수 있을 거라 생각하지는 않는다. 그것의 진정한 힘은 불가사의하지만, 그래도 그 힘을 억제할 방법이 있을 것이다. 나는 내 보물을 지키겠어!
journal.document.halls_king.attrition.body=나에게 그 무언가를 처리할 계획이 있다. 그 힘은 무한하지만, 이 세계에 영향을 끼칠 방법은 한정적이다. 놈은 빛의 씨앗을 직접 가져갈 힘을 기르기 전까지는 그저 하수인과 화신을 만들어 내보낼 수 밖에 없는 것 같다.\n\n내가 물리적으로 그 빛의 씨앗을 가지고 있는 것은 아니지만, 나는 여전히 그 힘을 완전히 통제할 수 있다. 드워프 도시 전체를 내 마음대로 쓸 수 있으니 내가 수적으로 우세할 것이다. 꾸준히 그 곳으로 병사들을 보내 소모전을 벌이면 빛의 씨앗을 빼앗아 가는 것도 막을 수 있겠지!\n\n나, 드워프의 제왕 로드니는 네놈 요그제바보다 더 오래 버틸 것이다!
badges$badge.victory.title=빛의 씨앗 발아
badges$badge.victory.desc=빛의 씨앗 획득
badges$badge.will_to_stand_tall.title=똑바로 설 수 있는 의지
badges$badge.will_to_stand_tall.desc=말쿠트로 빛의 씨앗 획득
badges$badge.reason_to_discern.title=분별할 수 있는 이성
badges$badge.reason_to_discern.desc=예소드로 빛의 씨앗 획득
badges$badge.hope_to_be_better.title=더 나은 존재가 될 수 있다는 희망
badges$badge.hope_to_be_better.desc=호드로 빛의 씨앗 획득
badges$badge.victory_all_classes.desc=모든 직업으로 빛의 씨앗 획득
badges$badge.happy_end.desc=빛의 씨앗을 들고 지상으로 탈출
badges$badge.pacifist_ascent.desc=역행 중 클리포트 폭주를 한 번도 약화하지 않고 지상으로 나오기
badges$badge.victory_random.desc=무작위로 생성된 영웅, 특성 업그레이드, 보조 직업, 갑옷 능력을 가지고 빛의 씨앗 획득
rankings$record.won=빛의 씨앗 획득
rankings$record.ascended=빛의 씨앗을 가지고 역행 성공!
scenes.amuletscene.text=마침내, 당신은 빛의 씨앗을 손에 넣었다! 이 빛의 씨앗의 힘이 있으면 그 어떠한 것도 당신의 앞을 막지 못할 것이다! 당신은 던전을 정복하고 임무를 완수했다!\n\n아직 준비가 되지 않았다면, 당신은 아주 잠시 동안만 필멸자로 남을 수도 있다. 옛 방식처럼 던전을 역행하는 것도 나쁘지 않은 선택일 것이다...

###게임 이름: Sefirot Pixel Dungeon
scenes.welcomescene.update_intro=Sefirot Pixel Dungeon이 업데이트되었습니다!
scenes.welcomescene.patch_intro=Sefirot Pixel Dungeon이 패치되었습니다!
scenes.welcomescene.what_msg=현재 저장된 게임은 Sefirot Pixel Dungeon의 나중 버전에서 나온 것입니다!\n\n현재 버전에 등장하지 않는 요소들이 충돌을 일으킬 수 있으니, 조심하십시오!
scenes.welcomescene.save_warning=최근에 게임 데이터를 저장하는 동안 게임이 중단되었습니다. Sefirot Pixel Dungeon에는 이에 대한 보호 기능이 내장되어 있기 때문에 게임 데이터는 안전합니다.\n\n일반적으로 이 문제는 디바이스의 전원이 갑자기 끊기거나 게임이 정상적으로 종료되지 않았을 때 발생합니다. 대부분의 경우 모바일 디바이스에서 배터리 절약 기능으로 인해 이 문제가 발생할 수 있습니다. 이 오류가 반복될 경우 디바이스를 재시작해 보십시오.
windows.wndvictorycongrats.thank_you=Sefirot Pixel Dungeon을 플레이해 주셔서 대단히 감사합니다!

# Ambitious imp vault mirror reward for Malkuth
actors.mobs.npcs.vaultmirror.scene_malkuth=당신에게 지휘팀 메인 룸의 책상 위에 펼쳐진 _말쿠트의 수첩_이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 수첩에는 업무 지시가 빼곡히 적혀 있어야 하지만, 이 수첩의 일정은 아직 오지 않은 날들까지 모두 완료 표시가 되어 있습니다. 책상 주변은 고요하고, 당신을 기다리는 직원은 아무도 없습니다.

###예소드
actors.hero.heroclass.yesod=예소드
actors.hero.heroclass.yesod_desc_short=정보팀의 세피라. 감정과 탐색으로 _정보력_을 모으고, _예소드의 목도리_로 정보력을 소모해 전투를 유리하게 이끕니다.
actors.hero.heroclass.yesod_desc=예소드는 _정보력_을 소모해 능력을 쓰는 _예소드의 목도리_를 가지고 시작합니다. 아이템을 _감정_하면 _3_, 탐색으로 _함정_을 찾으면 _1_, _비밀 문_을 찾으면 _3_, 이번 판에서 처음 보는 종류의 적을 처치하면 _1_의 정보력을 얻습니다(최대 _20_).\n\n예소드는 또한 _제압봉_, _투척용 돌_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n예소드는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 마법 지도의 주문서\n_-_ 심안의 물약
actors.hero.heroclass.yesod_unlock=예소드는 자동으로 해금됩니다.

actors.hero.herosubclass.info_sephirah=정보팀 세피라
actors.hero.herosubclass.info_sephirah_short_desc=_정보팀 세피라_는 정보력으로 몸을 숨기는 _검열_과, 상점에서 정보력으로 물건을 사는 _정보 교환_을 쓸 수 있습니다.
actors.hero.herosubclass.info_sephirah_desc=정보팀 세피라는 예소드의 목도리로 두 가지 능력을 더 쓸 수 있습니다.\n\n_검열:_ 정보력 _5_를 소모해 _5턴_ 동안 투명해지고, 주변 _5×5_ 범위에 _5턴_ 동안 연막을 깝니다.\n\n_정보 교환:_ 상점에서 정보력 1당 _75골드_의 가치로 아이템을 살 수 있습니다.
actors.hero.herosubclass.tech_librarian=기술과학의 층 지정사서
actors.hero.herosubclass.tech_librarian_short_desc=_기술과학의 층 지정사서_는 정보력을 모두 쏟아부어 _충전_을 얻고, 주는 피해를 크게 늘립니다.
actors.hero.herosubclass.tech_librarian_desc=기술과학의 층 지정사서는 예소드의 목도리로 _충전_을 쓸 수 있습니다. 충전은 턴을 소모하지 않으며, 보유한 정보력을 모두 소비해 같은 수치의 _충전_을 얻습니다.\n\n충전 1당 주는 피해가 _5%_ 증가하며, 충전은 매 턴 1씩 줄어듭니다. 충전이 남아 있을 때 다시 쓰면 수치가 더해집니다.

actors.hero.talent.damage_normalization.title=피해 정규화
actors.hero.talent.damage_normalization.desc=_+1:_ 무기 공격의 최소 피해가 _1_ 증가합니다.\n\n_+2:_ 무기 공격의 최소 피해가 _2_ 증가합니다.
actors.hero.talent.document_review.title=문서 검토
actors.hero.talent.document_review.desc=_+1:_ 특성을 찍는 즉시 미감정 아이템 _하나_를 골라 감정합니다.\n\n_+2:_ 특성을 찍는 즉시 미감정 아이템을 _하나 더_ 골라 감정합니다.\n\n감정할 아이템이 없거나 선택을 취소하면, 예소드의 목도리의 _문서 검토_ 메뉴로 나중에 쓸 수 있습니다.
actors.hero.talent.security_procedure.title=보안 절차
actors.hero.talent.security_procedure.desc=_+1:_ 함정이나 비밀 문을 밝혀내면 _3_의 보호막을 얻습니다.\n\n_+2:_ 함정이나 비밀 문을 밝혀내면 _5_의 보호막을 얻습니다.\n\n보호막은 중첩되지 않습니다.
actors.hero.talent.info_network.title=정보 수집망
actors.hero.talent.info_network.desc=_+1:_ 탐색 범위가 3x3 사각형에서 _5x5 사각형_으로 증가합니다.\n\n_+2:_ 탐색 범위가 3x3 사각형에서 _7x7 사각형_으로 증가합니다.
actors.hero.talent.risk_report.title=위험 보고서
actors.hero.talent.risk_report.desc=_+1:_ 식사에 _1턴_만 소모되며, 식사 시 정보력을 _1_ 얻습니다.\n\n_+2:_ 식사에 _1턴_만 소모되며, 식사 시 정보력을 _2_ 얻습니다.
actors.hero.talent.go_visualization.title=G.O 시각화
actors.hero.talent.go_visualization.desc=_+1:_ 분석된 적이 주는 피해가 _20%_ 감소합니다.\n\n_+2:_ 분석된 적이 주는 피해가 _20%_ 감소하고, 받는 피해가 _20%_ 증가합니다.
actors.hero.talent.database.title=데이터베이스
actors.hero.talent.database.desc=_+1:_ 주문서를 읽으면 정보력을 _1_ 얻습니다.\n\n_+2:_ 주문서를 읽으면 정보력을 _2_ 얻습니다.
actors.hero.talent.field_surveillance.title=현장 감시
actors.hero.talent.field_surveillance.desc=_+1:_ _2칸_ 이내의 적을 벽 너머로도 감지합니다.\n\n_+2:_ _3칸_ 이내의 적을 벽 너머로도 감지합니다.
actors.hero.talent.emergency_response.title=비상 대응
actors.hero.talent.emergency_response.desc=_+1:_ 체력이 _25%_ 아래로 떨어지면 정보력을 최대 _5_까지 소모해, 소모한 정보력 1당 최대 체력의 _10%_를 회복합니다. 한 층에 _1번_만 발동합니다.\n\n_+2:_ 체력이 _25%_ 아래로 떨어지면 정보력을 최대 _5_까지 소모해, 소모한 정보력 1당 최대 체력의 _15%_를 회복합니다. 한 층에 _1번_만 발동합니다.

actors.hero.yesod.infopower.name=정보력
actors.hero.yesod.infopower.desc=예소드가 모은 정보입니다. 예소드의 목도리의 능력을 쓰는 데 소모됩니다.\n\n아이템 감정: _+3_\n탐색으로 함정 발견: _+1_\n탐색으로 비밀 문 발견: _+3_\n처음 보는 종류의 적 처치: _+1_\n\n현재 정보력: %1$d/%2$d
actors.hero.yesod.infopower.gain=정보력 +%d
actors.hero.yesod.analyzed.name=분석됨
actors.hero.yesod.analyzed.desc=예소드가 이 대상을 분석했습니다. 명중과 회피가 _20%%_ 감소하며, 시야를 벗어나도 위치가 드러납니다.\n\n남은 턴: %s.
actors.hero.yesod.prediction$evade.name=예측: 회피
actors.hero.yesod.prediction$evade.desc=상대의 다음 수를 예측했습니다. 다음에 받는 공격 1회를 반드시 회피합니다.
actors.hero.yesod.prediction$strike.name=예측: 필중
actors.hero.yesod.prediction$strike.desc=상대의 움직임을 예측했습니다. 다음 공격 1회는 반드시 명중합니다.

items.yesodscarf.name=예소드의 목도리
items.yesodscarf.desc=정보팀 세피라 예소드가 입가까지 올려 두르는 검은 목도리다. 흐트러짐 없이 정돈된 모습은 그가 다루는 정보만큼이나 빈틈이 없다.
items.yesodscarf.effect=_분석 (정보력 %1$d):_ 시야 안의 대상 하나에 _%2$d턴_ 동안 분석됨을 겁니다. 분석된 대상은 명중과 회피가 _20%%_ 감소하고, 시야를 벗어나도 위치가 드러납니다.\n\n_탐지 (정보력 %3$d):_ 주변 _%4$d칸_의 지형을 밝히고 함정과 비밀을 드러냅니다. 이렇게 찾은 비밀로는 정보력을 얻지 않습니다.\n\n_예측 (정보력 %5$d):_ 다음에 받는 공격 1회를 반드시 회피하고, 다음 공격 1회는 반드시 명중합니다.
items.yesodscarf.turn_note=각 능력은 _1턴_을 소모합니다.
items.yesodscarf.turn_note_tech=충전을 제외한 각 능력은 _1턴_을 소모합니다.
items.yesodscarf.choose_msg=사용할 능력을 선택하세요.\n\n현재 정보력: _%1$d/%2$d_
items.yesodscarf.ac_analyze=분석 (%d)
items.yesodscarf.ac_detect=탐지 (%d)
items.yesodscarf.ac_predict=예측 (%d)
items.yesodscarf.ac_review=문서 검토 (%d)
items.yesodscarf.no_info=정보력이 부족합니다. (필요: %d)
items.yesodscarf.no_target=분석할 대상이 없습니다.
items.yesodscarf.analyze_prompt=분석할 대상을 선택하세요
items.yesodscarf.review_prompt=감정할 아이템을 선택하세요
items.yesodscarf.review_nothing=감정할 아이템이 없습니다. 예소드의 목도리의 문서 검토 메뉴로 나중에 감정할 수 있습니다.
items.yesodscarf.review_done=문서를 검토해 %s의 정체를 알아냈습니다.
items.yesodscarf.ac_censor=검열 (%d)
items.yesodscarf.ac_charge=충전
items.yesodscarf.no_charge=충전에 쓸 정보력이 없습니다.
items.yesodscarf.charged=정보력 %d를 모두 쏟아부어 충전했습니다!
items.yesodscarf.buy_info=정보로 구매 (정보력 %d)
items.yesodscarf.effect_info=_검열 (정보력 %1$d):_ _%2$d턴_ 동안 투명해지고, 주변 _5×5_ 범위에 연막을 깝니다.\n\n_정보 교환:_ 상점에서 정보력 1당 _%3$d골드_의 가치로 아이템을 살 수 있습니다.
items.yesodscarf.effect_tech=_충전 (턴 소모 없음):_ 보유한 정보력을 모두 소비해 같은 수치의 충전을 얻습니다. 충전 1당 주는 피해가 _%d%%_ 증가하며, 매 턴 1씩 줄어듭니다.

actors.hero.yesod.charge.name=충전
actors.hero.yesod.charge.desc=정보력을 쏟아부어 출력을 끌어올렸습니다. 충전 1당 주는 피해가 5%% 증가하며, 충전은 매 턴 1씩 줄어듭니다.\n\n현재 충전: %1$d (피해 +%2$d%%)
actors.hero.yesod.commission.name=의뢰 대상
actors.hero.yesod.commission.desc=이 대상은 이번 층의 의뢰 대상입니다. 처치하면 정보력과 함께 보상 아이템을 얻습니다.
actors.hero.yesod.commission.assigned=이번 층의 의뢰 대상: %s
actors.hero.yesod.commission.complete=의뢰를 완수했습니다!

actors.hero.talent.surveillance_camera.title=감시 카메라
actors.hero.talent.surveillance_camera.desc=_+1:_ 새 층에 처음 도착하면 도착한 계단 주변 _8칸_의 지형과 숨겨진 함정, 비밀 문이 밝혀집니다.\n\n_+2:_ 새 층에 처음 도착하면 도착한 계단 주변 _10칸_의 지형과 숨겨진 함정, 비밀 문이 밝혀집니다.\n\n_+3:_ 새 층에 처음 도착하면 도착한 계단 주변 _12칸_의 지형과 숨겨진 함정, 비밀 문이 밝혀집니다.\n\n이렇게 찾은 비밀로도 정보력을 얻습니다.
actors.hero.talent.document_organize.title=문서 정리
actors.hero.talent.document_organize.desc=_+1:_ 정보력의 최대치가 _5_ 증가합니다.\n\n_+2:_ 정보력의 최대치가 _10_ 증가합니다.\n\n_+3:_ 정보력의 최대치가 _15_ 증가합니다.
actors.hero.talent.yesod_farsight.title=천리안
actors.hero.talent.yesod_farsight.desc=_+1:_ 시야 범위가 _25%_ 증가합니다.\n\n_+2:_ 시야 범위가 _50%_ 증가합니다.\n\n_+3:_ 시야 범위가 _75%_ 증가합니다.
actors.hero.talent.info_spread.title=정보 전파
actors.hero.talent.info_spread.desc=_+1:_ 분석을 쓰면 시야 안에서 대상과 가장 가까운 적 _1명_도 분석됩니다.\n\n_+2:_ 분석을 쓰면 시야 안에서 대상과 가장 가까운 적 _2명_도 분석됩니다.\n\n_+3:_ 분석을 쓰면 시야 안에서 대상과 가장 가까운 적 _3명_도 분석됩니다.
actors.hero.talent.viper_yesod.title=독사 예소드
actors.hero.talent.viper_yesod.desc=_+1:_ 보유한 정보력 1당 주는 피해가 _1%_ 증가합니다.\n\n_+2:_ 보유한 정보력 1당 주는 피해가 _1.5%_ 증가합니다.\n\n_+3:_ 보유한 정보력 1당 주는 피해가 _2%_ 증가합니다.
actors.hero.talent.violence.title=폭력성
actors.hero.talent.violence.desc=_+1:_ 무기 공격의 최소 피해가 _1_로 고정되고, 줄어든 수치의 _2배_만큼 최대 피해가 증가합니다.\n\n_+2:_ 무기 공격의 최소 피해가 _1_로 고정되고, 줄어든 수치의 _3배_만큼 최대 피해가 증가합니다.\n\n_+3:_ 무기 공격의 최소 피해가 _1_로 고정되고, 줄어든 수치의 _4배_만큼 최대 피해가 증가합니다.
actors.hero.talent.commission.title=의뢰
actors.hero.talent.commission.desc=새 층에 처음 도착하면 무작위 적 하나가 _의뢰 대상_이 됩니다(보스 제외). 의뢰 대상을 처치하면 아이템을 반드시 떨어뜨립니다.\n\n_+1:_ 정보력을 _1_ 얻고, _일반_ 등급 아이템이 나옵니다. 장비가 나오면 _+0_ 이상입니다.\n\n_+2:_ 정보력을 _2_ 얻고, _고급_ 등급 아이템이 나옵니다. 장비가 나오면 _+1_ 이상입니다.\n\n_+3:_ 정보력을 _3_ 얻고, _희귀_ 등급 아이템이 나옵니다. 장비가 나오면 _+2_ 이상입니다.
actors.hero.talent.black_flame.title=흑염
actors.hero.talent.black_flame.desc=받는 피해가 _50%_ 증가합니다.\n\n_+1:_ 주는 피해가 _50%_ 증가합니다.\n\n_+2:_ 주는 피해가 _75%_ 증가합니다.\n\n_+3:_ 주는 피해가 _100%_ 증가합니다.

actors.hero.abilities.yesod.anomalymanual.name=환상체 대응 매뉴얼
actors.hero.abilities.yesod.anomalymanual.short_desc=예소드는 _환상체 대응 매뉴얼_을 따라 잠시 동안 받는 피해를 크게 줄일 수 있습니다.
actors.hero.abilities.yesod.anomalymanual.desc=예소드가 환상체 대응 매뉴얼을 펼쳐, _5턴_ 동안 받는 피해가 _50%_ 감소합니다.\n\n매뉴얼을 펼치는 데 _1턴_이 걸립니다.
actors.hero.abilities.yesod.anomalymanual$manualbuff.name=환상체 대응 매뉴얼
actors.hero.abilities.yesod.anomalymanual$manualbuff.desc=매뉴얼에 따라 침착하게 대응하고 있습니다. 받는 피해가 50%% 감소합니다.\n\n남은 턴: %s.
actors.hero.abilities.yesod.regretstrike.name=후회
actors.hero.abilities.yesod.regretstrike.prompt=후회를 내려칠 대상을 선택하세요
actors.hero.abilities.yesod.regretstrike.no_target=후회를 내려칠 적이 없습니다.
actors.hero.abilities.yesod.regretstrike.too_far=대상이 너무 멀리 있습니다.
actors.hero.abilities.yesod.regretstrike.blocked=대상 옆으로 뛰어들 공간이 없습니다.
actors.hero.abilities.yesod.regretstrike.short_desc=예소드는 _후회_로 적을 짓뭉개는 일격을 가하고 마비시킬 수 있습니다.
actors.hero.abilities.yesod.regretstrike.desc=예소드가 인접한 적에게 최대 피해가 _50%_ 증가한 근접 공격을 가합니다. 이 공격은 반드시 명중하며, 대상을 _5턴_ 동안 _마비_시킵니다. 보스는 _2턴_ 동안만 마비됩니다.
actors.hero.abilities.yesod.solemnlamentvolley.name=엄숙한 애도
actors.hero.abilities.yesod.solemnlamentvolley.prompt=사격할 대상을 선택하세요 (남은 탄환: %d)
actors.hero.abilities.yesod.solemnlamentvolley.short_desc=예소드는 _엄숙한 애도_의 탄환 _7발_을 한 발씩 겨누어 쏠 수 있습니다.
actors.hero.abilities.yesod.solemnlamentvolley.desc=예소드가 엄숙한 애도를 꺼내 탄환 _7발_을 한 발씩 직접 겨누어 쏩니다. 쏘는 동안에는 턴이 흐르지 않으며, 사격을 마치면 _1턴_이 지납니다. 선택을 취소하면 남은 탄환을 쏘지 않고 사격을 마칩니다.\n\n탄환은 E.G.O 엄숙한 애도처럼 WHITE 피해와 BLACK 피해를 각각 따로 주며, 탄환의 강화 수치는 _장착한 무기_를 따릅니다.

actors.hero.talent.extended_manual.title=연장 매뉴얼
actors.hero.talent.extended_manual.desc=_+1:_ 환상체 대응 매뉴얼의 지속 시간이 _1턴_ 늘어납니다.\n\n_+2:_ 환상체 대응 매뉴얼의 지속 시간이 _2턴_ 늘어납니다.\n\n_+3:_ 환상체 대응 매뉴얼의 지속 시간이 _3턴_ 늘어납니다.\n\n_+4:_ 환상체 대응 매뉴얼의 지속 시간이 _4턴_ 늘어납니다.
actors.hero.talent.damage_record.title=피해 기록
actors.hero.talent.damage_record.desc=_+1:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _1번_까지입니다.\n\n_+2:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _2번_까지입니다.\n\n_+3:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _3번_까지입니다.\n\n_+4:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _4번_까지입니다.
actors.hero.talent.counter_guideline.title=반격 지침
actors.hero.talent.counter_guideline.desc=_+1:_ 환상체 대응 매뉴얼로 줄어든 피해의 _25%_를 공격자에게 되돌려줍니다.\n\n_+2:_ 환상체 대응 매뉴얼로 줄어든 피해의 _50%_를 공격자에게 되돌려줍니다.\n\n_+3:_ 환상체 대응 매뉴얼로 줄어든 피해의 _75%_를 공격자에게 되돌려줍니다.\n\n_+4:_ 환상체 대응 매뉴얼로 줄어든 피해의 _100%_를 공격자에게 되돌려줍니다.
actors.hero.talent.min_correction.title=구속당한 분노
actors.hero.talent.min_correction.desc=_+1:_ 후회의 최소 피해가 최대 피해의 _30%_ 아래로 내려가지 않습니다.\n\n_+2:_ 후회의 최소 피해가 최대 피해의 _45%_ 아래로 내려가지 않습니다.\n\n_+3:_ 후회의 최소 피해가 최대 피해의 _60%_ 아래로 내려가지 않습니다.\n\n_+4:_ 후회의 최소 피해가 최대 피해의 _75%_ 아래로 내려가지 않습니다.
actors.hero.talent.ripple.title=금속성 울림
actors.hero.talent.ripple.desc=_+1:_ 후회가 대상 주변 8칸의 적에게도 _15%_의 스플래시 피해를 입힙니다.\n\n_+2:_ 후회가 대상 주변 8칸의 적에게도 _30%_의 스플래시 피해를 입힙니다.\n\n_+3:_ 후회가 대상 주변 8칸의 적에게도 _45%_의 스플래시 피해를 입힙니다.\n\n_+4:_ 후회가 대상 주변 8칸의 적에게도 _60%_의 스플래시 피해를 입힙니다.
actors.hero.talent.pursuit.title=추격
actors.hero.talent.pursuit.desc=_+1:_ 후회로 _2칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.\n\n_+2:_ 후회로 _3칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.\n\n_+3:_ 후회로 _4칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.\n\n_+4:_ 후회로 _5칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.
actors.hero.talent.coffin.title=관
actors.hero.talent.coffin.desc=_+1:_ 엄숙한 애도의 탄환이 _1발_ 늘어납니다.\n\n_+2:_ 엄숙한 애도의 탄환이 _2발_ 늘어납니다.\n\n_+3:_ 엄숙한 애도의 탄환이 _3발_ 늘어납니다.\n\n_+4:_ 엄숙한 애도의 탄환이 _4발_ 늘어납니다.
actors.hero.talent.dead_butterfly.title=죽은나비
actors.hero.talent.dead_butterfly.desc=_+1:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _3_의 고정 피해를 줍니다.\n\n_+2:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _4_의 고정 피해를 줍니다.\n\n_+3:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _5_의 고정 피해를 줍니다.\n\n_+4:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _6_의 고정 피해를 줍니다.
actors.hero.talent.living_butterfly.title=산나비
actors.hero.talent.living_butterfly.desc=_+1:_ 엄숙한 애도의 탄환이 명중할 때마다 _1_의 보호막을 얻습니다.\n\n_+2:_ 엄숙한 애도의 탄환이 명중할 때마다 _2_의 보호막을 얻습니다.\n\n_+3:_ 엄숙한 애도의 탄환이 명중할 때마다 _3_의 보호막을 얻습니다.\n\n_+4:_ 엄숙한 애도의 탄환이 명중할 때마다 _4_의 보호막을 얻습니다.

# Ambitious imp vault mirror reward for Yesod
actors.mobs.npcs.vaultmirror.scene_yesod=당신에게 정보팀 사무실의 정리된 서류철 위에 개어진 _예소드의 목도리_가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 서류철의 보고서들은 한 장도 빠짐없이 결재되어 있지만, 그 어느 장에도 작성자의 이름이 적혀 있지 않습니다. 화면들은 모두 꺼져 있고, 사무실에는 정적만이 흐릅니다.
scenes.changesscene.github_notice=패치노트는 GitHub에서 확인해주세요.
scenes.changesscene.github_button=GitHub에서 패치노트 보기

###호드
actors.hero.heroclass.hod=호드
actors.hero.heroclass.hod_desc_short=교육팀의 세피라. _교육 매뉴얼 보급_으로 경험치를 더 얻고, 레벨이 오를수록 특성이 강해집니다.
actors.hero.heroclass.hod_desc=호드는 _교육 매뉴얼 보급_을 가지고 시작합니다. 적을 처치해 얻는 경험치가 _20%_ 증가하며, 현재 레벨과 같은 수의 _스택_을 가집니다. 호드의 특성은 스택이 많을수록 강해집니다.\n\n호드는 또한 _제압봉_, _투척용 돌_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n호드는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 강화의 주문서\n_-_ 경험의 물약
actors.hero.heroclass.hod_unlock=호드는 자동으로 해금됩니다.

actors.hero.herosubclass.training_sephirah=교육팀 세피라
actors.hero.herosubclass.training_sephirah_short_desc=_교육팀 세피라_는 최대 레벨이 _40_으로 늘어나고, 더 높은 레벨에서도 적에게서 경험치를 얻습니다.
actors.hero.herosubclass.training_sephirah_desc=교육팀 세피라는 최대 레벨이 _30_에서 _40_으로 늘어납니다. 31레벨부터는 특성 포인트를 얻지 못하지만 체력, 정확도, 회피는 계속 오르고 교육 매뉴얼 보급의 스택도 계속 쌓입니다.\n\n또한 _경험치 제한 레벨_이 _5_ 늘어나, 원래라면 경험치를 주지 않을 만큼 레벨 차이가 나는 적에게서도 5레벨까지 더 경험치를 얻습니다.
actors.hero.herosubclass.literature_librarian=문학의 층 지정사서
actors.hero.herosubclass.literature_librarian_short_desc=_문학의 층 지정사서_는 공격할 때마다 _출혈_을 부여하고, _속박_된 적에게 더 큰 피해를 줍니다.
actors.hero.herosubclass.literature_librarian_desc=문학의 층 지정사서는 공격할 때마다 교육 매뉴얼 보급 스택의 _절반_만큼 _출혈_을 부여합니다.\n\n또한 _속박_된 적에게 주는 피해가 _20%_ 증가합니다.

actors.hero.hod.hodmanual.name=교육 매뉴얼 보급
actors.hero.hod.hodmanual.desc=교육팀이 정성껏 정리해 보급한 교육 매뉴얼입니다. 적을 처치해 얻는 경험치가 _%2$d%%_ 증가합니다.\n\n스택은 호드의 레벨과 같으며, 호드의 특성은 스택이 많을수록 강해집니다.\n\n현재 스택: _%1$d_
actors.hero.hod.hodmanual.vault=금고의 거울에서 받은 교육 덕분에, 금고 안에서는 스택이 _%d_ 늘어나 있습니다.

actors.hero.talent.rest_time.title=휴식 시간
actors.hero.talent.rest_time.desc=_+1:_ 레벨이 오를 때마다 _스택_만큼 체력을 회복합니다.\n\n_+2:_ 레벨이 오를 때마다 _스택의 2배_만큼 체력을 회복합니다.
actors.hero.talent.work_familiarity.title=업무 숙지
actors.hero.talent.work_familiarity.desc=_+1:_ 무기, 방어구, 반지를 _1.5배_ 빠르게 감정합니다.\n\n_+2:_ 무기, 방어구, 반지를 _2배_ 빠르게 감정합니다.
actors.hero.talent.practical_eval.title=실습 평가
actors.hero.talent.practical_eval.desc=_+1:_ 각 적에게 처음 적중한 공격이 _스택의 1/3_만큼 추가 피해를 줍니다.\n\n_+2:_ 각 적에게 처음 적중한 공격이 _스택의 2/3_만큼 추가 피해를 줍니다.
actors.hero.talent.safety_training.title=안전 교육
actors.hero.talent.safety_training.desc=_+1:_ 층마다 처음으로 체력이 _50%_ 아래로 떨어지면 _스택_만큼 보호막을 얻습니다.\n\n_+2:_ 층마다 처음으로 체력이 _50%_ 아래로 떨어지면 _스택의 2배_만큼 보호막을 얻습니다.
actors.hero.talent.lunch_seminar.title=점심 세미나
actors.hero.talent.lunch_seminar.desc=_+1:_ 식사에 _1턴_만 소모되며, 식사로 실제로 회복한 허기의 _5%_만큼 경험치를 얻습니다.\n\n_+2:_ 식사에 _1턴_만 소모되며, 식사로 실제로 회복한 허기의 _7.5%_만큼 경험치를 얻습니다.\n\n이 경험치는 교육 매뉴얼 보급의 보너스를 받지 않습니다.
actors.hero.talent.job_training.title=직무 교육 강화
actors.hero.talent.job_training.desc=_+1:_ 교육 매뉴얼 보급의 경험치 보너스가 _10%_ 늘어나 _30%_가 됩니다.\n\n_+2:_ 교육 매뉴얼 보급의 경험치 보너스가 _20%_ 늘어나 _40%_가 됩니다.
actors.hero.talent.basic_fitness.title=기초 체력 훈련
actors.hero.talent.basic_fitness.desc=_+1:_ 최대 체력이 _스택의 절반_만큼 증가합니다.\n\n_+2:_ 최대 체력이 _스택_만큼 증가합니다.
actors.hero.talent.demo_training.title=시범 훈련
actors.hero.talent.demo_training.desc=_+1:_ 스택 1당 정확도가 _1%_ 증가합니다.\n\n_+2:_ 스택 1당 정확도가 _1.5%_ 증가합니다.
actors.hero.talent.field_adaptation.title=실무 적응
actors.hero.talent.field_adaptation.desc=_+1:_ 스택 1당 회피가 _0.5%_ 증가합니다.\n\n_+2:_ 스택 1당 회피가 _1%_ 증가합니다.
actors.hero.talent.potential_dev.title=잠재력 개발
actors.hero.talent.potential_dev.desc=_+1:_ 스택 _15_마다 장착한 _무기_의 강화 수치가 _1_ 증가합니다.\n\n_+2:_ 스택 _15_마다 장착한 _무기와 방어구_의 강화 수치가 _1_ 증가합니다.\n\n_+3:_ 스택 _15_마다 장착한 _무기, 방어구, 반지_의 강화 수치가 _1_ 증가합니다.
actors.hero.talent.training_result.title=교육 성과
actors.hero.talent.training_result.desc=_+1:_ 스택 1당 근접 공격의 피해가 _0.5%_ 증가합니다.\n\n_+2:_ 스택 1당 근접 공격의 피해가 _1%_ 증가합니다.\n\n_+3:_ 스택 1당 근접 공격의 피해가 _1.5%_ 증가합니다.
actors.hero.talent.clumsy_goodwill.title=어수룩한 호의
actors.hero.talent.clumsy_goodwill.desc=_+1:_ 스택 _4_마다 최대 방어력이 _1_ 증가합니다.\n\n_+2:_ 스택 _3_마다 최대 방어력이 _1_ 증가합니다.\n\n_+3:_ 스택 _2_마다 최대 방어력이 _1_ 증가합니다.
actors.hero.talent.hope_it_helps.title=도움이 되었으면
actors.hero.talent.hope_it_helps.desc=_+1:_ 레벨이 오르거나 경험의 물약을 마시면 _2턴_ 동안 무적이 됩니다.\n\n_+2:_ 레벨이 오르거나 경험의 물약을 마시면 _3턴_ 동안 무적이 됩니다.\n\n_+3:_ 레벨이 오르거나 경험의 물약을 마시면 _4턴_ 동안 무적이 됩니다.\n\n무적인 동안에는 피의 성배로 자신을 찌를 수 없습니다.
actors.hero.talent.certificate.title=수료증 발급
actors.hero.talent.certificate.desc=_+1:_ 경험치 제한 레벨이 _5_ 대신 _7_ 늘어납니다.\n\n_+2:_ 경험치 제한 레벨이 _5_ 대신 _9_ 늘어납니다.\n\n_+3:_ 경험치 제한 레벨이 _5_ 대신 _11_ 늘어납니다.
actors.hero.talent.obsession.title=집착
actors.hero.talent.obsession.desc=_+1:_ 공격으로 부여하는 출혈이 _33%_ 증가합니다.\n\n_+2:_ 공격으로 부여하는 출혈이 _66%_ 증가합니다.\n\n_+3:_ 공격으로 부여하는 출혈이 _100%_ 증가합니다.
actors.hero.talent.cocoon.title=고치
actors.hero.talent.cocoon.desc=_+1:_ 공격이 적중하면 대상에게 _1턴_의 마비와 _2턴_의 속박, 취약을 겁니다. 재사용 대기시간은 _20턴_입니다.\n\n_+2:_ 공격이 적중하면 대상에게 _1턴_의 마비와 _2턴_의 속박, 취약을 겁니다. 재사용 대기시간은 _15턴_입니다.\n\n_+3:_ 공격이 적중하면 대상에게 _1턴_의 마비와 _2턴_의 속박, 취약을 겁니다. 재사용 대기시간은 _10턴_입니다.
actors.hero.talent.old_umbrella.title=낡은 양산
actors.hero.talent.old_umbrella.desc=_+1:_ 공격받을 때 _10%_ 확률로 그 피해를 공격자에게 모두 반사하고, 자신은 피해를 받지 않습니다.\n\n_+2:_ 공격받을 때 _12.5%_ 확률로 그 피해를 공격자에게 모두 반사하고, 자신은 피해를 받지 않습니다.\n\n_+3:_ 공격받을 때 _15%_ 확률로 그 피해를 공격자에게 모두 반사하고, 자신은 피해를 받지 않습니다.
actors.hero.hod.hodtrackers.reflect=반사
actors.hero.hod.hodtrackers$cocooncooldown.name=고치 재사용 대기
actors.hero.hod.hodtrackers$cocooncooldown.desc=고치를 다시 사용할 수 있을 때까지 기다려야 합니다.\n\n남은 턴: %s

# Ambitious imp vault mirror reward for Hod
actors.mobs.npcs.vaultmirror.scene_hod=당신에게 교육팀 강의실의 교탁 위에 펼쳐진 _교육 매뉴얼_이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 매뉴얼의 모든 장에는 정성스러운 메모가 빼곡하지만, 그 내용을 들어 줄 직원은 아무도 없습니다. 칠판에는 '오늘의 교육'이 지워지지 않은 채 남아 있고, 빈 의자들만이 줄지어 놓여 있습니다.
actors.mobs.npcs.vaultmirror.take_hod=교육을 받는다
actors.mobs.npcs.vaultmirror.scene_take_hod=당신은 매뉴얼을 펼쳐 마지막 장까지 읽어 내려갔습니다. 손에 쥔 것은 아무것도 없지만, 배운 것들이 머릿속에 또렷이 남았습니다.\n\n이 금고 안에 있는 동안 교육 매뉴얼 보급의 스택이 _%d_ 늘어납니다.

actors.hero.abilities.hod.managercall.name=관리직 호출
actors.hero.abilities.hod.managercall.no_space=관리직을 부를 빈 자리가 없습니다.
actors.hero.abilities.hod.managercall.rooted=움직일 수 없는 상태에서는 자리를 바꿀 수 없습니다.
actors.hero.abilities.hod.managercall.short_desc=호드는 _L사 관리직_을 호출해 함께 싸울 수 있습니다.
actors.hero.abilities.hod.managercall.desc=호드가 곁에 _L사 관리직_을 호출합니다. L사 관리직은 수많은 작업을 거치며 실력을 증명한 직원으로, 일반 사무직 직원보다 훨씬 튼튼하고 강력하며 몸을 지키는 장비까지 갖추고 있습니다. 적에게 RED 피해를 입힙니다.\n\n관리직이 살아 있을 때 다시 쓰면 기존 관리직이 사라지고 새 관리직이 호출됩니다. 호출에는 _1턴_이 걸립니다.
actors.hero.hod.lcorpmanager.name=L사 관리직
actors.hero.hod.lcorpmanager.desc=교육팀 세피라의 호출을 받고 달려온 L사 관리직이다. 일반 직원보다 훨씬 단단하고, 실전 경험도 풍부하다.\n\n적에게 _{c:CA2844}RED{/c} 피해_를 입힌다.
actors.hero.abilities.hod.bloodydesire.name=핏빛 욕망
actors.hero.abilities.hod.bloodydesire.prompt=공격할 대상을 선택하세요
actors.hero.abilities.hod.bloodydesire.no_target=공격할 적이 없습니다.
actors.hero.abilities.hod.bloodydesire.too_far=공격이 닿지 않는 대상입니다.
actors.hero.abilities.hod.bloodydesire.short_desc=호드는 _핏빛 욕망_으로 적을 베어, 준 피해를 출혈로 바꾸고 출혈이 줄어들지 않게 만들 수 있습니다.
actors.hero.abilities.hod.bloodydesire.desc=호드가 공격이 닿는 적을 공격하고, 준 피해의 _50%_만큼 _출혈_을 부여합니다. 그 뒤 대상에게 _1턴_ 동안 _깊은 상처_를 남깁니다. 깊은 상처가 있는 동안에는 출혈 수치가 줄어들지 않습니다.
actors.hero.abilities.hod.bloodydesire$deepwound.name=깊은 상처
actors.hero.abilities.hod.bloodydesire$deepwound.desc=상처가 깊게 벌어져 있습니다. 이 상처가 있는 동안에는 출혈 수치가 줄어들지 않습니다.\n\n남은 턴: %s.
actors.hero.abilities.hod.redeye.name=적안
actors.hero.abilities.hod.redeye.prompt=끌어올 대상을 선택하세요
actors.hero.abilities.hod.redeye.no_target=끌어올 적이 없습니다.
actors.hero.abilities.hod.redeye.too_far=대상이 너무 멀리 있습니다.
actors.hero.abilities.hod.redeye.blocked=대상에게 뛰어들 공간이 없습니다.
actors.hero.abilities.hod.redeye.short_desc=호드는 _적안_으로 멀리 있는 적을 눈앞으로 끌고 와 공격하고, 속박과 약화, 취약을 걸 수 있습니다.
actors.hero.abilities.hod.redeye.desc=호드가 _4칸_ 이내의 적을 자신의 앞으로 끌고 와 공격하고, _3턴_ 동안 _속박_, _약화_, _취약_을 겁니다. 대상을 끌고 올 수 없다면 호드가 대상에게 도약해 공격합니다.

actors.hero.talent.hiring_procedure.title=고용 절차 강화
actors.hero.talent.hiring_procedure.desc=_+1:_ L사 관리직의 체력, 피해, 방어력이 _25%_ 증가합니다.\n\n_+2:_ L사 관리직의 체력, 피해, 방어력이 _50%_ 증가합니다.\n\n_+3:_ L사 관리직의 체력, 피해, 방어력이 _75%_ 증가합니다.\n\n_+4:_ L사 관리직의 체력, 피해, 방어력이 _100%_ 증가합니다.
actors.hero.talent.field_guidance.title=현장 지도
actors.hero.talent.field_guidance.desc=_+1:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _5%_ 감소합니다.\n\n_+2:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _10%_ 감소합니다.\n\n_+3:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _15%_ 감소합니다.\n\n_+4:_ 호드와 L사 관리직이 서로 붙어 있으면 둘 다 받는 피해가 _20%_ 감소합니다.
actors.hero.talent.emergency_relocation.title=긴급 재배치
actors.hero.talent.emergency_relocation.desc=_+1:_ 긴급 재배치에 충전을 _20_ 소모합니다.\n\n_+2:_ 긴급 재배치에 충전을 _17_ 소모합니다.\n\n_+3:_ 긴급 재배치에 충전을 _14_ 소모합니다.\n\n_+4:_ 긴급 재배치에 충전을 _10_ 소모합니다.\n\n관리직이 살아 있을 때 강요된 무게에 _긴급 재배치_ 버튼이 생기며, 턴을 소모하지 않고 관리직과 자리를 바꿉니다.
actors.hero.talent.slash.title=난도질
actors.hero.talent.slash.desc=_+1:_ 깊은 상처가 _2턴_ 동안 지속됩니다.\n\n_+2:_ 깊은 상처가 _3턴_ 동안 지속됩니다.\n\n_+3:_ 깊은 상처가 _4턴_ 동안 지속됩니다.\n\n_+4:_ 깊은 상처가 _5턴_ 동안 지속됩니다.
actors.hero.talent.axe.title=도끼
actors.hero.talent.axe.desc=_+1:_ 핏빛 욕망이 준 피해의 _60%_만큼 출혈을 부여합니다.\n\n_+2:_ 핏빛 욕망이 준 피해의 _70%_만큼 출혈을 부여합니다.\n\n_+3:_ 핏빛 욕망이 준 피해의 _80%_만큼 출혈을 부여합니다.\n\n_+4:_ 핏빛 욕망이 준 피해의 _90%_만큼 출혈을 부여합니다.
actors.hero.talent.sparkle.title=반짝임
actors.hero.talent.sparkle.desc=_+1:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _25%_가 주변 8칸의 적에게 퍼집니다.\n\n_+2:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _50%_가 주변 8칸의 적에게 퍼집니다.\n\n_+3:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _75%_가 주변 8칸의 적에게 퍼집니다.\n\n_+4:_ 깊은 상처가 남은 적이 죽으면 남아 있던 출혈의 _100%_가 주변 8칸의 적에게 퍼집니다.
actors.hero.talent.long_gaze.title=긴 시선
actors.hero.talent.long_gaze.desc=_+1:_ 적안의 사거리가 _5칸_으로 늘어납니다.\n\n_+2:_ 적안의 사거리가 _6칸_으로 늘어납니다.\n\n_+3:_ 적안의 사거리가 _7칸_으로 늘어납니다.\n\n_+4:_ 적안의 사거리가 _8칸_으로 늘어납니다.
actors.hero.talent.vigilance.title=경계
actors.hero.talent.vigilance.desc=_+1:_ 적안의 속박, 약화, 취약이 _4턴_ 동안 지속됩니다.\n\n_+2:_ 적안의 속박, 약화, 취약이 _5턴_ 동안 지속됩니다.\n\n_+3:_ 적안의 속박, 약화, 취약이 _6턴_ 동안 지속됩니다.\n\n_+4:_ 적안의 속박, 약화, 취약이 _7턴_ 동안 지속됩니다.
actors.hero.talent.feast.title=식사
actors.hero.talent.feast.desc=_+1:_ 적안이 준 피해의 _7.5%_만큼 체력을 회복합니다.\n\n_+2:_ 적안이 준 피해의 _15%_만큼 체력을 회복합니다.\n\n_+3:_ 적안이 준 피해의 _22.5%_만큼 체력을 회복합니다.\n\n_+4:_ 적안이 준 피해의 _30%_만큼 체력을 회복합니다.
