###옌더의 부적 → 빛의 씨앗, 부적의 저주 → 클리포트 폭주 (효과는 그대로, 원본 문구를 덮어쓴다)
actors.buffs.ascensionchallenge.name=클리포트 폭주
actors.buffs.ascensionchallenge.desc=어느 이유에선지 요그제바는 빛의 씨앗을 통해 이 세상에 대한 영향력을 유지하고 있고, 당신의 탈출을 방해하려 합니다!\n\n요그제바의 힘이 던전을 더 위험하게 만들었으며, 적의 수를 증가시키고 더욱 강력하게 만들었습니다! 요그제바의 힘은 시간이 지날수록 강해지며, 요그제바의 힘에 영향을 받은 적을 처치하면 약화될 수 있습니다.
actors.buffs.ascensionchallenge.desc_clear=빛의 씨앗이 발하는 암흑 에너지를 어떻게든 최대한 억제했습니다.
actors.buffs.ascensionchallenge.desc_beckon=빛의 씨앗은 _멀리 떨어진 적들을 호출하며,_ 당신의 위치를 노출시킵니다.
actors.buffs.ascensionchallenge.desc_haste=빛의 씨앗은 _멀리 떨어진 적들을 빨리 이동하게 하며,_ 당신을 빨리 추적하게 만듭니다!
actors.buffs.ascensionchallenge.desc_slow=빛의 씨앗은 _당신을 느리게 만들어,_ 가속 효과도 무효화합니다!
actors.buffs.ascensionchallenge.desc_damage=빛의 씨앗이 발하는 에너지가 너무 강력하여 _당신에게 직접 피해를 입힙니다!_
actors.buffs.ascensionchallenge.beckon=빛의 씨앗이 멀리 떨어진 적들을 부른다.
actors.buffs.ascensionchallenge.haste=빛의 씨앗이 멀리 떨어진 적들을 신속화한다!
actors.buffs.ascensionchallenge.slow=갑자기 빛의 씨앗이 너무나 무겁게 느껴진다!
actors.buffs.ascensionchallenge.damage=빛의 씨앗이 암흑 에너지를 발한다. 너무나 고통스럽다!
actors.buffs.ascensionchallenge.weaken_info=클리포트 폭주는 더 많은 적을 쓰러뜨려 약화시킬 수 있습니다.
actors.buffs.ascensionchallenge.weaken_info_no_kills=적을 쓰러뜨리면 클리포트 폭주가 약해집니다!
actors.buffs.ascensionchallenge.weaken=당신은 클리포트 폭주가 약해짐을 느낀다.
actors.buffs.ascensionchallenge.almost=빛의 씨앗에 대한 요그제바의 집착이 약해짐을 느낀다. 거의 다 왔다!
actors.mobs.npcs.shopkeeper.talk_ascent=그 빛의 씨앗으로 뭘 할 건지는 모르겠지만 난 엮이고 싶지 않아. 빨리 튀어야 하니까 얼른 물건부터 사고 나가라고!
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=그 빛의 씨앗으로 뭘 할 속셈인지 너도 알고 있는 거지?
items.food.pasty.amulet_name=빛의 씨앗
items.food.pasty.amulet_desc=드디어 빛의 씨앗을 찾았 - 잠깐만요, 이건 그 빛의 씨앗처럼 생긴 은박지포장 초콜릿이었네요! 그 빛의 씨앗처럼 무한한 힘을 얻지는 못할 테지만, 적어도 배를 채우고 약간의 유물 충전은 해줄 겁니다.\n\n만우절!
items.amulet.name=빛의 씨앗
items.amulet.desc=영겁의 시간 속에서 찾아 헤매왔던 답을 모두에게 전해주자.
items.amulet.desc_origins=빛의 씨앗의 기원은 알 수가 없습니다. 역사서에 따르면 드워프의 왕국에서 모든 연락이 끊기기 직전 그들의 제왕이 빛의 씨앗을 찾아 온 세상에 자랑했던 것으로 알려져 있습니다. 제왕은 어떻게 이 빛의 씨앗을 찾았을까요? 요그제바는 어떻게 이 빛의 씨앗을 빼앗았을까요? 정답은 나중에 찾아도 괜찮습니다. 어쨌든 빛의 씨앗은 당신이 가지고 있으니까요!
items.amulet.desc_ascent=빛의 씨앗의 기원은 알 수가 없습니다만, 확실히 요그제바의 힘과 연관이 있어 보입니다. 던전이 요그제바의 의지에 따라 뒤틀리고 있으며, 적들이 더욱 많이 나타나며 강력해집니다! 또한 빛의 씨앗이 저주라도 걸린 것 처럼 버리거나 발동할 수 없습니다.
items.amulet.ascent_desc=당신은 요그제바의 끔찍하리만치 강력한 힘이 빛의 씨앗을 통해 표출됨을 느낍니다. 필멸자인 채로 던전을 역행하는 것은 쉽지만은 않을 겁니다!\n\n빛의 씨앗을 가진 채로 던전을 역행할수록 클리포트 폭주 또한 강력해집니다. 층을 뛰어넘는 효과는 차단되며, 게임에서 승리하려면 던전을 직접 역행하여 탈출해야만 합니다!\n\n지금 빛의 씨앗을 버려 역행 저주 효과를 방지하거나, 빛의 씨앗을 발동하여 게임을 바로 끝낼 수 있습니다.
journal.document.intros.dungeon.body=수많은 영웅들이 당신보다 먼저 도시 아래의 던전을 탐험하였지만, 대부분은 그 후로 영영 소식이 끊겨 버렸습니다.\n\n전해지는 바로는 어떤 사악한 고대의 존재가 빛의 씨앗을 지키고 있다고 합니다. 지금에 이르러서는 그 사악한 기운이 올라오기 시작해, 도시 가까운 곳까지 영향을 끼치고 있습니다.\n\n당신은 던전을 정복하고 빛의 씨앗을 쟁취할 수 있을까요? 이제 당신만의 모험기를 만들어갈 차례입니다!
journal.document.halls_king.amulet.title=빛의 씨앗
journal.document.halls_king.amulet.body=내가 해냈다!\n\n정확히 무엇을 찾았는지는 알 수 없었지만, 나의 예상을 한참 벗어난 물건이었다. 엄청난 힘이, 주인을 기다리고 있는 듯했다. 물론 그 주인은 이 몸이지!\n\n이것으로 궁정의 바보들 중 그 누구도 감히 나를 반대하지 않을 것이다. 그들을 모욕할 수 있는 수십 개의 방법을 생각하느라 정신이 하나도 없군. 젠장, 그 뿐이겠나? 난 내가 원한다면 그들 모두를 파괴해 버릴 수 있는 힘을 가지고 있다고! 물론 그건 좀 지나칠 수도 있지만, 그들이 의심하기 전에 빨리 결정하는 게 좋겠군.\n\n이 위대한 힘을 빛의 씨앗이라고 불러야겠어!\n- R.
journal.document.halls_king.thing.body=문제가 생겼다. 티모르는 힘들이지 않고 제압했지만, 내가 외부 차원에 벌인 짓이 새어나간 듯 했다.\n\n어떤... '무언가'... 가 내 세계의 이끌려서 전당 하층부 바닥을 억지로 통과하기 시작했다. 공교롭게도, 그 곳은 내가 빛의 씨앗을 보관한 장소가 아니던가! 이 독살스러운 생명체 같으니, 아직 빼앗아야 할 것이 산더미같은데 왜 벌써부터 나를 거역하려 드는 것이지?\n\n내 힘에도 불구하고, 저것을 정면 돌파할 수 있을 거라 생각하지는 않는다. 그것의 진정한 힘은 불가사의하지만, 그래도 그 힘을 억제할 방법이 있을 것이다. 나는 내 보물을 지키겠어!
journal.document.halls_king.attrition.body=나에게 그 무언가를 처리할 계획이 있다. 그 힘은 무한하지만, 이 세계에 영향을 끼칠 방법은 한정적이다. 놈은 빛의 씨앗을 직접 가져갈 힘을 기르기 전까지는 그저 하수인과 화신을 만들어 내보낼 수 밖에 없는 것 같다.\n\n내가 물리적으로 그 빛의 씨앗을 가지고 있는 것은 아니지만, 나는 여전히 그 힘을 완전히 통제할 수 있다. 드워프 도시 전체를 내 마음대로 쓸 수 있으니 내가 수적으로 우세할 것이다. 꾸준히 그 곳으로 병사들을 보내 소모전을 벌이면 빛의 씨앗을 빼앗아 가는 것도 막을 수 있겠지!\n\n나, 드워프의 제왕 로드니는 네놈 요그제바보다 더 오래 버틸 것이다!
badges$badge.victory.title=빛의 씨앗 발아
badges$badge.victory.desc=빛의 씨앗 획득
badges$badge.will_to_stand_tall.title=똑바로 설 수 있는 의지
badges$badge.will_to_stand_tall.desc=말쿠트로 빛의 씨앗 획득
badges$badge.reason_to_discern.title=분별할 수 있는 이성
badges$badge.reason_to_discern.desc=예소드로 빛의 씨앗 획득
badges$badge.welcome_to_lobotomy.title=로보토미 코퍼레이션에 오신 것을 환영합니다
badges$badge.welcome_to_lobotomy.desc=앤젤라와 처음 대화 완료
badges$badge.hope_to_be_better.title=더 나은 존재가 될 수 있다는 희망
badges$badge.hope_to_be_better.desc=호드로 빛의 씨앗 획득
badges$badge.courage_to_live_on.title=삶을 이어나갈 것이라는 용기
badges$badge.courage_to_live_on.desc=네짜흐로 빛의 씨앗 획득
badges$badge.expectation_of_meaning.title=존재의 의미에 대한 기대
badges$badge.expectation_of_meaning.desc=티페리트로 빛의 씨앗 획득
badges$badge.blue_star.title=푸른 별
badges$badge.blue_star.desc=푸른 별 제압
badges$badge.victory_all_classes.desc=모든 세피라로 빛의 씨앗 획득
badges$badge.boss_slain_1_all_classes.desc=모든 세피라로 1번째 보스 처치
badges$badge.boss_slain_3_all_subclasses.desc=모든 세피라의 세부 전직으로 3번째 보스 처치
badges$badge.happy_end.desc=빛의 씨앗을 들고 지상으로 탈출
badges$badge.pacifist_ascent.desc=역행 중 클리포트 폭주를 한 번도 약화하지 않고 지상으로 나오기
badges$badge.victory_random.desc=무작위로 생성된 영웅, 특성 업그레이드, 보조 직업, 갑옷 능력을 가지고 빛의 씨앗 획득
rankings$record.won=빛의 씨앗 획득
rankings$record.ascended=빛의 씨앗을 가지고 역행 성공!
scenes.amuletscene.text=마침내, 당신은 빛의 씨앗을 손에 넣었다! 이 빛의 씨앗의 힘이 있으면 그 어떠한 것도 당신의 앞을 막지 못할 것이다! 당신은 던전을 정복하고 임무를 완수했다!\n\n아직 준비가 되지 않았다면, 당신은 아주 잠시 동안만 필멸자로 남을 수도 있다. 옛 방식처럼 던전을 역행하는 것도 나쁘지 않은 선택일 것이다...

###탈바꿈의 주문서 → 기억 추출의 주문서 (특성 초기화)
items.scrolls.exotic.scrollofmetamorphosis.name=기억 추출의 주문서
items.scrolls.exotic.scrollofmetamorphosis.desc=이 주문서에는 읽는 이의 기억 일부를 뽑아내는 문자가 빼곡히 적혀 있습니다. 주문서를 읽으면 지금까지 익힌 _모든 특성이 초기화_되고, 사용했던 _특성 포인트를 전부 돌려받습니다._\n\n돌려받은 포인트는 원하는 특성에 다시 투자할 수 있습니다. 전직과 영웅 능력은 그대로 유지됩니다.
items.scrolls.exotic.scrollofmetamorphosis.confirm=주문서를 읽으면 모든 특성이 초기화되고 특성 포인트를 돌려받습니다. 정말 읽겠습니까?
items.scrolls.exotic.scrollofmetamorphosis.confirm_yes=읽는다
items.scrolls.exotic.scrollofmetamorphosis.confirm_no=그만둔다
items.scrolls.exotic.scrollofmetamorphosis.extracted=기억이 추출되었다. 특성 포인트 %d개를 돌려받았다.
items.scrolls.exotic.scrollofmetamorphosis.nothing=기억이 추출되었지만, 되돌려 받을 특성 포인트가 없었다.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=취소해도 기억 추출의 주문서는 소모됩니다. 확실합니까?

###티페리트
actors.hero.heroclass.tiphereth=티페리트
actors.hero.heroclass.tiphereth_desc_short=중앙본부의 세피라. _티페리트의 리본_을 무기에 묶어 근접 피해를 높이고, 강화 수치를 다른 무기로 옮깁니다.
actors.hero.heroclass.tiphereth_desc=티페리트는 제압봉에 묶인 _티페리트의 리본_을 가지고 시작합니다. 리본은 _근접 무기_에 묶을 수 있고, 리본이 묶인 무기는 근접 피해가 _1_ 증가합니다. 리본은 다른 무기로 옮겨 묶을 수 있으며, 리본이 묶인 무기를 강화하면 리본도 _1회_까지 강화되어 강화 수치 1을 함께 옮깁니다. 티페리트가 들르는 상점에는 항상 _거울상의 주문서_가 있습니다.\n\n티페리트는 또한 _제압봉_, _투척용 돌_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n티페리트는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 거울상의 주문서\n_-_ 부유의 물약
actors.hero.heroclass.tiphereth_unlock=티페리트는 자동으로 해금됩니다.
actors.hero.herosubclass.hq_sephirah=중앙본부 세피라
actors.hero.herosubclass.hq_sephirah_short_desc=_중앙본부 세피라_는 _티페리트 B_를 불러내 피해를 나눠 받으며 함께 싸웁니다.
actors.hero.herosubclass.hq_sephirah_desc=중앙본부 세피라는 전직하는 즉시 _프리즈마 거울상의 주문서_ 1장을 얻습니다. 중앙본부 세피라가 프리즈마 거울상의 주문서를 읽으면 프리즈마 거울상 대신 _티페리트 B_가 곁을 지킵니다. 티페리트 B가 이미 있다면 체력을 모두 회복시킵니다.\n\n티페리트 B는 티페리트 최대 체력의 _1.5배_만큼 체력을 가지며, 티페리트가 받는 _체력 피해_의 _50%_를 대신 받습니다. 보호막으로 막은 피해는 나눠 받지 않습니다. 프리즈마 거울상처럼 가까이 적이 있을 때만 모습을 드러내고, 적이 없으면 물러나 천천히 체력을 회복합니다. 티페리트와 _3칸_을 넘게 떨어지면 티페리트의 곁으로 돌아오고, 다른 층으로 함께 이동합니다.
actors.hero.herosubclass.science_librarian=자연과학의 층 지정사서
actors.hero.herosubclass.science_librarian_short_desc=_자연과학의 층 지정사서_는 티페리트의 리본을 무기 대신 직접 착용하고 맨손으로 싸웁니다.
actors.hero.herosubclass.science_librarian_desc=자연과학의 층 지정사서는 티페리트의 리본을 무기에 묶는 대신 _직접 무기로 착용_할 수 있습니다. 착용한 리본은 힘 요구치가 _10_이고, 리본의 강화 수치만큼 _완력의 반지_와 같은 효과를 냅니다. 완력의 반지와는 중첩되지 않으며 더 높은 쪽만 적용됩니다.\n\n리본을 착용한 공격은 _맨손 공격_으로 취급합니다.\n\n티페펀치!
actors.hero.talent.pride.title=자존심
actors.hero.talent.pride.desc=_+1:_ 시야 안에 적이 _둘 이상_ 있으면 근접 피해가 _1_ 증가합니다.\n\n_+2:_ 시야 안에 적이 _둘 이상_ 있으면 근접 피해가 _2_ 증가합니다.
actors.hero.talent.precise_inspection.title=정밀 검수
actors.hero.talent.precise_inspection.desc=_+1:_ 무기와 방어구를 _2.5배_ 빠르게 감정합니다.\n\n_+2:_ 방어구를 _2.5배_ 빠르게 감정하고, 무기는 _장착하는 즉시_ 감정합니다.
actors.hero.talent.preemptive_defense.title=선제 방어
actors.hero.talent.preemptive_defense.desc=_+1:_ 각 _종류_의 적에게 처음 공격받을 때 보호막 _3_을 얻습니다.\n\n_+2:_ 각 _종류_의 적에게 처음 공격받을 때 보호막 _5_를 얻습니다.\n\n같은 종류의 적에게는 이번 게임에서 한 번만 발동합니다.
actors.hero.talent.sneaky.title=살금살금
actors.hero.talent.sneaky.desc=_+1:_ 티페리트의 _은신 레벨_이 _1_ 오릅니다. 적이 티페리트를 알아차리기 어려워집니다.\n\n_+2:_ 티페리트의 _은신 레벨_이 _2_ 오릅니다. 적이 티페리트를 알아차리기 어려워집니다.
actors.hero.talent.shared_meal.title=함께 하는 식사
actors.hero.talent.shared_meal.desc=_+1:_ 식사에 _1턴_만 소모되며, 식사할 때 _거울상_을 _하나_ 소환합니다.\n\n_+2:_ 식사에 _1턴_만 소모되며, 식사할 때 _거울상_을 _둘_ 소환합니다.
actors.hero.talent.expectation.title=기대
actors.hero.talent.expectation.desc=_+1:_ _5번째_ 공격마다 _최대 피해_를 입힙니다.\n\n_+2:_ _4번째_ 공격마다 _최대 피해_를 입힙니다.
actors.hero.talent.maintenance.title=유지
actors.hero.talent.maintenance.desc=_+1:_ 티페리트의 리본을 옮길 때 무기의 _마법 부여_도 함께 옮깁니다.\n\n_+2:_ 리본이 마법 부여를 함께 옮기며, 리본이 묶인 무기의 마법 부여는 _강화해도 사라지지 않습니다._
actors.hero.talent.physical_shield.title=물리 간섭 보호장
actors.hero.talent.physical_shield.desc=_+1:_ 티페리트와 티페리트 B의 방어력이 _0~2_ 증가합니다.\n\n_+2:_ 티페리트와 티페리트 B의 방어력이 _0~4_ 증가합니다.
actors.hero.talent.trauma_shield.title=트라우마 방지장
actors.hero.talent.trauma_shield.desc=_+1:_ 티페리트와 티페리트 B가 받는 _마법 피해_가 방어력의 _15%_만큼 줄어듭니다.\n\n_+2:_ 티페리트와 티페리트 B가 받는 _마법 피해_가 방어력의 _25%_만큼 줄어듭니다.
items.tipherethribbon.name=티페리트의 리본
items.tipherethribbon.ac_affix=리본을 묶는다
items.tipherethribbon.prompt=리본을 묶을 근접 무기를 선택하세요
items.tipherethribbon.unknown_weapon=먼저 무기가 저주받았는지 확인해야 합니다.
items.tipherethribbon.cursed_weapon=리본은 저주받은 무기에 묶을 수 없다.
items.tipherethribbon.affix=%s에 리본을 묶었다!
items.tipherethribbon.desc=티페리트가 늘 머리에 묶고 다니는 짙은 갈색 리본. 정성껏 손질되어 구김 하나 없다.\n\n이 리본은 _근접 무기에 묶을 수 있고, 다른 무기로 옮겨 묶을 수 있습니다._ 리본이 묶인 무기는 근접 피해가 _1_ 증가합니다. 리본이 묶인 채로 무기를 강화하면 리본도 1회까지 강화되며, 강화된 리본이 묶인 무기는 1만큼의 추가 강화 수치를 얻습니다.
items.tipherethribbon.enchanted=리본에 _%s_ 마법이 깃들어 있습니다.
items.tipherethribbon.choose_title=마법 부여를 선택하세요
items.tipherethribbon.choose_desc=무기와 리본에 모두 마법이 부여되어 있습니다. 남길 마법을 선택하세요.\n\n무기의 마법: %1$s\n리본의 마법: %2$s
items.tipherethribbon.discover_hint=특정 영웅이 이 아이템을 가지고 시작합니다.
items.weapon.melee.meleeweapon.ac_detach_ribbon=리본을 푼다
items.weapon.melee.meleeweapon.detach_ribbon=무기에서 리본을 풀었다.
items.weapon.melee.meleeweapon.ribbon_attached=티페리트의 리본이 묶여 있어 근접 피해가 _%d_ 증가합니다.
items.weapon.melee.meleeweapon.ribbon_transfer=티페리트의 리본은 지금 들고 있는 무기에 묶여 있어야 효과를 냅니다. 새 무기로 리본을 옮겨 묶겠습니까?
items.weapon.melee.meleeweapon.ribbon_transfer_yes=옮겨 묶는다
items.weapon.melee.meleeweapon.ribbon_transfer_no=그대로 둔다
actors.mobs.npcs.vaultmirror.scene_tiphereth=당신에게 중앙본부 사무실의 책상 위에 나란히 놓인 _리본_ 두 개가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 하나는 늘 묶던 짙은 갈색 리본과 똑같지만, 다른 하나는 낯선 빛을 은은하게 머금고 있습니다. 나란히 놓인 의자 두 개 중 하나는 비어 있고, 사무실에는 아무 소리도 들리지 않습니다.

actors.hero.talent.not_a_kid.title=꼬맹이 아니라고!
actors.hero.talent.not_a_kid.desc=_+1:_ 회피가 _10%_ 증가합니다.\n\n_+2:_ 회피가 _15%_ 증가합니다.\n\n_+3:_ 회피가 _20%_ 증가합니다.
actors.hero.talent.proof_of_competence.title=역량의 증명
actors.hero.talent.proof_of_competence.desc=_+1:_ 티페리트의 리본의 강화 수치와 힘 요구치가 _1_ 증가합니다.\n\n_+2:_ 티페리트의 리본의 강화 수치와 힘 요구치가 _2_ 증가합니다.\n\n_+3:_ 티페리트의 리본의 강화 수치와 힘 요구치가 _3_ 증가합니다.\n\n리본이 묶인 무기에도 같은 만큼 적용됩니다.
actors.hero.talent.erosion_shield.title=침식 중화장
actors.hero.talent.erosion_shield.desc=_+1:_ 티페리트와 티페리트 B가 받는 디버프의 지속시간이 _20%_ 줄어듭니다.\n\n_+2:_ 티페리트와 티페리트 B가 받는 디버프의 지속시간이 _30%_ 줄어듭니다.\n\n_+3:_ 티페리트와 티페리트 B가 받는 디버프의 지속시간이 _40%_ 줄어듭니다.
actors.hero.talent.precious_one.title=소중한 존재
actors.hero.talent.precious_one.desc=_+1:_ 티페리트 B의 체력이 _40%_ 증가합니다.\n\n_+2:_ 티페리트 B의 체력이 _70%_ 증가합니다.\n\n_+3:_ 티페리트 B의 체력이 _100%_ 증가합니다.
actors.hero.talent.value_disposal.title=가치처분
actors.hero.talent.value_disposal.desc=_+1:_ 티페리트 B가 대신 받는 피해의 비율이 _60%_로 늘어납니다.\n\n_+2:_ 티페리트 B가 대신 받는 피해의 비율이 _70%_로 늘어납니다.\n\n_+3:_ 티페리트 B가 대신 받는 피해의 비율이 _80%_로 늘어납니다.
actors.hero.talent.ward.title=가호
actors.hero.talent.ward.desc=_+1:_ 다음에 받는 피해가 _50%_ 감소하는 _가호_를 얻습니다. 가호는 피해를 받은 뒤 _10턴_이 지나면 다시 채워집니다.\n\n_+2:_ 가호가 _7턴_마다 다시 채워집니다.\n\n_+3:_ 가호가 _5턴_마다 다시 채워집니다.
actors.hero.talent.intemperance.title=무절제
actors.hero.talent.intemperance.desc=_+1:_ 맨손 공격이 _15%_ 확률로 적을 _1턴_ 동안 마비시킵니다.\n\n_+2:_ 맨손 공격이 _20%_ 확률로 적을 _1턴_ 동안 마비시킵니다.\n\n_+3:_ 맨손 공격이 _25%_ 확률로 적을 _1턴_ 동안 마비시킵니다.
actors.hero.talent.emptiness.title=공허
actors.hero.talent.emptiness.desc=_+1:_ 비어 있는 유물·반지 슬롯 하나당 주는 피해가 _10%_ 증가하고 받는 피해가 _5%_ 감소합니다.\n\n_+2:_ 비어 있는 유물·반지 슬롯 하나당 주는 피해가 _17.5%_ 증가하고 받는 피해가 _10%_ 감소합니다.\n\n_+3:_ 비어 있는 유물·반지 슬롯 하나당 주는 피해가 _25%_ 증가하고 받는 피해가 _15%_ 감소합니다.
actors.hero.tiphereth.tipherethtrackers$ward.name=가호
actors.hero.tiphereth.tipherethtrackers$ward.desc_ready=다음에 받는 피해가 _50%_ 감소합니다.
actors.hero.tiphereth.tipherethtrackers$ward.desc_cooldown=가호가 다시 채워지기까지 _%d턴_ 남았습니다.
actors.hero.tiphereth.tipherethb.name=티페리트 B
actors.hero.tiphereth.tipherethb.desc=티페리트와 꼭 닮은 소년. 짧게 자른 금발에 짙은 갈색 머리띠를 했다. 언제나 티페리트의 곁에 머물며, 그녀가 받는 상처를 대신 짊어진다.
actors.hero.tiphereth.tipherethb.called=티페리트 B가 곁을 지킨다.
actors.hero.tiphereth.tipherethguard.name=티페리트 B
actors.hero.tiphereth.tipherethguard.desc=티페리트 B가 곁에서 지켜보고 있습니다. 가까이 적이 다가오면 모습을 드러냅니다.\n\n체력: %1$d/%2$d
actors.hero.tiphereth.tipherethb.no_space=티페리트 B가 나타날 자리가 없다.
items.tipherethribbon.worn_stats=_착용 시:_ _%1$d-%2$d_의 _RED 피해_를 주며 힘이 _%3$d_ 이상이어야 제대로 다룰 수 있습니다. 완력의 반지 _+%4$d_와 같은 효과를 냅니다.
items.tipherethribbon.ac_equip=착용한다
items.tipherethribbon.ac_unequip=벗는다

actors.hero.abilities.tiphereth.shieldbarrage.name=보호장 난사
actors.hero.abilities.tiphereth.shieldbarrage.short_desc=티페리트는 _보호장 난사_로 몇 턴 동안 매 턴 다시 채워지는 보호막을 얻습니다.
actors.hero.abilities.tiphereth.shieldbarrage.desc=티페리트가 _5턴_ 동안 보호장을 펼칩니다. 그동안 매 턴 시작마다 보호막이 최대 체력의 _20%_까지 다시 채워집니다.
actors.hero.abilities.tiphereth.shieldbarrage$barrage.name=보호장 난사
actors.hero.abilities.tiphereth.shieldbarrage$barrage.desc=매 턴 보호막이 _%1$d_까지 다시 채워집니다.\n\n남은 턴: %2$d
actors.hero.abilities.tiphereth.goldrushdash.name=골드러시
actors.hero.abilities.tiphereth.goldrushdash.prompt=황금의 길을 열 적을 선택하세요
actors.hero.abilities.tiphereth.goldrushdash.no_target=그곳에는 대상이 없습니다.
actors.hero.abilities.tiphereth.goldrushdash.too_far=대상이 너무 멀리 있습니다.
actors.hero.abilities.tiphereth.goldrushdash.no_space=대상의 곁에 설 자리가 없습니다.
actors.hero.abilities.tiphereth.goldrushdash.short_desc=티페리트는 _골드러시_로 적의 곁으로 순간이동해 일격을 가하고 _황금의 길_을 얻습니다.
actors.hero.abilities.tiphereth.goldrushdash.desc=티페리트가 황금의 길을 열어 _4칸_ 안의 적 곁으로 순간이동해 _5-15_의 _RED 피해_를 줍니다. 그 뒤 _황금의 길_을 _5스택_ 얻어 _2턴_ 동안 유지합니다.
actors.hero.abilities.tiphereth.nihil.name=허무
actors.hero.abilities.tiphereth.nihil.short_desc=티페리트는 _허무_로 주변을 어둠으로 덮어 적들에게 피해를 주고, 가벼운 무기를 들었다면 적들을 무력하게 만듭니다.
actors.hero.abilities.tiphereth.nihil.desc=티페리트 주변 _7x7_ 범위가 잠시 암전되며, 범위 안의 모든 적에게 _6-16_의 피해를 줍니다.\n\n장착한 무기의 최종 힘 요구치가 _10 이하_라면 적들에게 _약화_, _취약_, _속박_, _마비_를 _4턴_ 동안 추가로 겁니다.
actors.hero.talent.lasting_shield.title=지속 보호
actors.hero.talent.lasting_shield.desc=_+1:_ 보호장 난사의 지속시간이 _1턴_ 늘어납니다.\n\n_+2:_ 보호장 난사의 지속시간이 _2턴_ 늘어납니다.\n\n_+3:_ 보호장 난사의 지속시간이 _3턴_ 늘어납니다.\n\n_+4:_ 보호장 난사의 지속시간이 _4턴_ 늘어납니다.
actors.hero.talent.shield_output.title=보호장 출력
actors.hero.talent.shield_output.desc=_+1:_ 보호장 난사가 채우는 보호막이 _12.5%_ 늘어납니다.\n\n_+2:_ 보호장 난사가 채우는 보호막이 _25%_ 늘어납니다.\n\n_+3:_ 보호장 난사가 채우는 보호막이 _37.5%_ 늘어납니다.\n\n_+4:_ 보호장 난사가 채우는 보호막이 _50%_ 늘어납니다.
actors.hero.talent.shield_spread.title=보호장 확산
actors.hero.talent.shield_spread.desc=_+1:_ 보호장 난사를 쓰면 시야 안의 아군(티페리트 B 포함)도 같은 시간 동안 티페리트 보호막의 _25%_를 매 턴 채워 받습니다.\n\n_+2:_ 아군이 받는 보호막이 _50%_가 됩니다.\n\n_+3:_ 아군이 받는 보호막이 _75%_가 됩니다.\n\n_+4:_ 아군이 받는 보호막이 _100%_가 됩니다.
actors.hero.talent.golden_dash.title=황금 질주
actors.hero.talent.golden_dash.desc=_+1:_ 골드러시의 사거리가 _1칸_ 늘어납니다.\n\n_+2:_ 골드러시의 사거리가 _2칸_ 늘어납니다.\n\n_+3:_ 골드러시의 사거리가 _3칸_ 늘어납니다.\n\n_+4:_ 골드러시의 사거리가 _4칸_ 늘어납니다.
actors.hero.talent.golden_strike.title=황금 연쇄
actors.hero.talent.golden_strike.desc=_+1:_ 골드러시를 사용한 뒤 _3턴_ 안에 다시 사용하면 충전량을 _20%_ 적게 사용합니다.\n\n_+2:_ 충전량을 _30%_ 적게 사용합니다.\n\n_+3:_ 충전량을 _40%_ 적게 사용합니다.\n\n_+4:_ 충전량을 _50%_ 적게 사용합니다.
actors.hero.talent.endless_road.title=멈추지 않는 길
actors.hero.talent.endless_road.desc=_+1:_ 골드러시로 얻은 황금의 길이 _1턴_ 더 유지됩니다.\n\n_+2:_ 황금의 길이 _2턴_ 더 유지됩니다.\n\n_+3:_ 황금의 길이 _3턴_ 더 유지됩니다.\n\n_+4:_ 황금의 길이 _4턴_ 더 유지됩니다.
actors.hero.talent.deep_void.title=깊은 공허
actors.hero.talent.deep_void.desc=_+1:_ 허무를 사용하면 _25%_ 확률로 _4턴_ 뒤 허무가 한 번 더 발동합니다.\n\n_+2:_ 확률이 _50%_로 늘어납니다.\n\n_+3:_ 확률이 _75%_로 늘어납니다.\n\n_+4:_ _4턴_ 뒤 허무가 반드시 한 번 더 발동합니다.
actors.hero.talent.deception.title=기만
actors.hero.talent.deception.desc=_+1:_ 허무의 피해가 _50%_ 증가합니다.\n\n_+2:_ 허무의 피해가 _100%_ 증가합니다.\n\n_+3:_ 허무의 피해가 _150%_ 증가합니다.\n\n_+4:_ 허무의 피해가 _200%_ 증가합니다.
actors.hero.talent.void_echo.title=허무의 잔향
actors.hero.talent.void_echo.desc=_+1:_ 허무가 거는 디버프의 지속시간이 _1턴_ 늘어납니다.\n\n_+2:_ 허무가 거는 디버프의 지속시간이 _2턴_ 늘어납니다.\n\n_+3:_ 허무가 거는 디버프의 지속시간이 _3턴_ 늘어납니다.\n\n_+4:_ 허무가 거는 디버프의 지속시간이 _4턴_ 늘어납니다.

###게임 이름: Sefirot Pixel Dungeon
scenes.welcomescene.update_intro=Sefirot Pixel Dungeon이 업데이트되었습니다!
scenes.welcomescene.patch_intro=Sefirot Pixel Dungeon이 패치되었습니다!
scenes.welcomescene.what_msg=현재 저장된 게임은 Sefirot Pixel Dungeon의 나중 버전에서 나온 것입니다!\n\n현재 버전에 등장하지 않는 요소들이 충돌을 일으킬 수 있으니, 조심하십시오!
scenes.welcomescene.save_warning=최근에 게임 데이터를 저장하는 동안 게임이 중단되었습니다. Sefirot Pixel Dungeon에는 이에 대한 보호 기능이 내장되어 있기 때문에 게임 데이터는 안전합니다.\n\n일반적으로 이 문제는 디바이스의 전원이 갑자기 끊기거나 게임이 정상적으로 종료되지 않았을 때 발생합니다. 대부분의 경우 모바일 디바이스에서 배터리 절약 기능으로 인해 이 문제가 발생할 수 있습니다. 이 오류가 반복될 경우 디바이스를 재시작해 보십시오.
windows.wndvictorycongrats.thank_you=Sefirot Pixel Dungeon을 플레이해 주셔서 대단히 감사합니다!

# Ambitious imp vault mirror reward for Malkuth
actors.mobs.npcs.vaultmirror.scene_malkuth=당신에게 지휘팀 메인 룸의 책상 위에 펼쳐진 _말쿠트의 수첩_이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 수첩에는 업무 지시가 빼곡히 적혀 있어야 하지만, 이 수첩의 일정은 아직 오지 않은 날들까지 모두 완료 표시가 되어 있습니다. 책상 주변은 고요하고, 당신을 기다리는 직원은 아무도 없습니다.

###예소드
actors.hero.heroclass.yesod=예소드
actors.hero.heroclass.yesod_desc_short=정보팀의 세피라. 감정과 탐색으로 _정보력_을 모으고, _예소드의 목도리_로 정보력을 소모해 전투를 유리하게 이끕니다.
actors.hero.heroclass.yesod_desc=예소드는 _정보력_을 소모해 능력을 쓰는 _예소드의 목도리_를 가지고 시작합니다. 아이템을 _감정_하면 _3_, 탐색으로 _함정_을 찾으면 _1_, _비밀 문_을 찾으면 _3_, 이번 판에서 처음 보는 종류의 적을 처치하면 _1_의 정보력을 얻습니다(최대 _20_).\n\n예소드는 또한 _제압봉_, _투척용 돌_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n예소드는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 마법 지도의 주문서\n_-_ 심안의 물약
actors.hero.heroclass.yesod_unlock=예소드는 자동으로 해금됩니다.

actors.hero.herosubclass.info_sephirah=정보팀 세피라
actors.hero.herosubclass.info_sephirah_short_desc=_정보팀 세피라_는 정보력으로 몸을 숨기는 _검열_과, 상점에서 정보력으로 물건을 사는 _정보 교환_을 쓸 수 있습니다.
actors.hero.herosubclass.info_sephirah_desc=정보팀 세피라는 예소드의 목도리로 두 가지 능력을 더 쓸 수 있습니다.\n\n_검열:_ 정보력 _5_를 소모해 _5턴_ 동안 투명해지고, 주변 _5×5_ 범위에 _5턴_ 동안 연막을 깝니다.\n\n_정보 교환:_ 상점에서 정보력 1당 _75골드_의 가치로 아이템을 살 수 있습니다.
actors.hero.herosubclass.tech_librarian=기술과학의 층 지정사서
actors.hero.herosubclass.tech_librarian_short_desc=_기술과학의 층 지정사서_는 정보력을 모두 쏟아부어 _충전_을 얻고, 주는 피해를 크게 늘립니다.
actors.hero.herosubclass.tech_librarian_desc=기술과학의 층 지정사서는 예소드의 목도리로 _충전_을 쓸 수 있습니다. 충전은 턴을 소모하지 않으며, 보유한 정보력을 모두 소비해 같은 수치의 _충전_을 얻습니다.\n\n충전 1당 주는 피해가 _5%_ 증가하며, 충전은 매 턴 1씩 줄어듭니다. 충전이 남아 있을 때 다시 쓰면 수치가 더해집니다.

actors.hero.talent.damage_normalization.title=피해 정규화
actors.hero.talent.damage_normalization.desc=_+1:_ 무기 공격의 최소 피해가 _1_ 증가합니다.\n\n_+2:_ 무기 공격의 최소 피해가 _2_ 증가합니다.
actors.hero.talent.document_review.title=문서 검토
actors.hero.talent.document_review.desc=_+1:_ 예소드의 목도리로 _감정_할 때 드는 정보력이 _3_ 줄어듭니다.\n\n_+2:_ 예소드의 목도리로 _감정_할 때 드는 정보력이 _5_ 줄어듭니다.
actors.hero.talent.security_procedure.title=보안 절차
actors.hero.talent.security_procedure.desc=_+1:_ 함정이나 비밀 문을 밝혀내면 _3_의 보호막을 얻습니다.\n\n_+2:_ 함정이나 비밀 문을 밝혀내면 _5_의 보호막을 얻습니다.\n\n보호막은 중첩되지 않습니다.
actors.hero.talent.info_network.title=정보 수집망
actors.hero.talent.info_network.desc=_+1:_ 탐색 범위가 3x3 사각형에서 _5x5 사각형_으로 증가합니다.\n\n_+2:_ 탐색 범위가 3x3 사각형에서 _7x7 사각형_으로 증가합니다.
actors.hero.talent.risk_report.title=위험 보고서
actors.hero.talent.risk_report.desc=_+1:_ 식사에 _1턴_만 소모되며, 식사 시 정보력을 _1_ 얻습니다.\n\n_+2:_ 식사에 _1턴_만 소모되며, 식사 시 정보력을 _2_ 얻습니다.
actors.hero.talent.go_visualization.title=G.O 시각화
actors.hero.talent.go_visualization.desc=_+1:_ 분석된 적이 주는 피해가 _20%_ 감소합니다.\n\n_+2:_ 분석된 적이 주는 피해가 _20%_ 감소하고, 받는 피해가 _20%_ 증가합니다.
actors.hero.talent.database.title=데이터베이스
actors.hero.talent.database.desc=_+1:_ 주문서를 읽으면 정보력을 _1_ 얻습니다.\n\n_+2:_ 주문서를 읽으면 정보력을 _2_ 얻습니다.
actors.hero.talent.field_surveillance.title=현장 감시
actors.hero.talent.field_surveillance.desc=_+1:_ _2칸_ 이내의 적을 벽 너머로도 감지합니다.\n\n_+2:_ _3칸_ 이내의 적을 벽 너머로도 감지합니다.
actors.hero.talent.emergency_response.title=비상 대응
actors.hero.talent.emergency_response.desc=_+1:_ 체력이 _25%_ 아래로 떨어지면 정보력을 최대 _5_까지 소모해, 소모한 정보력 1당 최대 체력의 _10%_를 회복합니다. 한 층에 _1번_만 발동합니다.\n\n_+2:_ 체력이 _25%_ 아래로 떨어지면 정보력을 최대 _5_까지 소모해, 소모한 정보력 1당 최대 체력의 _15%_를 회복합니다. 한 층에 _1번_만 발동합니다.

actors.hero.yesod.infopower.name=정보력
actors.hero.yesod.infopower.desc=예소드가 모은 정보입니다. 예소드의 목도리의 능력을 쓰는 데 소모됩니다.\n\n아이템 감정: _+3_\n탐색으로 함정 발견: _+1_\n탐색으로 비밀 문 발견: _+3_\n처음 보는 종류의 적 처치: _+1_\n\n현재 정보력: %1$d/%2$d
actors.hero.yesod.infopower.gain=정보력 +%d
actors.hero.yesod.analyzed.name=분석됨
actors.hero.yesod.analyzed.desc=예소드가 이 대상을 분석했습니다. 명중과 회피가 _20%%_ 감소하며, 시야를 벗어나도 위치가 드러납니다.\n\n남은 턴: %s.
actors.hero.yesod.prediction$evade.name=예측: 회피
actors.hero.yesod.prediction$evade.desc=상대의 다음 수를 예측했습니다. 다음에 받는 공격 1회를 반드시 회피합니다.
actors.hero.yesod.prediction$strike.name=예측: 필중
actors.hero.yesod.prediction$strike.desc=상대의 움직임을 예측했습니다. 다음 공격 1회는 반드시 명중합니다.

items.yesodscarf.name=예소드의 목도리
items.yesodscarf.desc=정보팀 세피라 예소드가 입가까지 올려 두르는 검은 목도리다. 흐트러짐 없이 정돈된 모습은 그가 다루는 정보만큼이나 빈틈이 없다.
items.yesodscarf.effect=_분석 (정보력 %1$d):_ 시야 안의 대상 하나에 _%2$d턴_ 동안 분석됨을 겁니다. 분석된 대상은 명중과 회피가 _20%%_ 감소하고, 시야를 벗어나도 위치가 드러납니다.\n\n_탐지 (정보력 %3$d):_ 주변 _%4$d칸_의 지형을 밝히고 함정과 비밀을 드러냅니다. 이렇게 찾은 비밀로는 정보력을 얻지 않습니다.\n\n_예측 (정보력 %5$d):_ 다음에 받는 공격 1회를 반드시 회피하고, 다음 공격 1회는 반드시 명중합니다.
items.yesodscarf.turn_note=각 능력은 _1턴_을 소모합니다.
items.yesodscarf.turn_note_tech=충전을 제외한 각 능력은 _1턴_을 소모합니다.
items.yesodscarf.choose_msg=사용할 능력을 선택하세요.\n\n현재 정보력: _%1$d/%2$d_
items.yesodscarf.ac_analyze=분석 (%d)
items.yesodscarf.ac_detect=탐지 (%d)
items.yesodscarf.ac_predict=예측 (%d)
items.yesodscarf.ac_appraise=감정 (%d)
items.yesodscarf.appraise_nothing=감정할 아이템이 없습니다.
items.yesodscarf.effect_appraise=_감정 (정보력 %d):_ 미감정 아이템 하나를 골라 감정합니다.
actors.hero.talent.efficient_potions=물약 %d종류의 정체를 알아냈다.
items.yesodscarf.ac_review=문서 검토 (%d)
items.yesodscarf.no_info=정보력이 부족합니다. (필요: %d)
items.yesodscarf.no_target=분석할 대상이 없습니다.
items.yesodscarf.analyze_prompt=분석할 대상을 선택하세요
items.yesodscarf.review_prompt=감정할 아이템을 선택하세요
items.yesodscarf.review_nothing=감정할 아이템이 없습니다. 예소드의 목도리의 문서 검토 메뉴로 나중에 감정할 수 있습니다.
items.yesodscarf.review_done=문서를 검토해 %s의 정체를 알아냈습니다.
items.yesodscarf.ac_censor=검열 (%d)
items.yesodscarf.ac_charge=충전
items.yesodscarf.no_charge=충전에 쓸 정보력이 없습니다.
items.yesodscarf.charged=정보력 %d를 모두 쏟아부어 충전했습니다!
items.yesodscarf.buy_info=정보로 구매 (정보력 %d)
items.yesodscarf.effect_info=_검열 (정보력 %1$d):_ _%2$d턴_ 동안 투명해지고, 주변 _5×5_ 범위에 연막을 깝니다.\n\n_정보 교환:_ 상점에서 정보력 1당 _%3$d골드_의 가치로 아이템을 살 수 있습니다.
items.yesodscarf.effect_tech=_충전 (턴 소모 없음):_ 보유한 정보력을 모두 소비해 같은 수치의 충전을 얻습니다. 충전 1당 주는 피해가 _%d%%_ 증가하며, 매 턴 1씩 줄어듭니다.

actors.hero.yesod.charge.name=충전
actors.hero.yesod.charge.desc=정보력을 쏟아부어 출력을 끌어올렸습니다. 충전 1당 주는 피해가 5%% 증가하며, 충전은 매 턴 1씩 줄어듭니다.\n\n현재 충전: %1$d (피해 +%2$d%%)
actors.hero.yesod.commission.name=의뢰 대상
actors.hero.yesod.commission.desc=이 대상은 이번 층의 의뢰 대상입니다. 처치하면 정보력과 함께 보상 아이템을 얻습니다.
actors.hero.yesod.commission.assigned=이번 층의 의뢰 대상: %s
actors.hero.yesod.commission.complete=의뢰를 완수했습니다!

actors.hero.talent.surveillance_camera.title=감시 카메라
actors.hero.talent.surveillance_camera.desc=_+1:_ 새 층에 처음 도착하면 도착한 계단 주변 _8칸_의 지형과 숨겨진 함정, 비밀 문이 밝혀집니다.\n\n_+2:_ 새 층에 처음 도착하면 도착한 계단 주변 _10칸_의 지형과 숨겨진 함정, 비밀 문이 밝혀집니다.\n\n_+3:_ 새 층에 처음 도착하면 도착한 계단 주변 _12칸_의 지형과 숨겨진 함정, 비밀 문이 밝혀집니다.\n\n이렇게 찾은 비밀로도 정보력을 얻습니다.
actors.hero.talent.document_organize.title=문서 정리
actors.hero.talent.document_organize.desc=_+1:_ 정보력의 최대치가 _5_ 증가합니다.\n\n_+2:_ 정보력의 최대치가 _10_ 증가합니다.\n\n_+3:_ 정보력의 최대치가 _15_ 증가합니다.
actors.hero.talent.yesod_farsight.title=천리안
actors.hero.talent.yesod_farsight.desc=_+1:_ 시야 범위가 _25%_ 증가합니다.\n\n_+2:_ 시야 범위가 _50%_ 증가합니다.\n\n_+3:_ 시야 범위가 _75%_ 증가합니다.
actors.hero.talent.info_spread.title=정보 전파
actors.hero.talent.info_spread.desc=_+1:_ 분석을 쓰면 시야 안에서 대상과 가장 가까운 적 _1명_도 분석됩니다.\n\n_+2:_ 분석을 쓰면 시야 안에서 대상과 가장 가까운 적 _2명_도 분석됩니다.\n\n_+3:_ 분석을 쓰면 시야 안에서 대상과 가장 가까운 적 _3명_도 분석됩니다.
actors.hero.talent.viper_yesod.title=독사 예소드
actors.hero.talent.viper_yesod.desc=_+1:_ 보유한 정보력 1당 주는 피해가 _1%_ 증가합니다.\n\n_+2:_ 보유한 정보력 1당 주는 피해가 _1.5%_ 증가합니다.\n\n_+3:_ 보유한 정보력 1당 주는 피해가 _2%_ 증가합니다.
actors.hero.talent.violence.title=폭력성
actors.hero.talent.violence.desc=_+1:_ 무기 공격의 최소 피해가 _1_로 고정되고, 줄어든 수치의 _2배_만큼 최대 피해가 증가합니다.\n\n_+2:_ 무기 공격의 최소 피해가 _1_로 고정되고, 줄어든 수치의 _3배_만큼 최대 피해가 증가합니다.\n\n_+3:_ 무기 공격의 최소 피해가 _1_로 고정되고, 줄어든 수치의 _4배_만큼 최대 피해가 증가합니다.
actors.hero.talent.commission.title=의뢰
actors.hero.talent.commission.desc=새 층에 처음 도착하면 무작위 적 하나가 _의뢰 대상_이 됩니다(보스 제외). 의뢰 대상을 처치하면 아이템을 반드시 떨어뜨립니다.\n\n_+1:_ 정보력을 _1_ 얻고, _일반_ 등급 아이템이 나옵니다. 장비가 나오면 _+0_ 이상입니다.\n\n_+2:_ 정보력을 _2_ 얻고, _고급_ 등급 아이템이 나옵니다. 장비가 나오면 _+1_ 이상입니다.\n\n_+3:_ 정보력을 _3_ 얻고, _희귀_ 등급 아이템이 나옵니다. 장비가 나오면 _+2_ 이상입니다.
actors.hero.talent.black_flame.title=흑염
actors.hero.talent.black_flame.desc=받는 피해가 _50%_ 증가합니다.\n\n_+1:_ 주는 피해가 _50%_ 증가합니다.\n\n_+2:_ 주는 피해가 _75%_ 증가합니다.\n\n_+3:_ 주는 피해가 _100%_ 증가합니다.

actors.hero.abilities.yesod.anomalymanual.name=환상체 대응 매뉴얼
actors.hero.abilities.yesod.anomalymanual.short_desc=예소드는 _환상체 대응 매뉴얼_을 따라 잠시 동안 받는 피해를 크게 줄일 수 있습니다.
actors.hero.abilities.yesod.anomalymanual.desc=예소드가 환상체 대응 매뉴얼을 펼쳐, _5턴_ 동안 받는 피해가 _50%_ 감소합니다.\n\n매뉴얼을 펼치는 데 _1턴_이 걸립니다.
actors.hero.abilities.yesod.anomalymanual$manualbuff.name=환상체 대응 매뉴얼
actors.hero.abilities.yesod.anomalymanual$manualbuff.desc=매뉴얼에 따라 침착하게 대응하고 있습니다. 받는 피해가 50%% 감소합니다.\n\n남은 턴: %s.
actors.hero.abilities.yesod.regretstrike.name=후회
actors.hero.abilities.yesod.regretstrike.prompt=후회를 내려칠 대상을 선택하세요
actors.hero.abilities.yesod.regretstrike.no_target=후회를 내려칠 적이 없습니다.
actors.hero.abilities.yesod.regretstrike.too_far=대상이 너무 멀리 있습니다.
actors.hero.abilities.yesod.regretstrike.blocked=대상 옆으로 뛰어들 공간이 없습니다.
actors.hero.abilities.yesod.regretstrike.short_desc=예소드는 _후회_로 적을 짓뭉개는 일격을 가하고 마비시킬 수 있습니다.
actors.hero.abilities.yesod.regretstrike.desc=예소드가 인접한 적에게 최대 피해가 _50%_ 증가한 근접 공격을 가합니다. 이 공격은 반드시 명중하며, 대상을 _5턴_ 동안 _마비_시킵니다. 보스는 _2턴_ 동안만 마비됩니다.
actors.hero.abilities.yesod.solemnlamentvolley.name=엄숙한 애도
actors.hero.abilities.yesod.solemnlamentvolley.prompt=사격할 대상을 선택하세요 (남은 탄환: %d)
actors.hero.abilities.yesod.solemnlamentvolley.short_desc=예소드는 _엄숙한 애도_의 탄환 _7발_을 한 발씩 겨누어 쏠 수 있습니다.
actors.hero.abilities.yesod.solemnlamentvolley.desc=예소드가 엄숙한 애도를 꺼내 탄환 _7발_을 한 발씩 직접 겨누어 쏩니다. 쏘는 동안에는 턴이 흐르지 않으며, 사격을 마치면 _1턴_이 지납니다. 선택을 취소하면 남은 탄환을 쏘지 않고 사격을 마칩니다.\n\n탄환은 E.G.O 엄숙한 애도처럼 WHITE 피해와 BLACK 피해를 각각 따로 주며, 탄환의 강화 수치는 _장착한 무기_를 따릅니다.

actors.hero.talent.extended_manual.title=연장 매뉴얼
actors.hero.talent.extended_manual.desc=_+1:_ 환상체 대응 매뉴얼의 지속 시간이 _1턴_ 늘어납니다.\n\n_+2:_ 환상체 대응 매뉴얼의 지속 시간이 _2턴_ 늘어납니다.\n\n_+3:_ 환상체 대응 매뉴얼의 지속 시간이 _3턴_ 늘어납니다.\n\n_+4:_ 환상체 대응 매뉴얼의 지속 시간이 _4턴_ 늘어납니다.
actors.hero.talent.damage_record.title=피해 기록
actors.hero.talent.damage_record.desc=_+1:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _1번_까지입니다.\n\n_+2:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _2번_까지입니다.\n\n_+3:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _3번_까지입니다.\n\n_+4:_ 환상체 대응 매뉴얼이 켜져 있는 동안 공격을 받으면 정보력을 _1_ 얻습니다. 한 번 쓸 때 최대 _4번_까지입니다.
actors.hero.talent.counter_guideline.title=반격 지침
actors.hero.talent.counter_guideline.desc=_+1:_ 환상체 대응 매뉴얼로 줄어든 피해의 _25%_를 공격자에게 되돌려줍니다.\n\n_+2:_ 환상체 대응 매뉴얼로 줄어든 피해의 _50%_를 공격자에게 되돌려줍니다.\n\n_+3:_ 환상체 대응 매뉴얼로 줄어든 피해의 _75%_를 공격자에게 되돌려줍니다.\n\n_+4:_ 환상체 대응 매뉴얼로 줄어든 피해의 _100%_를 공격자에게 되돌려줍니다.
actors.hero.talent.min_correction.title=구속당한 분노
actors.hero.talent.min_correction.desc=_+1:_ 후회의 최소 피해가 최대 피해의 _30%_ 아래로 내려가지 않습니다.\n\n_+2:_ 후회의 최소 피해가 최대 피해의 _45%_ 아래로 내려가지 않습니다.\n\n_+3:_ 후회의 최소 피해가 최대 피해의 _60%_ 아래로 내려가지 않습니다.\n\n_+4:_ 후회의 최소 피해가 최대 피해의 _75%_ 아래로 내려가지 않습니다.
actors.hero.talent.ripple.title=금속성 울림
actors.hero.talent.ripple.desc=_+1:_ 후회가 대상 주변 8칸의 적에게도 _15%_의 스플래시 피해를 입힙니다.\n\n_+2:_ 후회가 대상 주변 8칸의 적에게도 _30%_의 스플래시 피해를 입힙니다.\n\n_+3:_ 후회가 대상 주변 8칸의 적에게도 _45%_의 스플래시 피해를 입힙니다.\n\n_+4:_ 후회가 대상 주변 8칸의 적에게도 _60%_의 스플래시 피해를 입힙니다.
actors.hero.talent.pursuit.title=추격
actors.hero.talent.pursuit.desc=_+1:_ 후회로 _2칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.\n\n_+2:_ 후회로 _3칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.\n\n_+3:_ 후회로 _4칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.\n\n_+4:_ 후회로 _5칸_ 떨어진 적에게도 뛰어들어 공격할 수 있습니다.
actors.hero.talent.coffin.title=관
actors.hero.talent.coffin.desc=_+1:_ 엄숙한 애도의 탄환이 _1발_ 늘어납니다.\n\n_+2:_ 엄숙한 애도의 탄환이 _2발_ 늘어납니다.\n\n_+3:_ 엄숙한 애도의 탄환이 _3발_ 늘어납니다.\n\n_+4:_ 엄숙한 애도의 탄환이 _4발_ 늘어납니다.
actors.hero.talent.dead_butterfly.title=죽은나비
actors.hero.talent.dead_butterfly.desc=_+1:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _3_의 고정 피해를 줍니다.\n\n_+2:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _4_의 고정 피해를 줍니다.\n\n_+3:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _5_의 고정 피해를 줍니다.\n\n_+4:_ 엄숙한 애도의 탄환이 명중할 때마다 대상에게 _6_의 고정 피해를 줍니다.
actors.hero.talent.living_butterfly.title=산나비
actors.hero.talent.living_butterfly.desc=_+1:_ 엄숙한 애도의 탄환이 명중할 때마다 _1_의 보호막을 얻습니다.\n\n_+2:_ 엄숙한 애도의 탄환이 명중할 때마다 _2_의 보호막을 얻습니다.\n\n_+3:_ 엄숙한 애도의 탄환이 명중할 때마다 _3_의 보호막을 얻습니다.\n\n_+4:_ 엄숙한 애도의 탄환이 명중할 때마다 _4_의 보호막을 얻습니다.

# Ambitious imp vault mirror reward for Yesod
actors.mobs.npcs.vaultmirror.scene_yesod=당신에게 정보팀 사무실의 정리된 서류철 위에 개어진 _예소드의 목도리_가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 서류철의 보고서들은 한 장도 빠짐없이 결재되어 있지만, 그 어느 장에도 작성자의 이름이 적혀 있지 않습니다. 화면들은 모두 꺼져 있고, 사무실에는 정적만이 흐릅니다.
scenes.changesscene.github_notice=패치노트는 GitHub에서 확인해주세요.
scenes.changesscene.github_button=GitHub에서 패치노트 보기

###호드
actors.hero.heroclass.hod=호드
actors.hero.heroclass.hod_desc_short=교육팀의 세피라. _교육 매뉴얼 보급_으로 경험치를 더 얻고, 레벨이 오를수록 특성이 강해집니다.
actors.hero.heroclass.hod_desc=호드는 _교육 매뉴얼 보급_을 가지고 시작합니다. 적을 처치해 얻는 경험치가 _20%_ 증가하며, 현재 레벨과 같은 수의 _스택_을 가집니다. 호드의 특성은 스택이 많을수록 강해집니다.\n\n호드는 또한 _제압봉_, _투척용 돌_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n호드는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 강화의 주문서\n_-_ 경험의 물약
actors.hero.heroclass.hod_unlock=호드는 자동으로 해금됩니다.

actors.hero.heroclass.netzach=네짜흐
actors.hero.heroclass.netzach_desc_short=안전팀의 세피라. _농축 엔케팔린_으로 체력을 빌려 쓰며, 다양한 회복 수단으로 끈질기게 버팁니다.
actors.hero.heroclass.netzach_desc=네짜흐는 _농축 엔케팔린_을 가지고 시작합니다. 마시면 체력을 _전부_ 회복하지만, 회복한 만큼의 피해를 이후 몇 턴에 걸쳐 나눠 받습니다. 농축 엔케팔린은 _1회_까지 충전되며, _새로운 층_에 들어갈 때마다 충전됩니다.\n\n네짜흐는 또한 _제압봉_, _투척용 돌_, 정장, 가죽 물통, 벨벳 주머니를 가지고 시작합니다.\n\n네짜흐는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 자장가의 주문서\n_-_ 치유 물약
actors.hero.heroclass.netzach_unlock=네짜흐는 자동으로 해금됩니다.

actors.hero.heroclass.test_netzach=테스트 네짜흐
actors.hero.heroclass.test_netzach_desc_short=확인용 네짜흐. _30레벨_로 시작하며 _텐구의 가면_, _드워프 제왕의 왕관_과 테스트 도구를 가지고 있습니다.
actors.hero.heroclass.test_netzach_desc=디버그 빌드에서만 고를 수 있는 확인용 네짜흐입니다. 네짜흐와 똑같이 시작하지만 _30레벨_이며, 전직을 고를 _텐구의 가면_과 영웅 능력을 고를 _드워프 제왕의 왕관_을 가지고 있습니다. 모든 티어의 특성 포인트를 바로 쓸 수 있습니다.\n\n테스트 도구로 _모든 종류의 가방_, _힘 물약 10개_, _경험의 물약 30개_, _치유 물약 10개_, _강화 주문서 15장_, 10강 _연금술 도구_와 에너지 100, 원하는 E.G.O 장비를 만들 수 있는 _E.G.O 추출 장치_, 내성 시험용 과녁을 부르는 _과녁 소환기_, _L사 본사 출입증_를 함께 가지고 시작합니다.
actors.hero.heroclass.test_netzach_unlock=테스트 네짜흐는 디버그 빌드에서만 사용할 수 있습니다.
actors.hero.heroclass.test_tiphereth=테스트 티페리트
actors.hero.heroclass.test_tiphereth_desc_short=확인용 티페리트. _30레벨_로 시작하며 _텐구의 가면_, _드워프 제왕의 왕관_과 테스트 도구를 가지고 있습니다.
actors.hero.heroclass.test_tiphereth_desc=디버그 빌드에서만 고를 수 있는 확인용 티페리트입니다. 티페리트와 똑같이 시작하지만 _30레벨_이며, 전직을 고를 _텐구의 가면_과 영웅 능력을 고를 _드워프 제왕의 왕관_을 가지고 있습니다. 모든 티어의 특성 포인트를 바로 쓸 수 있습니다.\n\n테스트 도구로 _모든 종류의 가방_, _힘 물약 10개_, _경험의 물약 30개_, _치유 물약 10개_, _강화 주문서 15장_, 10강 _연금술 도구_와 에너지 100, 원하는 E.G.O 장비를 만들 수 있는 _E.G.O 추출 장치_, 내성 시험용 과녁을 부르는 _과녁 소환기_, _L사 본사 출입증_를 함께 가지고 시작합니다.
actors.hero.heroclass.test_tiphereth_unlock=테스트 티페리트는 디버그 빌드에서만 사용할 수 있습니다.

actors.hero.herosubclass.safety_sephirah=안전팀 세피라
actors.hero.herosubclass.safety_sephirah_short_desc=_안전팀 세피라_는 _자연 회복_이 훨씬 빨라져 체력을 더욱 오래 유지합니다.
actors.hero.herosubclass.safety_sephirah_desc=안전팀 세피라는 _자연 회복_ 속도가 _2배_가 되며, 체력이 _절반 이하_일 때는 _3배_가 됩니다.
actors.hero.herosubclass.art_librarian=예술의 층 지정사서
actors.hero.herosubclass.art_librarian_short_desc=_예술의 층 지정사서_는 공격할 때 적에게 _디버프_를 걸어 약화시키고 전장을 교란합니다.
actors.hero.herosubclass.art_librarian_desc=예술의 층 지정사서는 공격할 때 _25%_ 확률로 적에게 _약화_, _불구_, _광란_ 중 하나를 _3턴_ 동안 부여합니다.

items.concentratedenkephalin.name=농축 엔케팔린
items.concentratedenkephalin.ac_drink=마신다
items.concentratedenkephalin.desc=네짜흐가 몰래 숨겨둔 고농축 엔케팔린 앰플이다. 마시면 모든것이 나아지지만 잠깐일 뿐이다.\n\n마시면 체력을 _전부_ 회복합니다. 대신 회복한 만큼의 피해가 _지연된 피해_로 남아 이후 매 턴 나눠 들어옵니다. _새로운 층_에 들어갈 때마다 1회 충전됩니다.
items.concentratedenkephalin.charges=충전: _%1$d/%2$d_
items.concentratedenkephalin.no_charge=농축 엔케팔린이 충전되지 않았습니다. 새로운 층에 들어가면 충전됩니다.
items.concentratedenkephalin.full=이미 체력이 가득합니다.
items.concentratedenkephalin.drink=농축 엔케팔린을 마셔 체력을 %d 회복했다. 빌린 체력은 곧 갚아야 한다.
items.concentratedenkephalin.recharged=농축 엔케팔린이 충전되었다. (%1$d/%2$d)
items.concentratedenkephalin$overdose.name=과다 복용
items.concentratedenkephalin$overdose.desc=농축 엔케팔린 기운이 온몸을 달아오르게 합니다. 주는 피해가 증가합니다.\n\n남은 턴: %s.

actors.hero.talent.efficient.title=효율적으로
actors.hero.talent.efficient.desc=_+1:_ 네짜흐가 방어구를 _착용하는 즉시_ 감정합니다.\n\n_+2:_ 방어구를 착용 즉시 감정하고, 특성을 찍는 즉시 아직 모르는 물약 _4종류_를 감정합니다.
actors.hero.talent.hangover.title=숙취
actors.hero.talent.hangover.desc=_+1:_ _지연된 피해_를 받는 동안 주는 피해가 _2_ 증가합니다.\n\n_+2:_ _지연된 피해_를 받는 동안 주는 피해가 _3_ 증가합니다.
actors.hero.talent.slacking.title=근무 태만
actors.hero.talent.slacking.desc=_+1:_ 휴식하는 동안 _자연 회복_ 속도가 _1.5배_가 됩니다.\n\n_+2:_ 휴식하는 동안 _자연 회복_ 속도가 _2배_가 됩니다.
actors.hero.talent.resignation.title=자포자기
actors.hero.talent.resignation.desc=_+1:_ 체력이 _50%_ 이하일 때 방어력을 _1_ 얻습니다.\n\n_+2:_ 체력이 _50%_ 이하일 때 방어력을 _1~2_ 얻습니다.
actors.hero.talent.beer_vending.title=맥주 자판기
actors.hero.talent.beer_vending.desc=_+1:_ 식사에 _1턴_만 소모되며, 식사할 때 최대 체력의 _10%_를 회복합니다.\n\n_+2:_ 식사에 _1턴_만 소모되며, 식사할 때 최대 체력의 _15%_를 회복합니다.
actors.hero.talent.regenerator_mk2.title=재생로 Mk.2
actors.hero.talent.regenerator_mk2.desc=_+1:_ _자연 회복_으로 체력을 1 회복하는 데 걸리는 시간이 _2턴_ 줄어듭니다.\n\n_+2:_ _자연 회복_으로 체력을 1 회복하는 데 걸리는 시간이 _3턴_ 줄어듭니다.
actors.hero.talent.extra_ration.title=추가 배급
actors.hero.talent.extra_ration.desc=_+1:_ 농축 엔케팔린을 최대 _2회_까지 충전할 수 있습니다. 새로운 층에서는 1회 충전됩니다.\n\n_+2:_ 농축 엔케팔린을 최대 _2회_까지 충전할 수 있으며, 새로운 층에 들어갈 때 _50%_ 확률로 1회 더 충전됩니다.
actors.hero.talent.regenerator_fix.title=재생로 판별식 수정
actors.hero.talent.regenerator_fix.desc=_+1:_ 최대 체력을 넘겨 회복한 양의 _20%_를 _보호막_으로 얻습니다.\n\n_+2:_ 최대 체력을 넘겨 회복한 양의 _35%_를 _보호막_으로 얻습니다.\n\n치유 물약처럼 시간에 걸쳐 회복하는 효과와, 맥주 자판기의 회복에 적용됩니다.
actors.hero.talent.overdose.title=과다 복용
actors.hero.talent.overdose.desc=_+1:_ 농축 엔케팔린을 마시면 _10턴_ 동안 주는 피해가 _15%_ 증가합니다.\n\n_+2:_ 농축 엔케팔린을 마시면 _10턴_ 동안 주는 피해가 _25%_ 증가합니다.

actors.hero.talent.additional_dose.title=추가 투약
actors.hero.talent.additional_dose.desc=_+1:_ 농축 엔케팔린을 마시면 최대 체력의 _20%_만큼 _보호막_을 얻습니다.\n\n_+2:_ 농축 엔케팔린을 마시면 최대 체력의 _40%_만큼 _보호막_을 얻습니다.\n\n_+3:_ 농축 엔케팔린을 마시면 최대 체력의 _60%_만큼 _보호막_을 얻습니다.
actors.hero.talent.recovery_efficiency.title=회복 효율
actors.hero.talent.recovery_efficiency.desc=_+1:_ 모든 회복량이 _10%_ 증가합니다.\n\n_+2:_ 모든 회복량이 _20%_ 증가합니다.\n\n_+3:_ 모든 회복량이 _30%_ 증가합니다.\n\n_자연 회복_에는 적용되지 않습니다.
actors.hero.talent.hp_bullet.title=HP 탄환 보급
actors.hero.talent.hp_bullet.desc=_+1:_ 농축 엔케팔린을 마시면 시야 안의 _아군_도 최대 체력의 _50%_를 회복합니다.\n\n_+2:_ 농축 엔케팔린을 마시면 시야 안의 _아군_도 최대 체력의 _75%_를 회복합니다.\n\n_+3:_ 농축 엔케팔린을 마시면 시야 안의 _아군_도 최대 체력의 _100%_를 회복합니다.
actors.hero.talent.collapse_ampoule.title=붕괴 앰플
actors.hero.talent.collapse_ampoule.desc=_+1:_ _치유 물약_을 적에게 던지면 깨지면서, 네짜흐가 마셨을 때 회복하는 양의 _100%_만큼 고정 피해를 입힙니다.\n\n_+2:_ _치유 물약_을 적에게 던지면 깨지면서, 네짜흐가 마셨을 때 회복하는 양의 _150%_만큼 고정 피해를 입힙니다.\n\n_+3:_ _치유 물약_을 적에게 던지면 깨지면서, 네짜흐가 마셨을 때 회복하는 양의 _200%_만큼 고정 피해를 입힙니다.
actors.hero.talent.safety_secured.title=안전 확보
actors.hero.talent.safety_secured.desc=_+1:_ _지연된 피해_를 받는 동안 받는 피해가 _10%_ 감소합니다.\n\n_+2:_ _지연된 피해_를 받는 동안 받는 피해가 _20%_ 감소합니다.\n\n_+3:_ _지연된 피해_를 받는 동안 받는 피해가 _30%_ 감소합니다.\n\n지연된 피해 자체는 줄어들지 않습니다.
actors.hero.talent.incomprehensible.title=이해 불능
actors.hero.talent.incomprehensible.desc=_+1:_ 예술의 층 지정사서가 공격할 때 디버프를 걸 확률이 _40%_가 됩니다.\n\n_+2:_ 예술의 층 지정사서가 공격할 때 디버프를 걸 확률이 _50%_가 됩니다.\n\n_+3:_ 예술의 층 지정사서가 공격할 때 디버프를 걸 확률이 _50%_가 되며, 디버프가 걸릴 때 _50%_ 확률로 서로 다른 디버프가 _2개_ 걸립니다.
actors.hero.talent.fervent_emotion.title=열렬한 감동
actors.hero.talent.fervent_emotion.desc=_+1:_ 예술의 층 지정사서가 거는 디버프의 지속시간이 _1턴_ 증가합니다.\n\n_+2:_ 예술의 층 지정사서가 거는 디버프의 지속시간이 _2턴_ 증가합니다.\n\n_+3:_ 예술의 층 지정사서가 거는 디버프의 지속시간이 _3턴_ 증가합니다.
actors.hero.talent.finale.title=피날레
actors.hero.talent.finale.desc=_+1:_ 디버프가 _2개 이상_ 걸린 적에게 주는 피해가 _15%_ 증가합니다.\n\n_+2:_ 디버프가 _2개 이상_ 걸린 적에게 주는 피해가 _30%_ 증가합니다.\n\n_+3:_ 디버프가 _2개 이상_ 걸린 적에게 주는 피해가 _45%_ 증가합니다.
items.potions.potionofhealing.collapse=치유 물약이 깨지며 적의 몸을 무너뜨렸다!
actors.hero.abilities.netzach.neutralizinggas.name=정신 오염 중화 가스
actors.hero.abilities.netzach.neutralizinggas.short_desc=네짜흐는 주변에 _정신 오염 중화 가스_를 살포해, 가스 안의 아군이 디버프에 걸리지 않게 합니다.
actors.hero.abilities.netzach.neutralizinggas.desc=네짜흐가 자신을 중심으로 _5x5_ 범위에 _정신 오염 중화 가스_를 살포합니다. 가스는 퍼지지 않고 _10턴_ 동안 남습니다.\n\n가스 안에 있는 _아군_(네짜흐 포함)은 새로운 _디버프_에 걸리지 않습니다. 이미 걸린 디버프는 사라지지 않으며, 농축 엔케팔린 등으로 생긴 _지연된 피해_는 막지 못합니다.
actors.hero.abilities.netzach.neutralizinggas$gas.desc=정신 오염 중화 가스가 감돌고 있다. 이 안의 아군은 디버프에 걸리지 않는다.
actors.hero.abilities.netzach.ourgalaxy.name=우리의 은하수
actors.hero.abilities.netzach.ourgalaxy.short_desc=네짜흐는 _우리의 은하수_로 주변의 적들에게 피해를 주고, 준 피해만큼 체력을 회복합니다.
actors.hero.abilities.netzach.ourgalaxy.desc=하늘에서 _푸른 별빛_이 쏟아져, 네짜흐 주변 _7x7_ 범위 안의 보이는 모든 적에게 방어력을 무시하는 _3-6_의 고정 피해를 입힙니다.\n\n네짜흐는 입힌 피해의 합만큼 _체력을 회복_합니다.
actors.hero.abilities.netzach.dacapomovement.name=다카포
actors.hero.abilities.netzach.dacapomovement.short_desc=네짜흐는 _다카포_를 연주해 주변의 적에게 피해와 디버프를 줍니다. 연이어 연주할수록 범위와 피해가 커집니다.
actors.hero.abilities.netzach.dacapomovement.desc=네짜흐가 _다카포_를 연주해 주변의 모든 적에게 _WHITE 피해_를 주고 _5턴_ 동안 디버프를 겁니다. 연주는 _벽과 문을 넘어_ 울려 퍼집니다.\n\n_바로 다음 턴_에 다시 쓰면 다음 악장이 이어지며 악보가 하나씩 늘어납니다. 연주가 이어지는 동안 악보는 사라지지 않고 네짜흐의 곁을 맴돕니다. 그 사이에 _다른 행동_을 하면 연주가 끊겨 다시 1악장부터 시작합니다.\n\n_1악장:_ _5x5_ 범위, _12-24_ 피해, _약화_\n_2악장:_ _7x7_ 범위, _16-32_ 피해, _실명_\n_3악장:_ _9x9_ 범위, _20-40_ 피해, _현기증_\n_4악장:_ _11x11_ 범위, _24-48_ 피해, _취약_\n_피날레:_ 쌓인 악보가 퍼져 나가며 _13x13_ 범위, _28-56_ 피해, _광란_ (보스는 대신 _2턴_ 동안 _마비_)\n\n피날레가 끝나면 다시 1악장부터 시작합니다.
actors.hero.abilities.netzach.dacapomovement.movement_1=1악장
actors.hero.abilities.netzach.dacapomovement.movement_2=2악장
actors.hero.abilities.netzach.dacapomovement.movement_3=3악장
actors.hero.abilities.netzach.dacapomovement.movement_4=4악장
actors.hero.abilities.netzach.dacapomovement.movement_5=피날레
actors.hero.abilities.netzach.dacapomovement$movement.name=다카포 연주 중
actors.hero.abilities.netzach.dacapomovement$movement.desc=다카포의 연주가 이어지고 있습니다. 이번 턴에 다카포를 쓰면 다음 악장인 _%s_을(를) 연주합니다. 다른 행동을 하면 연주가 끊깁니다.
actors.hero.talent.wide_spray.title=광역 살포
actors.hero.talent.wide_spray.desc=_+1:_ 정신 오염 중화 가스의 범위가 _7x7_로 늘어납니다.\n\n_+2:_ 정신 오염 중화 가스의 범위가 _9x9_로 늘어납니다.\n\n_+3:_ 정신 오염 중화 가스의 범위가 _11x11_로 늘어납니다.\n\n_+4:_ 정신 오염 중화 가스의 범위가 _13x13_로 늘어납니다.
actors.hero.talent.purifying_mist.title=정화 처리
actors.hero.talent.purifying_mist.desc=_+1:_ 가스 안의 아군이 매 턴 체력을 _1_ 회복합니다.\n\n_+2:_ 가스 안의 아군이 매 턴 체력을 _2_ 회복합니다.\n\n_+3:_ 가스 안의 아군이 매 턴 체력을 _3_ 회복합니다.\n\n_+4:_ 가스 안의 아군이 매 턴 체력을 _4_ 회복합니다.
actors.hero.talent.lingering_gas.title=잔류 가스
actors.hero.talent.lingering_gas.desc=_+1:_ 정신 오염 중화 가스가 _15턴_ 동안 남습니다.\n\n_+2:_ 정신 오염 중화 가스가 _20턴_ 동안 남습니다.\n\n_+3:_ 정신 오염 중화 가스가 _25턴_ 동안 남습니다.\n\n_+4:_ 정신 오염 중화 가스가 _30턴_ 동안 남습니다.
actors.hero.talent.starlight.title=별빛 확산
actors.hero.talent.starlight.desc=_+1:_ 우리의 은하수의 범위가 _9x9_로 늘어납니다.\n\n_+2:_ 우리의 은하수의 범위가 _11x11_로 늘어납니다.\n\n_+3:_ 우리의 은하수의 범위가 _13x13_로 늘어납니다.\n\n_+4:_ 우리의 은하수의 범위가 _15x15_로 늘어납니다.
actors.hero.talent.starfall.title=쏟아지는 별
actors.hero.talent.starfall.desc=_+1:_ 우리의 은하수의 피해가 _4-7_로 늘어납니다.\n\n_+2:_ 우리의 은하수의 피해가 _5-8_로 늘어납니다.\n\n_+3:_ 우리의 은하수의 피해가 _6-9_로 늘어납니다.\n\n_+4:_ 우리의 은하수의 피해가 _7-10_으로 늘어납니다.
actors.hero.talent.galaxy_embrace.title=은하의 품
actors.hero.talent.galaxy_embrace.desc=_+1:_ 우리의 은하수로 최대 체력을 넘겨 회복한 양의 _33%_를 _보호막_으로 얻습니다.\n\n_+2:_ 우리의 은하수로 최대 체력을 넘겨 회복한 양의 _67%_를 _보호막_으로 얻습니다.\n\n_+3:_ 우리의 은하수로 최대 체력을 넘겨 회복한 양의 _100%_를 _보호막_으로 얻습니다.\n\n_+4:_ 우리의 은하수로 최대 체력을 넘겨 회복한 양의 _133%_를 _보호막_으로 얻습니다.
actors.hero.talent.trance.title=무아지경
actors.hero.talent.trance.desc=_+1:_ 다카포를 연주하는 동안 받는 피해가 _10%_ 감소합니다.\n\n_+2:_ 다카포를 연주하는 동안 받는 피해가 _20%_ 감소합니다.\n\n_+3:_ 다카포를 연주하는 동안 받는 피해가 _30%_ 감소합니다.\n\n_+4:_ 다카포를 연주하는 동안 받는 피해가 _40%_ 감소합니다.\n\n다음 악장을 이어 연주할 수 있는 동안이 연주 중으로 취급됩니다.
actors.hero.talent.fortissimo.title=포르티시모
actors.hero.talent.fortissimo.desc=_+1:_ 다카포의 피해가 _10%_ 증가합니다.\n\n_+2:_ 다카포의 피해가 _20%_ 증가합니다.\n\n_+3:_ 다카포의 피해가 _30%_ 증가합니다.\n\n_+4:_ 다카포의 피해가 _40%_ 증가합니다.
actors.hero.talent.fermata.title=페르마타
actors.hero.talent.fermata.desc=_+1:_ 다카포가 거는 디버프가 _6턴_ 동안 지속됩니다.\n\n_+2:_ 다카포가 거는 디버프가 _7턴_ 동안 지속됩니다.\n\n_+3:_ 다카포가 거는 디버프가 _8턴_ 동안 지속됩니다.\n\n_+4:_ 다카포가 거는 디버프가 _9턴_ 동안 지속됩니다.\n\n피날레에서 보스가 받는 마비는 2턴으로 고정됩니다.
actors.mobs.npcs.vaultmirror.scene_netzach=당신에게 안전팀 휴게실의 소파 위에 놓인 _농축 엔케팔린_ 앰플이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 앰플은 한 번도 따지 않은 듯 가득 차 있고, 빈 맥주 캔들 사이로 누군가 앉아 있던 자국만이 남아 있습니다. 휴게실은 조용하고, 비상벨은 울리지 않습니다.

actors.hero.herosubclass.training_sephirah=교육팀 세피라
actors.hero.herosubclass.training_sephirah_short_desc=_교육팀 세피라_는 최대 레벨이 _40_으로 늘어나고, 더 높은 레벨에서도 적에게서 경험치를 얻습니다.
actors.hero.herosubclass.training_sephirah_desc=교육팀 세피라는 최대 레벨이 _30_에서 _40_으로 늘어납니다. 31레벨부터는 특성 포인트를 얻지 못하지만 체력, 정확도, 회피는 계속 오르고 교육 매뉴얼 보급의 스택도 계속 쌓입니다.\n\n또한 _경험치 제한 레벨_이 _5_ 늘어나, 원래라면 경험치를 주지 않을 만큼 레벨 차이가 나는 적에게서도 5레벨까지 더 경험치를 얻습니다.
actors.hero.herosubclass.literature_librarian=문학의 층 지정사서
actors.hero.herosubclass.literature_librarian_short_desc=_문학의 층 지정사서_는 공격할 때마다 _출혈_을 부여하고, _속박_된 적에게 더 큰 피해를 줍니다.
actors.hero.herosubclass.literature_librarian_desc=문학의 층 지정사서는 공격할 때마다 교육 매뉴얼 보급 스택의 _절반_만큼 _출혈_을 부여합니다.\n\n또한 _속박_된 적에게 주는 피해가 _20%_ 증가합니다.

actors.hero.hod.hodmanual.name=교육 매뉴얼 보급
actors.hero.hod.hodmanual.desc=교육팀이 정성껏 정리해 보급한 교육 매뉴얼입니다. 적을 처치해 얻는 경험치가 _%2$d%%_ 증가합니다.\n\n스택은 호드의 레벨과 같으며, 호드의 특성은 스택이 많을수록 강해집니다.\n\n현재 스택: _%1$d_
actors.hero.hod.hodmanual.vault=금고의 거울에서 받은 교육 덕분에, 금고 안에서는 스택이 _%d_ 늘어나 있습니다.

actors.hero.talent.rest_time.title=휴식 시간
actors.hero.talent.rest_time.desc=_+1:_ 레벨이 오를 때마다 _스택_만큼 체력을 회복합니다.\n\n_+2:_ 레벨이 오를 때마다 _스택의 2배_만큼 체력을 회복합니다.
actors.hero.talent.work_familiarity.title=업무 숙지
actors.hero.talent.work_familiarity.desc=_+1:_ 무기, 방어구, 반지를 _2배_ 빠르게 감정합니다.\n\n_+2:_ 무기, 방어구, 반지를 _3배_ 빠르게 감정합니다.
actors.hero.talent.practical_eval.title=실습 평가
actors.hero.talent.practical_eval.desc=_+1:_ 각 적에게 처음 적중한 공격이 _스택의 1/3_만큼 추가 피해를 줍니다.\n\n_+2:_ 각 적에게 처음 적중한 공격이 _스택의 2/3_만큼 추가 피해를 줍니다.
actors.hero.talent.safety_training.title=안전 교육
actors.hero.talent.safety_training.desc=_+1:_ 층마다 처음으로 체력이 _50%_ 아래로 떨어지면 _스택_만큼 보호막을 얻습니다.\n\n_+2:_ 층마다 처음으로 체력이 _50%_ 아래로 떨어지면 _스택의 2배_만큼 보호막을 얻습니다.
actors.hero.talent.lunch_seminar.title=점심 세미나
actors.hero.talent.lunch_seminar.desc=_+1:_ 식사에 _1턴_만 소모되며, 식사로 실제로 회복한 허기의 _5%_만큼 경험치를 얻습니다.\n\n_+2:_ 식사에 _1턴_만 소모되며, 식사로 실제로 회복한 허기의 _7.5%_만큼 경험치를 얻습니다.\n\n이 경험치는 교육 매뉴얼 보급의 보너스를 받지 않습니다.
actors.hero.talent.job_training.title=직무 교육 강화
actors.hero.talent.job_training.desc=_+1:_ 교육 매뉴얼 보급의 경험치 보너스가 _10%_ 늘어나 _30%_가 됩니다.\n\n_+2:_ 교육 매뉴얼 보급의 경험치 보너스가 _20%_ 늘어나 _40%_가 됩니다.
actors.hero.talent.basic_fitness.title=기초 체력 훈련
actors.hero.talent.basic_fitness.desc=_+1:_ 최대 체력이 _스택의 절반_만큼 증가합니다.\n\n_+2:_ 최대 체력이 _스택_만큼 증가합니다.
actors.hero.talent.demo_training.title=시범 훈련
actors.hero.talent.demo_training.desc=_+1:_ 스택 1당 정확도가 _1%_ 증가합니다.\n\n_+2:_ 스택 1당 정확도가 _1.5%_ 증가합니다.
actors.hero.talent.field_adaptation.title=실무 적응
actors.hero.talent.field_adaptation.desc=_+1:_ 스택 1당 회피가 _0.5%_ 증가합니다.\n\n_+2:_ 스택 1당 회피가 _1%_ 증가합니다.
actors.hero.talent.potential_dev.title=잠재력 개발
actors.hero.talent.potential_dev.desc=_+1:_ 스택 _15_마다 장착한 _무기_의 강화 수치가 _1_ 증가합니다.\n\n_+2:_ 스택 _15_마다 장착한 _무기와 방어구_의 강화 수치가 _1_ 증가합니다.\n\n_+3:_ 스택 _15_마다 장착한 _무기, 방어구, 반지_의 강화 수치가 _1_ 증가합니다.
actors.hero.talent.training_result.title=교육 성과
actors.hero.talent.training_result.desc=_+1:_ 스택 1당 주는 피해가 _0.5%_ 증가합니다.\n\n_+2:_ 스택 1당 주는 피해가 _1%_ 증가합니다.\n\n_+3:_ 스택 1당 주는 피해가 _1.5%_ 증가합니다.
actors.hero.talent.clumsy_goodwill.title=어수룩한 호의
actors.hero.talent.clumsy_goodwill.desc=_+1:_ 스택 _4_마다 최대 방어력이 _1_ 증가합니다.\n\n_+2:_ 스택 _3_마다 최대 방어력이 _1_ 증가합니다.\n\n_+3:_ 스택 _2_마다 최대 방어력이 _1_ 증가합니다.
actors.hero.talent.hope_it_helps.title=도움이 되었으면
actors.hero.talent.hope_it_helps.desc=_+1:_ 레벨이 오르거나 경험의 물약을 마시면 _2턴_ 동안 무적이 됩니다.\n\n_+2:_ 레벨이 오르거나 경험의 물약을 마시면 _3턴_ 동안 무적이 됩니다.\n\n_+3:_ 레벨이 오르거나 경험의 물약을 마시면 _4턴_ 동안 무적이 됩니다.\n\n무적인 동안에는 피의 성배로 자신을 찌를 수 없습니다.
actors.hero.talent.certificate.title=수료증 발급
actors.hero.talent.certificate.desc=_+1:_ 경험치 제한 레벨이 _5_ 대신 _7_ 늘어납니다.\n\n_+2:_ 경험치 제한 레벨이 _5_ 대신 _9_ 늘어납니다.\n\n_+3:_ 경험치 제한 레벨이 _5_ 대신 _11_ 늘어납니다.
actors.hero.talent.obsession.title=집착
actors.hero.talent.obsession.desc=_+1:_ 공격으로 부여하는 출혈이 _33%_ 증가합니다.\n\n_+2:_ 공격으로 부여하는 출혈이 _66%_ 증가합니다.\n\n_+3:_ 공격으로 부여하는 출혈이 _100%_ 증가합니다.
actors.hero.talent.cocoon.title=고치
actors.hero.talent.cocoon.desc=_+1:_ 공격이 적중하면 대상에게 _1턴_의 마비와 _2턴_의 속박, 취약을 겁니다. 재사용 대기시간은 _20턴_입니다.\n\n_+2:_ 공격이 적중하면 대상에게 _1턴_의 마비와 _2턴_의 속박, 취약을 겁니다. 재사용 대기시간은 _15턴_입니다.\n\n_+3:_ 공격이 적중하면 대상에게 _1턴_의 마비와 _2턴_의 속박, 취약을 겁니다. 재사용 대기시간은 _10턴_입니다.
actors.hero.talent.old_umbrella.title=낡은 양산
actors.hero.talent.old_umbrella.desc=_+1:_ 공격받을 때 _10%_ 확률로 그 피해를 공격자에게 모두 반사하고, 자신은 피해를 받지 않습니다.\n\n_+2:_ 공격받을 때 _12.5%_ 확률로 그 피해를 공격자에게 모두 반사하고, 자신은 피해를 받지 않습니다.\n\n_+3:_ 공격받을 때 _15%_ 확률로 그 피해를 공격자에게 모두 반사하고, 자신은 피해를 받지 않습니다.
actors.hero.hod.hodtrackers.reflect=반사
actors.hero.hod.hodtrackers$cocooncooldown.name=고치 재사용 대기
actors.hero.hod.hodtrackers$cocooncooldown.desc=고치를 다시 사용할 수 있을 때까지 기다려야 합니다.\n\n남은 턴: %s

# Ambitious imp vault mirror reward for Hod
actors.mobs.npcs.vaultmirror.scene_hod=당신에게 교육팀 강의실의 교탁 위에 펼쳐진 _교육 매뉴얼_이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 매뉴얼의 모든 장에는 정성스러운 메모가 빼곡하지만, 그 내용을 들어 줄 직원은 아무도 없습니다. 칠판에는 '오늘의 교육'이 지워지지 않은 채 남아 있고, 빈 의자들만이 줄지어 놓여 있습니다.
actors.mobs.npcs.angela.name=앤젤라
actors.mobs.npcs.angela.desc=L사의 AI 비서. 은빛에서 하늘색으로 물드는 긴 머리를 한쪽으로 묶고, 정장 위에 흰 가운을 걸쳤다. 두 손을 모은 채 눈을 감고 있지만, 당신의 움직임 하나하나를 지켜보고 있는 것 같다.
actors.mobs.npcs.angela.welcome_1=...아, 드디어 오셨군요. 기다리고 있었습니다.\n\n로보토미 코퍼레이션에 오신 것을 환영합니다. 저는 이곳의 업무를 보조하는 AI, 앤젤라입니다.
actors.mobs.npcs.angela.welcome_2=이 아래에서는 수많은 시련이 당신을 기다리고 있습니다. 시련을 극복하면 그 대가로 _엔케팔린 박스_를 얻을 수 있죠.\n\n저는 그 엔케팔린을 받고 당신을 돕겠습니다. 원하는 E.G.O를 추출하거나, 지니고 있는 E.G.O를 정제하는 일 말이에요.
actors.mobs.npcs.angela.welcome_3=첫 만남을 기념해 엔케팔린 박스 _%d개_를 창고에 넣어 두었습니다. 창고는 메인 화면이나 일지에서 확인하실 수 있습니다.\n\n부디 현명하게 사용하시길 바랍니다. ...그럼, 오늘도 좋은 하루 되세요.
actors.mobs.npcs.angela.welcome_reward=앤젤라에게서 엔케팔린 박스 %1$d개를 받아 창고에 보관했다. (보유: %2$d개)
actors.mobs.npcs.angela.menu=안녕하세요. 저는 L사의 AI 비서, 앤젤라입니다. 무엇을 도와드릴까요?\n\n창고의 엔케팔린 박스: _%d개_
actors.mobs.npcs.angela.menu_ordeal=%s
actors.mobs.npcs.angela.menu_extract=E.G.O 추출
actors.mobs.npcs.angela.menu_extract_used=E.G.O 추출 (사용함)
actors.mobs.npcs.angela.menu_refine=E.G.O 정제
actors.mobs.npcs.angela.menu_refine_used=E.G.O 정제 (사용함)
actors.mobs.npcs.angela.menu_leave=대화를 마친다
actors.mobs.npcs.angela.menu_aside=비켜 달라고 한다
actors.mobs.npcs.angela.menu_elevator=엘리베이터
actors.mobs.npcs.angela.boss_menu=이곳에서는 보스전에 입장하실 수 있습니다. 어떤 보스전에 도전하시겠습니까?
actors.mobs.npcs.angela.boss_preparing=준비 중
actors.mobs.npcs.angela.boss_blue_star=푸른 별
actors.mobs.npcs.angela.boss_accept=제압을 시작한다
actors.mobs.npcs.angela.boss_confirm=_%s_ 제압을 시작하시겠습니까?\n\n제압은 L사 본사에서 진행됩니다. 제압이 끝날 때까지 본사를 떠날 수 없습니다.
actors.mobs.npcs.angela.boss_start_blue_star=중앙본부 로비 한가운데에서 푸른 별이 깨어났습니다. 푸른 별은 매 순간 본사 전체에 푸른 충격파를 퍼뜨립니다. 피할 곳은 없습니다. 끝까지 버텨 내십시오.
actors.mobs.npcs.angela.elevator=_귀환의 신호기_ %1$d개를 지불하시면 엘리베이터로 제가 있는 다른 층까지 모셔다 드리겠습니다. 이미 가 보신 층으로만 이동할 수 있습니다.\n\n보유한 귀환의 신호기: _%2$d개_
actors.mobs.npcs.angela.elevator_no_beacon=귀환의 신호기가 부족합니다.
actors.mobs.npcs.angela.elevator_floor=%d층으로 이동
actors.mobs.npcs.angela.elevator_floor_locked=%d층으로 이동 (아직 가 보지 않은 층)
actors.mobs.npcs.angela.elevator_ride=앤젤라의 엘리베이터를 타고 %d층으로 이동했다.
actors.mobs.npcs.angela.elevator_blocked=지금은 엘리베이터를 운행할 수 없습니다.
actors.mobs.npcs.angela.elevator_ascent=역행 중에는 엘리베이터를 운행하지 않습니다. 직접 올라가셔야 합니다.
actors.mobs.npcs.angela.aside=실례했습니다. 지나가시죠.
actors.mobs.npcs.angela.offer=곧 이 층에 _%1$s_이 등장할 예정입니다. 시련을 극복하시면 엔케팔린 박스 _%2$d개_를 드리겠습니다.\n\n시련을 맞이하시겠습니까?
actors.mobs.npcs.angela.not_enough=엔케팔린 박스가 부족합니다.
actors.mobs.npcs.angela.extracted=%1$s을(를) 추출했다. (엔케팔린 박스 -%2$d, 남은 박스: %3$d개)
actors.mobs.npcs.angela.extract_done=추출이 끝났습니다. 유용하게 쓰시길 바랍니다.
actors.mobs.npcs.angela.refine_prompt=정제할 E.G.O 장비를 고르세요 (+2 미만)
actors.mobs.npcs.angela.refine_confirm=정말 _%1$s_을(를) 정제해 1단계 강화하시겠습니까?\n\n엔케팔린 박스 _%2$d개_가 사용되며, 정제는 이번 게임에서 한 번만 할 수 있습니다. (보유: %3$d개)
actors.mobs.npcs.angela.refine_yes=정제한다 (박스 %d개)
actors.mobs.npcs.angela.cancel=취소
