###Lobotomy Corporation / Library of Ruina mod strings
###이 모드의 문자열은 한국어로만 작성한다. 원본 번들과 분리해 두어 업스트림 병합을 쉽게 한다.
###무기/갑옷의 능력치 문장은 따로 두지 않고 게임의 원본 번역문을 고쳐 쓴다(lobotomy/EgoText).

