name: Release

# builds the release APK and Windows app and publishes them on the Releases page.
# Either push a version tag (e.g. v0.1.0), or run this workflow by hand on a branch with a tag name:
# the tag is then created on that branch's commit when the release is published.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/build/outputs/apk/release/*.apk "out/SefirotPixelDungeon-${TAG#v}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows app image
        shell: bash
        run: ./gradlew --no-daemon :desktop:jpackageImage

      - name: Zip Windows app
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "desktop/build/jpackage/Sefirot Pixel Dungeon" -DestinationPath "out/SefirotPixelDungeon-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*.zip
          if-no-files-found: error

  publish:
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # patch notes come from release-notes/<tag>.md when that file exists
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
          path: repo

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "Sefirot Pixel Dungeon ${TAG}"
            echo
            if [ -f "repo/release-notes/${TAG}.md" ]; then
              cat "repo/release-notes/${TAG}.md"
              echo
            fi
          } > body.md
          cat body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Sefirot Pixel Dungeon ${{ env.TAG }}
          files: dist/*
          body_path: body.md
