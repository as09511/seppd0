name: Release

# push a version tag (e.g. v0.1.0) to build the release APK and Windows app and publish them on the Releases page
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/build/outputs/apk/release/*.apk "out/SefirotPixelDungeon-${TAG#v}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows app image
        shell: bash
        run: ./gradlew --no-daemon :desktop:jpackageImage

      - name: Zip Windows app
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "desktop/build/jpackage/Sefirot Pixel Dungeon" -DestinationPath "out/SefirotPixelDungeon-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*.zip
          if-no-files-found: error

  publish:
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Sefirot Pixel Dungeon ${{ env.TAG }}
          files: dist/*
          body: |
            Sefirot Pixel Dungeon ${{ env.TAG }}

            **안드로이드**: `SefirotPixelDungeon-*.apk`를 받아 설치합니다. 테스트용(debug) 앱과는 별개의 앱으로 설치되고 세이브도 따로입니다.
            **Windows**: `SefirotPixelDungeon-*-windows.zip`을 풀고 `Sefirot Pixel Dungeon.exe`를 실행합니다. Java를 따로 설치할 필요는 없습니다.

            이 릴리즈는 저장소에 공개된 디버그 키로 서명되어 있습니다.
